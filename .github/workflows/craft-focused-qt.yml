name: Craft / Focused Windows Qt

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/craft-focused-qt.yml'
      - 'app/pages/craft_page.py'
      - 'local_dofus_data/normalizer.py'
      - 'local_dofus_data/repositories.py'
      - 'tests/test_craft_fixes.py'
      - 'tests/test_craft_category_search.py'
      - 'tests/test_craft_minimal_lazy.py'
      - 'tests/test_craft_compatibility_adapter.py'

permissions:
  contents: read

concurrency:
  group: atlas-craft-qt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  craft-qt:
    name: Craft / Exact-SHA Qt tests (Windows, synthetic)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR HEAD without credentials or LFS assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          lfs: false
      - name: Verify immutable candidate SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) {
            throw "Craft test checkout differs from PR HEAD"
          }
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Windows runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute Craft regressions against exact SHA
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_craft_fixes tests.test_craft_category_search tests.test_craft_minimal_lazy tests.test_craft_compatibility_adapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Synthetic offscreen tests prove code paths, not availability of real
      # leveling JSON, Git LFS sprites, a clean install or DOFUS interactions.
