name: Guides 363 / Phase-0 branch qualification

on:
  push:
    branches:
      - 'feat/atlas-guide-importer-pr337-20261102'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/guides-363-phase0.yml'
      # AI fingerprint-only commits must still get exact-SHA Phase 0 coverage.
      - '.ai/context_index.json'
      - 'tools/atlas_guide_*.py'
      - 'app/modules/encyclopedia/services/guide_*.py'
      - 'app/modules/encyclopedia/views/shared_manual_guide_view.py'
      - 'tests/test_atlas_guide_*.py'
      - 'tests/test_guide_shared_route_contract.py'
      - 'tests/test_guide_imported_manual_runtime_ui.py'
      - 'tests/test_guide_progress_persistence.py'
      - 'tests/test_guide_imported_manual_runtime_service.py'
      - 'tests/test_guide_trusted_source_package.py'
      - 'tests/test_guide_entity_identity.py'
      - 'tests/test_guide_preparation_model.py'
      - 'tests/test_guide_preparation_model_qt.py'

permissions:
  contents: read

concurrency:
  group: atlas-guide363-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide-core:
    name: Guides / Phase 0 stdlib parity (exact SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          lfs: false
      - name: Check exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run synthetic import, conformity, storage and sequence gates
        run: |
          python -X faulthandler -m unittest discover -v -s tests -p 'test_atlas_guide_*.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_guide_trusted_source_package.py'
      - name: Record machine-readable Linux Phase 0 test evidence
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["CANDIDATE_SHA"]
          if actual != expected:
              raise SystemExit("Phase 0 evidence SHA does not match checked-out source")
          payload = {
              "schema_version": 1,
              "kind": "atlas_guide_phase0_synthetic_test_evidence",
              "status": "PASS_SYNTHETIC_TESTS_ONLY",
              "head_sha": actual,
              "utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "runner_os": os.environ.get("RUNNER_OS"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "test_suites": ["test_atlas_guide_*.py", "test_guide_trusted_source_package.py (discovery, Qt-free)"],
              "real_guide_count": 0,
              "certified": False,
              "source_rights_verified": False,
              "dofus_unity_gameplay_tested": False,
          }
          out = pathlib.Path("artifacts/guide_phase0/linux.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload synthetic Linux Guide Phase 0 evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-guide-phase0-linux-${{ env.CANDIDATE_SHA }}
          path: artifacts/guide_phase0/linux.json
          if-no-files-found: error

  guide-qt:
    name: Guides / Phase 0 Qt UI (Windows, synthetic)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          lfs: false
      - name: Check exact SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) {
            throw "Guide Phase 0 checkout differs from branch SHA"
          }
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned runtime
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise shared Guide UI with fictional guide fixtures
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_guide_shared_route_contract tests.test_guide_manual_selected_validation tests.test_guide_imported_manual_runtime_ui tests.test_guide_preparation_model_qt tests.test_guide_ultime_manual_ui_navigation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise real on-disk character isolation and pure Guide services
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_guide_progress_persistence tests.test_guide_imported_manual_runtime_service tests.test_guide_trusted_source_package tests.test_guide_entity_identity tests.test_guide_preparation_model
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record machine-readable Windows Phase 0 test evidence
        shell: pwsh
        run: |
          @'
          import datetime, json, os, pathlib, subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["CANDIDATE_SHA"]
          if actual != expected:
              raise SystemExit("Phase 0 evidence SHA does not match checked-out source")
          payload = {
              "schema_version": 1,
              "kind": "atlas_guide_phase0_synthetic_test_evidence",
              "status": "PASS_SYNTHETIC_TESTS_ONLY",
              "head_sha": actual,
              "utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "runner_os": os.environ.get("RUNNER_OS"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "test_suites": ["tests.test_guide_shared_route_contract","tests.test_guide_manual_selected_validation","tests.test_guide_imported_manual_runtime_ui","tests.test_guide_preparation_model_qt","tests.test_guide_ultime_manual_ui_navigation","tests.test_guide_progress_persistence","tests.test_guide_imported_manual_runtime_service","tests.test_guide_trusted_source_package","tests.test_guide_entity_identity","tests.test_guide_preparation_model"],
              "real_guide_count": 0,
              "certified": False,
              "source_rights_verified": False,
              "dofus_unity_gameplay_tested": False,
          }
          out = pathlib.Path("artifacts/guide_phase0/windows.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload synthetic Windows Guide Phase 0 evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-guide-phase0-windows-${{ env.CANDIDATE_SHA }}
          path: artifacts/guide_phase0/windows.json
          if-no-files-found: error
      # Never import, preview, certify or publish a real source guide.
      # These tests are not Ganymède provenance or DOFUS gameplay evidence.
