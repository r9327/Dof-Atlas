name: Guides / Focused Windows Proof

on:
  pull_request:
    types: [synchronize, ready_for_review]
    paths:
      - '.github/workflows/guides-focused-proof.yml'
      - 'tests/test_guide_manual_selected_validation.py'
      - 'tests/test_guide_preparation_model.py'
      - 'tests/test_lazy_quests_detail_cache.py'
      - 'app/modules/encyclopedia/providers/quest_provider.py'
      - 'app/modules/encyclopedia/views/guide_ultime_manual_view.py'
      - 'app/modules/encyclopedia/services/guide_preparation_model.py'
      - 'app/modules/encyclopedia/views/shared_manual_guide_view.py'
      - 'app/modules/encyclopedia/views/guide_catalog_view.py'
      - 'tools/atlas_doctor_lib/guide_ui_cycle_bench.py'
      - 'tools/atlas_doctor_lib/doctor_ui_qt.py'
      - 'tools/atlas_doctor_lib/doctor_ui.py'
      - 'tests/test_doctor_ui.py'
      - 'tests/test_doctor_guide_ui_cycle_bench.py'
      - 'app/modules/encyclopedia/views/guide_featured_home.py'
      - 'app/modules/encyclopedia/widgets/guide_card.py'
      - 'app/ui/unity_skin.py'
      - 'app/ui/components.py'
      - 'tests/test_guide_library_home.py'
      - 'tests/test_guide_home_two_columns.py'
      - 'tests/test_lanyel_shared_manual_ui.py'
      - 'tests/test_unity_skin.py'
      - 'app/pages/craft_page.py'
      - 'tests/test_craft_minimal_lazy.py'
      - 'tests/test_guide_prebuilt_route.py'
      - 'tests/test_guide_catalog_route_store_relative.py'
      - 'app/modules/encyclopedia/services/guide_catalog_prebuilt_route.py'
      - 'app/modules/encyclopedia/services/guide_catalog_manual_runtime_service.py'
      - 'scripts/windows/build_guide_routes.py'
      - 'scripts/windows/build_guide_rewards.py'
      - 'app/modules/encyclopedia/services/guide_prebuilt_rewards.py'
      - 'tests/test_guide_prebuilt_rewards.py'
      - 'tests/test_quest_index_prebuilt.py'
      - 'app/quest_index_prebuilt.py'
      - 'app/quest_catalog_details.py'
      - 'app/quest_source_index.py'
      - 'app/startup_cache_domain_worker.py'
      - 'app/modules/encyclopedia/providers/memory_bound_guide_provider.py'
      - 'app/modules/encyclopedia/providers/dofus_item_provider.py'
      - 'app/modules/encyclopedia/providers/memory_bound_achievement_provider.py'
      - 'app/startup_cache_warmup.py'
      - 'tests/test_startup_warmup_subprocess_flags.py'
      - 'tests/test_guide_cold_relation_lookup.py'
      - 'tests/test_guide_entity_query_reuse.py'
      - 'tests/test_compact_guide_item_effects.py'
      - 'tests/test_achievement_compact_subprocess_lifecycle.py'
      - 'tests/test_achievement_frozen_detail_runtime.py'
      - 'app/modules/encyclopedia/services/achievement_index_warmup.py'
      - 'tests/test_shared_guide_combat_global_contract.py'
      - 'scripts/windows/build_quest_index.py'
      - 'app/modules/encyclopedia/views/guides_view.py'
      - 'app/modules/encyclopedia/views/achievements_view.py'
      - 'tests/test_success_async_detail_runtime.py'
      - 'tests/test_encyclopedia_success_detail_prewarm.py'
      - 'tests/test_guides_home_render_cache.py'
      - 'tests/test_quest_source_boundaries.py'
      - 'app/modules/encyclopedia/services/guide_ultime_manual_runtime_core.py'
      - 'app/ui/world_scan_panel.py'
      - 'tests/test_world_scan_async_loading.py'
      - 'tests/test_shell_home_character_compact.py'
      - 'tests/test_guide_manual_contract_row_cache.py'
      - 'tests/test_guide_ultime_manual_runtime_text.py'

permissions:
  contents: read

concurrency:
  group: atlas-guides-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  doctor-ui-visual-campaign:
    # Reuse Doctor's production Qt capture engine. It collects real
    # screenshot PNGs, widget-tree assertions and a hash-verified verdict
    # as GitHub Actions artifacts. It is NOT a release/full certification.
    name: Doctor / Guides visual capture pack
    uses: ./.github/workflows/doctor-ui.yml
    with:
      base_ref: main
      complete_campaign: true

  guide-targeted-windows:
    # No repeated Windows setup on Draft pushes; focused local contracts only.
    if: ${{ github.event.pull_request.draft == false }}
    name: Guides / Selected unit + Qt Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      PYTHONUTF8: '1'
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          lfs: false
      - name: Verify SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) {
            throw "Checkout does not match exact candidate SHA"
          }
      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Pure-stdlib Doctor Guide benchmark contracts
        shell: pwsh
        run: python -X faulthandler -m unittest -v tests.test_doctor_guide_ui_cycle_bench tests.test_doctor_ui
      - name: Install pinned runtime for focused Qt tests
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
      - name: Materialize only needed public Guide fixture data
        shell: pwsh
        run: |
          git lfs pull --include="tools/doduda/doduda.exe,data/images/misc/dofus_atlas_logo.png" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.windows.quest_assets --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.windows.craft_seed --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Qt Guide catalogue, Unity icons and compact header
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_guide_library_home tests.test_guide_home_two_columns tests.test_unity_skin tests.test_lanyel_shared_manual_ui.LanyelSharedManualUiTests.test_navigation_and_compact_headers_have_the_requested_hierarchy tests.test_lanyel_shared_manual_ui.LanyelSharedManualUiTests.test_validate_click_without_selected_identity_opens_portrait_picker tests.test_lanyel_shared_manual_ui.LanyelSharedManualUiTests.test_preparation_item_name_is_click_to_copy_even_in_preview tests.test_lanyel_shared_manual_ui.LanyelSharedManualUiTests.test_guide_legend_starts_collapsed_and_can_show_help tests.test_lanyel_shared_manual_ui.LanyelSharedManualUiTests.test_route_progress_advances_when_the_current_sheet_is_validated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Targeted manual multi-character validation
        shell: pwsh
        run: python -X faulthandler -m unittest -v tests.test_guide_manual_selected_validation
      - name: Portable Sylvestre release-index integrity and fallback
        shell: pwsh
        run: python -X faulthandler -m unittest -v tests.test_guide_prebuilt_route
      - name: Relative SQLite cache integrity, missing file, compressed corruption
        shell: pwsh
        run: python -X faulthandler -m unittest -v tests.test_guide_catalog_route_store_relative
      - name: Read-only Windows cartography placeholder fallback
        shell: pwsh
        run: python -X faulthandler -m unittest -v tests.test_cartography_asset_readonly_fallback
      - name: Ganymede dynamic cutover and trusted source contracts
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_ganymede_cutover tests.test_ganymede_source_cutovers tests.test_ganymede_trusted_cutovers
      - name: Real 20 Ganymede trusted cutovers and catalog readiness audit
        shell: pwsh
        run: python -X faulthandler -m unittest -v tests.test_ganymede_live_cutover_inventory
      - name: Canonical reward precompile / alignment regressions
        shell: pwsh
        run: python -X faulthandler -m unittest -v tests.test_guide_prebuilt_rewards
      - name: Portable first-boot Quest SQLite index contracts
        shell: pwsh
        run: python -X faulthandler -m unittest -v tests.test_quest_index_prebuilt
      - name: Batch Quest Guide-evidence parity (no rich Quest hydration)
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_lazy_quests_detail_cache.QuestEvidenceBatchTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Targeted preparation accounting if present
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "tests/test_guide_preparation_model.py") {
            python -X faulthandler -m unittest -v tests.test_guide_preparation_model
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Preparation model not part of this candidate; skipped by scope."
          }
      - name: Isolated Qt preparation and atomic Ready tests if present
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "tests/test_guide_preparation_model_qt.py") {
            python -X faulthandler -m unittest -v tests.test_guide_preparation_model_qt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Focused preparation Qt test not in this candidate."
          }
      - name: Real Qt preparation navigation and typed resource filters
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_guide_ultime_manual_ui_navigation.GuideUltimeManualUiNavigationTests.test_preparation_aggregates_exact_participant_needs_and_keeps_stones_in_typed_filters
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Nonblocking combat matching and early domain warmup regressions
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_shared_guide_combat_global_contract.SharedGuideCombatHotPathTests tests.test_startup_warmup_subprocess_flags tests.test_guide_cold_relation_lookup tests.test_guide_entity_query_reuse tests.test_compact_guide_item_effects tests.test_achievement_compact_subprocess_lifecycle.AchievementCompactRowIdentityTests tests.test_achievement_compact_subprocess_lifecycle.AchievementNameIndexIntegrityTests tests.test_achievement_frozen_detail_runtime.AchievementFrozenDetailRuntimeTests.test_frozen_success_catalogue_prefers_prebuilt_compact_rows tests.test_achievement_frozen_detail_runtime.AchievementFrozenDetailRuntimeTests.test_frozen_success_missing_or_bad_compact_uses_inprocess_fallback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guide line/waypoint and runtime text parity
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_guide_manual_contract_row_cache tests.test_guide_ultime_manual_runtime_text
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: World Map return-to-Home and Qt lifecycle parity
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_world_scan_async_loading tests.test_shell_home_character_compact.ShellWorldScanHibernationTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Final targeted Success Qt, Guide prerequisite and Quest index regressions
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_success_async_detail_runtime tests.test_encyclopedia_success_detail_prewarm tests.test_guides_home_render_cache tests.test_quest_source_boundaries
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bounded Unity fallback icon cache
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_lanyel_shared_manual_ui.GuideFallbackIconCacheTests.test_guide_reward_fallback_icon_is_shared_and_bounded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reconstructible Craft release regression
        shell: pwsh
        run: python -X faulthandler -m unittest -v tests.test_craft_minimal_lazy
      - name: Guide UI high DPI layout checks (125 and 150 percent)
        shell: pwsh
        run: |
          foreach ($scale in @('1.25', '1.50')) {
            $env:QT_SCALE_FACTOR = $scale
            python -X faulthandler -m unittest -v tests.test_guide_home_two_columns tests.test_lanyel_shared_manual_ui.LanyelSharedManualUiTests.test_navigation_and_compact_headers_have_the_requested_hierarchy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
      - name: Doctor real Guide/catalog 30-cycle time and native RSS
        shell: pwsh
        run: |
          python -X faulthandler -m tools.atlas_doctor_lib.guide_ui_cycle_bench --cycles 30 --output .ai/runtime/atlas_doctor/guide_ui_cycles.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Doctor Guide cycle metrics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-guide-cycles-${{ env.CANDIDATE_SHA }}
          path: .ai/runtime/atlas_doctor/guide_ui_cycles.json
          if-no-files-found: warn
      - name: Provenance summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Guides targeted evidence'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Exact PR head: " + $env:CANDIDATE_SHA)
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- No FULL, no release certification, no fabricated identity.'
