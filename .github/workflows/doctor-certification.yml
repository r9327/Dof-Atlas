name: Doctor Adaptive Certification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: doctor-adaptive-cert-PR-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  CERT_BASE_REF: ${{ github.event.pull_request.base.sha }}

jobs:
  plan:
    name: Doctor / Fast Policy & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      run_scoped: ${{ steps.scope.outputs.run_scoped }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify exact candidate
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "::error::Candidate SHA mismatch: $actual"
            exit 1
          fi

      - name: Set up Python 3.13 for stdlib-only planning
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test independent adaptive certification contracts
        shell: bash
        run: |
          # Only source files selected; avoid importing tests/__init__.py (PySide6 Qt harness).
          # Contracts: tests.test_doctor_certification tests.test_doctor_certification_policy tests.test_doctor_certification_shadow
          python -X faulthandler -m unittest discover -v -s tests -p 'test_doctor_certification*.py'

      - name: Plan exact-SHA test scope without application dependencies
        id: scope
        shell: bash
        run: |
          python -X faulthandler -m tools.doctor_certification \
            --base-ref "$CERT_BASE_REF" \
            --expected-sha "$CANDIDATE_SHA" \
            --output artifacts/doctor_certification/plan.json \
            --passport-output artifacts/doctor_certification/plan_passport.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('artifacts/doctor_certification/plan.json').read_text(encoding='utf-8'))
          status = report.get('status')
          if status not in {'FULL_REQUIRED', 'READY_TO_RUN_SCOPED'}:
              raise SystemExit('Unrecognized or failed Doctor plan')
          decision = 'true' if status == 'READY_TO_RUN_SCOPED' else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('run_scoped=' + decision + '\n')
          print(f"Doctor profile={report.get('profile')} scope={status} run_scoped={decision}")
          PY

      - name: Publish plan decision and certification boundary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/doctor_certification/plan.json ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('artifacts/doctor_certification/plan.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Doctor adaptive plan\n')
              f.write(f"- Exact SHA: {p.get('candidate_sha')}\n")
              f.write(f"- Plan: {p.get('status')}\n")
              f.write(f"- Independent policy: {(p.get('independent_verdict') or {}).get('status')}\n")
              f.write('- FULL_REQUIRED means the canonical FULL was **not dispatched** by this workflow.\n')
              f.write('- Full certification remains mandatory under PHASE_CERTIFICATION.md.\n')
          PY
          fi

      - name: Store read-only planning artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doctor-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/doctor_certification/plan.json
            artifacts/doctor_certification/plan_passport.json
          if-no-files-found: warn
          retention-days: 30

  scoped:
    needs: plan
    if: needs.plan.outputs.run_scoped == 'true'
    name: Doctor / Windows Scoped Evidence
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify exact candidate
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:CANDIDATE_SHA) { throw "Checkout mismatch: $head" }

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies only when scoped tests are required
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute canonical scoped tests and produce passport
        shell: pwsh
        run: |
          python -X faulthandler -m tools.doctor_certification --base-ref "$env:CERT_BASE_REF" --expected-sha "$env:CANDIDATE_SHA" --run --output artifacts/doctor_certification/report.json --passport-output artifacts/doctor_certification/passport.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Declare the scoped-only boundary
        if: always()
        shell: pwsh
        run: |
          $path = "artifacts/doctor_certification/report.json"
          if (Test-Path $path) {
            $report = Get-Content $path -Raw | ConvertFrom-Json
            Write-Host "Doctor profile: $($report.profile), scope: $($report.status)"
            Write-Host "Execution: $($report.execution.status)"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content $env:GITHUB_STEP_SUMMARY "## Doctor Windows scoped evidence"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: $env:CANDIDATE_SHA"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Verdict: $($report.execution.status)"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Passport: $($report.passport.verdict)"
              Add-Content $env:GITHUB_STEP_SUMMARY "- SCOPED_TESTS_PASS is **NOT** Phase certification."
              Add-Content $env:GITHUB_STEP_SUMMARY "- FULL_REQUIRED still requires independent FULL; no waiver."
              Add-Content $env:GITHUB_STEP_SUMMARY "- Full certification remains mandatory."
            }
          }

      - name: Store Windows scoped evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doctor-scoped-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/doctor_certification/report.json
            artifacts/doctor_certification/passport.json
          if-no-files-found: warn
          retention-days: 30
