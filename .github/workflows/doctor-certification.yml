name: Doctor Adaptive Certification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: doctor-adaptive-cert-PR-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  CERT_BASE_REF: ${{ github.event.pull_request.base.sha }}

jobs:
  plan:
    name: Doctor / Fast Policy & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      run_scoped: ${{ steps.scope.outputs.run_scoped }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify exact candidate
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "::error::Candidate SHA mismatch: $actual"
            exit 1
          fi

      - name: Set up Python 3.13 for stdlib-only planning
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Test independent adaptive certification contracts
        shell: bash
        run: |
          # Only source files selected; avoid importing tests/__init__.py (PySide6 Qt harness).
          # Contracts: tests.test_doctor_certification tests.test_doctor_certification_policy tests.test_doctor_certification_shadow
          python -X faulthandler -m unittest discover -v -s tests -p 'test_doctor_certification*.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_doctor_shadow_campaign.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_doctor_github_provenance.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_doctor_policy_authority.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_doctor_scenario_runner.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_doctor_certification_readiness.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_phase8_deep_comparison.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_phase_adaptive_gate.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_full_suite_structured_reuse.py'

      - name: Plan exact-SHA test scope without application dependencies
        id: scope
        shell: bash
        run: |
          python -X faulthandler -m tools.doctor_certification \
            --base-ref "$CERT_BASE_REF" \
            --expected-sha "$CANDIDATE_SHA" \
            --output artifacts/doctor_certification/plan.json \
            --passport-output artifacts/doctor_certification/plan_passport.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('artifacts/doctor_certification/plan.json').read_text(encoding='utf-8'))
          status = report.get('status')
          if status not in {'FULL_REQUIRED', 'READY_TO_RUN_SCOPED'}:
              raise SystemExit('Unrecognized or failed Doctor plan')
          decision = 'true' if status == 'READY_TO_RUN_SCOPED' else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('run_scoped=' + decision + '\n')
          print(f"Doctor profile={report.get('profile')} scope={status} run_scoped={decision}")
          PY

      - name: Publish plan decision and certification boundary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/doctor_certification/plan.json ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('artifacts/doctor_certification/plan.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Doctor adaptive plan\n')
              f.write(f"- Exact SHA: {p.get('candidate_sha')}\n")
              f.write(f"- Plan: {p.get('status')}\n")
              f.write(f"- Independent policy: {(p.get('independent_verdict') or {}).get('status')}\n")
              f.write('- FULL_REQUIRED means the canonical FULL was **not dispatched** by this workflow.\n')
              f.write('- Full certification remains mandatory under PHASE_CERTIFICATION.md.\n')
          PY
          fi

      - name: Store read-only planning artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/doctor_certification/plan.json
            artifacts/doctor_certification/plan_passport.json
          if-no-files-found: warn
          retention-days: 30

  scoped:
    needs: plan
    if: needs.plan.outputs.run_scoped == 'true'
    name: Doctor / Windows Scoped Evidence
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify exact candidate
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:CANDIDATE_SHA) { throw "Checkout mismatch: $head" }

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies only when scoped tests are required
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize canonical data required by selected scoped tests
        shell: pwsh
        run: |
          # The scoped planner may select a complete unittest module.  Guide
          # modules initialize their real Success/Quest providers in
          # setUpClass, so their pinned Doduda inputs must exist before test
          # discovery even when the changed method itself is data-light.
          python -m scripts.windows.quest_assets --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute canonical scoped tests and produce passport
        shell: pwsh
        run: |
          python -X faulthandler -m tools.doctor_certification --base-ref "$env:CERT_BASE_REF" --expected-sha "$env:CANDIDATE_SHA" --run --output artifacts/doctor_certification/report.json --passport-output artifacts/doctor_certification/passport.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Declare the scoped-only boundary
        if: always()
        shell: pwsh
        run: |
          $path = "artifacts/doctor_certification/report.json"
          if (Test-Path $path) {
            $report = Get-Content $path -Raw | ConvertFrom-Json
            Write-Host "Doctor profile: $($report.profile), scope: $($report.status)"
            Write-Host "Execution: $($report.execution.status)"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content $env:GITHUB_STEP_SUMMARY "## Doctor Windows scoped evidence"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: $env:CANDIDATE_SHA"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Verdict: $($report.execution.status)"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Passport: $($report.passport.verdict)"
              Add-Content $env:GITHUB_STEP_SUMMARY "- SCOPED_TESTS_PASS is **NOT** Phase certification."
              Add-Content $env:GITHUB_STEP_SUMMARY "- FULL_REQUIRED still requires independent FULL; no waiver."
              Add-Content $env:GITHUB_STEP_SUMMARY "- Full certification remains mandatory."
            }
          }

      - name: Store Windows scoped evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-scoped-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/doctor_certification/report.json
            artifacts/doctor_certification/passport.json
          if-no-files-found: warn
          retention-days: 30


  journeys:
    needs: plan
    if: github.event.pull_request.draft == false && needs.plan.result == 'success'
    name: Doctor / Windows User Journey Contracts
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify exact candidate
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) { throw "Wrong candidate SHA" }

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install pinned application dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize canonical quest data for real Guide/Quest navigation
        shell: pwsh
        run: |
          # Navigation contracts use the real pinned Quest catalogue and no
          # mocked graph. These scenarios do not decode quest screenshots or
          # execute the legacy Doduda binary.
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) {
            Remove-Item -LiteralPath $catalog -Recurse -Force
          }
          python -m scripts.windows.quest_assets --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.windows.craft_seed --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "$catalog/quest_categories.json")) {
            throw "Canonical quest_categories.json was not materialized"
          }
          @'
          from app.quest_catalog import QuestCatalog
          catalog = QuestCatalog.load()
          total = len(catalog.quests)
          print(f"Independent Doctor journey catalog: {total} quests")
          if total < 1900:
              raise SystemExit("Doctor journey fixture is incomplete")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise independent user journey contracts
        shell: pwsh
        run: |
          python -X faulthandler -m tools.doctor_scenario_runner --expected-sha "$env:CANDIDATE_SHA" --run --scenario guide_quest_succes --scenario home_qt_lifecycle --scenario progress_persistence --scenario startup_preload --scenario guide_full_fixture_budget --output artifacts/doctor_certification/scenario_contracts.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Explain coverage and resource budget boundary
        if: always()
        shell: pwsh
        run: |
          $file = "artifacts/doctor_certification/scenario_contracts.json"
          if (Test-Path $file) {
            $evidence = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content $env:GITHUB_STEP_SUMMARY "## Doctor real user journey contract tests"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Candidate: $env:CANDIDATE_SHA"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Status: $($evidence.status)"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Real test modules: $($evidence.executed_test_modules.Count)"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Resource metrics not executed: $($evidence.required_metrics -join ', ')"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Contract PASS does NOT certify a real GUI end-to-end run or RAM budgets."
              Add-Content $env:GITHUB_STEP_SUMMARY "- Exact-SHA Phase FULL remains independently mandatory."
            }
          }

      - name: Publish user journey contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-scenarios-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/doctor_certification/scenario_contracts.json
          if-no-files-found: warn
          retention-days: 30
