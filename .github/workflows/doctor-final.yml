name: Doctor Truth + Network Disabled Validation

on:
  push:
    branches:
      - run/doctor-final-20260929

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  CANDIDATE_SHA: 95e1abf85c9fb654128296a77c3fbb0cb9bb640f

jobs:
  doctor:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Compile and targeted tests
        shell: pwsh
        run: |
          python -m compileall -q app tools tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_atlas_doctor tests.test_network_runtime_disabled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize certification data
        shell: pwsh
        run: |
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**,tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) { Remove-Item -LiteralPath $catalog -Recurse -Force }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Doctor strict CRITICAL and preserve observations
        shell: pwsh
        run: |
          python tools/atlas_doctor.py --json audit --force --gate critical > "$env:RUNNER_TEMP\doctor-final.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = Get-Content "$env:RUNNER_TEMP\doctor-final.json" -Raw | ConvertFrom-Json
          Write-Host ("Doctor verdict={0} issues={1} observations={2}" -f $payload.summary.verdict, $payload.summary.issues_total, $payload.summary.observations_total)
          if ([int]$payload.summary.observations_total -le 0) { throw "Doctor unexpectedly hid all observations" }
          python tools/atlas_doctor.py --json issues > "$env:RUNNER_TEMP\doctor-findings.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $findings = Get-Content "$env:RUNNER_TEMP\doctor-findings.json" -Raw | ConvertFrom-Json
          if ([int]$findings.observations_count -ne [int]$payload.summary.observations_total) { throw "Option issues does not expose every observation" }

      - name: Upload Doctor reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-truth-network-disabled
          path: |
            ${{ runner.temp }}/doctor-final.json
            ${{ runner.temp }}/doctor-findings.json
          if-no-files-found: error
          retention-days: 7
