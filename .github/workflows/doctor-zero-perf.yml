name: Doctor Zero Performance Compare

on:
  push:
    branches:
      - run/doctor-zero-perf-20260929

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  BEFORE_SHA: 07e14fa90eacd9143fc71140359386aeb8c6b5e2
  AFTER_SHA: fc287838c0f6ccc9b70b26cebd994f7f30dbf50c

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout BEFORE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BEFORE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Materialize benchmark fixtures and data
        shell: pwsh
        run: |
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**,tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) { Remove-Item -LiteralPath $catalog -Recurse -Force }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path perf-results | Out-Null

      - name: Warm both snapshots
        shell: pwsh
        run: |
          git checkout --force $env:BEFORE_SHA
          python -m app.modules.encyclopedia.tools.benchmark_guides_performance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --force $env:AFTER_SHA
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/1760/**" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m app.modules.encyclopedia.tools.benchmark_guides_performance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run alternating BEFORE and AFTER samples
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            $n = $_
            git checkout --force $env:BEFORE_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m app.modules.encyclopedia.tools.benchmark_guides_performance
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "artifacts/quests_guides_performance.json" "perf-results/before-$n.json" -Force

            git checkout --force $env:AFTER_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m app.modules.encyclopedia.tools.benchmark_guides_performance
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "artifacts/quests_guides_performance.json" "perf-results/after-$n.json" -Force
          }

      - name: Summarize medians
        shell: pwsh
        run: |
          @'
          import json
          import statistics
          from pathlib import Path

          root = Path("perf-results")
          before = [json.loads((root / f"before-{i}.json").read_text(encoding="utf-8"))["after"] for i in range(1, 4)]
          after = [json.loads((root / f"after-{i}.json").read_text(encoding="utf-8"))["after"] for i in range(1, 4)]
          keys = [
              "startup_stabilized_ms", "startup_stabilized_rss_mb",
              "quests_open_ms", "achievements_open_ms", "guide_open_ms",
              "first_achievement_detail_ms", "first_guide_detail_ms",
              "rss_after_quests_mb", "rss_after_achievements_mb", "rss_after_guide_mb",
              "rss_after_all_views_mb", "rss_after_round_trips_mb",
              "idle_cpu_percent_one_core",
          ]
          result = {"before_sha": "07e14fa90eacd9143fc71140359386aeb8c6b5e2", "after_sha": "fc287838c0f6ccc9b70b26cebd994f7f30dbf50c", "metrics": {}}
          for key in keys:
              b = [float(row[key]) for row in before if row.get(key) is not None]
              a = [float(row[key]) for row in after if row.get(key) is not None]
              if not b or not a:
                  continue
              bm = statistics.median(b)
              am = statistics.median(a)
              delta = ((am - bm) / bm * 100.0) if bm else 0.0
              result["metrics"][key] = {"before_median": round(bm, 3), "after_median": round(am, 3), "delta_percent": round(delta, 2)}
          (root / "summary.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          '@ | python -

      - name: Upload performance comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-zero-performance-compare
          path: perf-results/*.json
          if-no-files-found: error
          retention-days: 7
