name: Validate final foundation UI benchmark

on:
  push:
    branches:
      - validation/final-foundation-ui-benchmark

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PRODUCT_SHA: e17264bc35ca3368db47e6a0400cf0a170f7ef81

defaults:
  run:
    shell: pwsh

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout validation wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Prove exact product parent
        run: |
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $env:PRODUCT_SHA) { throw "Benchmark parent mismatch: $parent" }
          $changed = @(git diff --name-only HEAD^ HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne ".github/workflows/validate-final-foundation-ui-benchmark.yml") {
            throw "Unexpected validation changes: $($changed -join ', ')"
          }
          git checkout --detach $env:PRODUCT_SHA
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:PRODUCT_SHA) { throw "Product checkout mismatch: $actual" }

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize benchmark fixtures
        run: |
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**,tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize local Dofus catalog
        run: |
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) { Remove-Item -LiteralPath $catalog -Recurse -Force }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from app.quest_catalog import QuestCatalog
          count = len(QuestCatalog.load().quests)
          print(f"Materialized QuestCatalog: {count} quests")
          if count < 1900:
              raise SystemExit(f"Quest catalog incomplete: {count}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run performance guardrails
        run: |
          python -m unittest tests.test_performance_guardrails -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run canonical Encyclopedia benchmark
        run: |
          python -X faulthandler -m app.modules.encyclopedia.tools.benchmark_guides_performance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-foundation-ui-benchmark-${{ github.run_id }}
          path: artifacts/quests_guides_performance.json
          if-no-files-found: error
          retention-days: 7
