name: Graphify Code Map
# Explicit final code-map certification of PR #123; keep this gate event-scoped.

on:
  # Manual exact-SHA certification of Graphify/Doctor after the structural
  # batches converge. Keep the expensive rebuild away from routine pushes.
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tools/graphify.py"
      - "tools/agent_graph.py"
      - "tools/atlas_doctor_lib/graph_audit.py"
      - "tools/atlas_doctor_lib/graph_intelligence.py"
      - ".graphifyignore"
      - ".github/workflows/graphify-map.yml"
  push:
    branches:
      - main
      - phase8/graphify-staged-cleanup-v1
    paths:
      - "app/**"
      - "tools/graphify.py"
      - "tools/agent_graph.py"
      - "tools/atlas_doctor_lib/graph_audit.py"
      - "tools/atlas_doctor_lib/graph_intelligence.py"
      - ".graphifyignore"
      - ".github/workflows/graphify-map.yml"

permissions:
  contents: read

concurrency:
  group: dof-atlas-graphify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  graphify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'phase8/graphify-staged-cleanup-v1'
    name: Graphify / AST Code Map
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "Graphify checkout mismatch: expected $CANDIDATE_SHA, got $actual" >&2
            exit 1
          fi
          echo "Graphify candidate SHA: $actual"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Graphify
        shell: bash
        run: python -m pip install --disable-pip-version-check "graphifyy==0.9.72"

      - name: Build graph through Atlas Doctor and canonical Graphify engine
        shell: bash
        run: |
          started=$SECONDS
          python -m tools.atlas_doctor graph --rebuild --json
          elapsed=$((SECONDS - started))
          printf '%s\n' "$elapsed" > graphify-out/graph_build_seconds.txt
          echo "Graphify exact-SHA build time: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify graph output
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          graph_path = Path("graphify-out/graph.json")
          html_path = Path("graphify-out/graph.html")
          report_path = Path("graphify-out/GRAPH_REPORT.md")

          for path in (graph_path, html_path, report_path):
              if not path.is_file():
                  raise SystemExit(f"missing Graphify output: {path}")

          graph = json.loads(graph_path.read_text(encoding="utf-8"))
          nodes = graph.get("nodes", [])
          links = graph.get("links", graph.get("edges", []))
          if not nodes:
              raise SystemExit("Graphify produced an empty graph")
          if not links:
              raise SystemExit("Graphify produced a graph with no relationships")
          import subprocess
          tracked = {
              value.decode("utf-8", errors="replace").replace(chr(92), "/")
              for value in subprocess.check_output(
                  ["git", "ls-files", "-z", "--", "*.py"]
              ).split(bytes([0])) if value
          }
          represented = {
              node["source_file"].replace(chr(92), "/")
              for node in nodes
              if isinstance(node.get("source_file"), str)
              and node["source_file"].endswith(".py")
          }
          missing = sorted(tracked - represented)
          if not tracked or missing:
              raise SystemExit(
                  f"Graphify Python file coverage incomplete: "
                  f"{len(tracked) - len(missing)}/{len(tracked)}; "
                  f"missing={missing[:20]}"
              )
          print(f"Graphify tracked Python file coverage: {len(tracked)}/{len(tracked)}")
          print(f"Graphify graph ready: {len(nodes)} nodes, {len(links)} relationships")
          if graph.get("built_at_commit") != os.environ.get("CANDIDATE_SHA"):
              raise SystemExit("Graphify output does not match the checkout SHA")
          node_index = {node["id"]: node for node in nodes}
          inversions = []
          for link in links:
              if link.get("relation") not in {"imports", "imports_from"}:
                  continue
              source = node_index.get(link.get("source"), {}).get("source_file", "")
              target = node_index.get(link.get("target"), {}).get("source_file", "")
              if source.startswith("app/") and target.startswith("tools/"):
                  inversions.append(f"{source} -> {target}")
          if inversions:
              raise SystemExit("app-to-tools imports: " + "; ".join(sorted(set(inversions))))
          print("Graphify runtime-to-tools import inversions: 0")
          community_sizes = Counter(
              node["community"] for node in nodes if node.get("community") is not None
          )
          raw_thin = sum(size < 3 for size in community_sizes.values())
          text_report = report_path.read_text(encoding="utf-8")
          omitted_match = re.search(r"(\d+)\s+thin communities.*omitted", text_report)
          reported_omissions = int(omitted_match.group(1)) if omitted_match else None
          metrics = {
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "graph_build_seconds": int(Path("graphify-out/graph_build_seconds.txt").read_text(encoding="ascii")),
              "node_count": len(nodes),
              "tracked_python_files": len(tracked),
              "represented_tracked_python_files": len(tracked),
              "missing_tracked_python_files": 0,
              "relation_count": len(links),
              "raw_community_count": len(community_sizes),
              "raw_small_communities_lt3_nodes": raw_thin,
              "report_omitted_community_sections": reported_omissions,
              "runtime_to_tools_import_inversions": 0,
          }
          Path("graphify-out/atlas_graph_metrics.json").write_text(
              json.dumps(metrics, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"Raw communities <3 nodes: {raw_thin}; report omitted sections: {reported_omissions}")
          if reported_omissions is not None and reported_omissions != raw_thin:
              print("Note: report omissions are not literal raw-graph thin communities")
          PY

      - name: Doctor audit of exact SHA Graphify nodes and communities
        shell: bash
        run: |
          python -m tools.atlas_doctor graph-audit --deep --json > graphify-out/doctor_graph_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("graphify-out/doctor_graph_audit.json").read_text(encoding="utf-8"))
          if report["status"] not in {"PASS", "REVIEW"}:
              raise SystemExit("Doctor Graphify audit did not validate exact SHA.")
          if report["blocking_findings"]:
              raise SystemExit("Source-confirmed architecture inversion: " + str(report["blocking_findings"]))
          metrics = report["metrics"]
          print(f"Doctor graph audit: {report['status']}; raw small communities: {metrics['raw_communities_lt3_nodes']}")
          print(f"Orphan graph nodes: {metrics['isolated_nodes']}; candidate high-fanout app files: {metrics['high_fanout_app_files']}")
          print("Advisory candidates require source-level proof before deletion or merge.")
          PY

      - name: Verify Doctor interactive export against exact Graphify SHA
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.atlas_doctor_lib.doctor_graph_ui import export_interactive_graph

          root = Path.cwd()
          result = export_interactive_graph(root)
          if result.get("status") != "PASS":
              raise SystemExit("Doctor Graphify UI export failed: " + str(result))
          if result.get("candidate_sha") != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("Doctor Graphify UI SHA mismatch")
          html = Path(result["path"])
          if not html.is_file() or html.stat().st_size < 1000:
              raise SystemExit("Doctor Graphify UI HTML missing or empty")
          metrics = {
              "candidate_sha": result["candidate_sha"],
              "interactive_nodes": result["nodes_shown"],
              "interactive_edges": result["links_shown"],
              "source_scan_files": result["source_scan_files"],
              "source_scan_truncated": result["source_scan_truncated"],
              "json_lineage_review_leads": result["json_lineage_review_leads"],
              "runtime_observed": False,
          }
          Path("graphify-out/doctor_graph_ui_metrics.json").write_text(
              json.dumps(metrics, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("Doctor interactive graph: exact SHA PASS; " +
                str(metrics["interactive_nodes"]) + " interactive nodes")
          PY

      - name: Upload visual map and graph
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphify-code-map-${{ env.CANDIDATE_SHA }}
          path: graphify-out/
          if-no-files-found: error
          retention-days: 4
