name: PR303 Commit Patch Audit
on:
  pull_request:
    branches:
      - perf/atlas-global-optimization-backlog-20261030
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr303-commit-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  audit:
    name: Audit every PR303 commit patch, keep manual review open
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repair branch and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Verify selected repair HEAD and current parent HEAD
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$PR_BASE_SHA^{commit}" || git fetch --no-tags origin "$PR_BASE_SHA"
          git cat-file -e "$PR_BASE_SHA^{commit}"
      - name: Test audit scanner
        run: python -m unittest discover -s tests -p test_pr303_commit_audit.py -v
      - name: Audit every current parent PR303 commit and every repair-branch commit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=0ee44aeeb09358783dcceca799b743c6fb375299
          python -m tools.audit_pr303_commits \
            --base-sha "$BASE_SHA" --head-sha "$PR_BASE_SHA" \
            --output artifacts/pr303_commits/parent_audit.json
          python -m tools.audit_pr303_commits \
            --base-sha "$BASE_SHA" --head-sha "$CANDIDATE_SHA" \
            --output artifacts/pr303_commits/repair_audit.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          parent=json.loads(Path("artifacts/pr303_commits/parent_audit.json").read_text())
          repair=json.loads(Path("artifacts/pr303_commits/repair_audit.json").read_text())
          assert parent["head_sha"] == os.environ["PR_BASE_SHA"]
          assert repair["head_sha"] == os.environ["CANDIDATE_SHA"]
          assert parent["status"] == repair["status"] == "PATCH_INVENTORY_COMPLETE_HUMAN_REVIEW_REQUIRED"
          assert parent["inspected"] == parent["expected"] and repair["inspected"] == repair["expected"]
          print(f"PR303 current historical diff: {parent['inspected']}/{parent['expected']}; "
                f"PR310 current branch diff: {repair['inspected']}/{repair['expected']}; "
                "human review still NOT_RUN.")
          PY
          echo "Dynamic exact-SHA patch inventories finished; HUMAN_REVIEW still required." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete per-commit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr303-all-commit-patches-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr303_commits/*
          if-no-files-found: error
          retention-days: 30
