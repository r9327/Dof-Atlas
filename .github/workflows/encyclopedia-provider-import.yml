name: Encyclopedia Provider Import Boundary

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: atlas-provider-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python provider import side-effect contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          lfs: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run three fresh-process import contracts
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -X faulthandler -m unittest discover -s tests -p "test_encyclopedia_provider_lazy_boundary.py" -v
