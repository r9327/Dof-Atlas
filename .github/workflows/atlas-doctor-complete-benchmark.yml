name: Atlas Doctor Complete Benchmark

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  # Isolate the repaired Doctor campaign from a prior zero-job pending concurrency group.
  # Within v2, newer PR commits still cancel their own superseded runs.
  group: atlas-doctor-complete-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Reusable in Phase CI on substantial diffs; manual dispatch remains available.
# No stand-alone PR run: avoid executing the same complete campaign twice.
# A single orchestration of the existing canonical engines. No new benchmark
# implementation, no mandatory long campaign on unrelated small PRs.
jobs:
  all-menus:
    name: Doctor / all routes (3 PR cycles, 10 manual cycles) + 60s idle
    uses: ./.github/workflows/atlas-short-full-app.yml
    with:
      # Every menu is tested on PRs. Extended 10-cycle stability is explicit,
      # not an automatic tax on each commit in this same PR.
      cycles: ${{ github.event_name == 'workflow_dispatch' && 10 || 3 }}
      idle_seconds: 60
      max_seconds: ${{ github.event_name == 'workflow_dispatch' && 1200 || 660 }}

  one-core-stress:
    name: Doctor / measured one-core CPU constraint
    uses: ./.github/workflows/atlas-short-full-app.yml
    with:
      cycles: 3
      idle_seconds: 10
      max_seconds: 700
      one_core: true
      skip_preflight_unit_tests: true

  eight-atlas-processes:
    name: Doctor / 8 simultaneous isolated Atlas applications
    uses: ./.github/workflows/atlas-short-full-app.yml
    with:
      cycles: 1
      max_seconds: 600
      parallel_instances: 8
      skip_preflight_unit_tests: true

  all-guides:
    name: Doctor / all playable guides
    uses: ./.github/workflows/atlas-exhaustive-benchmark.yml
    with:
      benchmark_timeout_minutes: 30

  phase8-memory:
    name: Canonical RAM and lifecycle budgets
    uses: ./.github/workflows/phase8-memory-benchmark.yml

  phase8-preload:
    name: Canonical preload cold/warm comparison
    uses: ./.github/workflows/phase8-preload-benchmark.yml
    with:
      base_ref: "${{ github.event.pull_request.base.sha || 'main' }}"

  full-qt-ui:
    name: Doctor / all five UI scenarios and screenshots
    uses: ./.github/workflows/doctor-ui.yml
    with:
      base_ref: "${{ github.event.pull_request.base.sha || 'main' }}"
      complete_campaign: true

  native-distribution:
    name: Doctor / build actual EXE, installer, update and SHA256 candidate
    uses: ./.github/workflows/atlas-windows-distribution.yml
    with:
      full_candidate: true

  graphify:
    name: Doctor / complete Graphify AST and edges
    uses: ./.github/workflows/graphify-map.yml

  duplicate-review:
    name: Doctor / duplicate code and redundant source review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Audit duplicates through canonical Doctor code inspector
        shell: bash
        run: |
          mkdir -p artifacts/doctor_complete
          # The canonical full code inspector can legitimately return REVIEW
          # because no optional graph/runtime evidence was supplied. Its
          # actual AST duplicate scan is certified independently, fail-closed.
          set +e
          python -m tools.atlas_doctor code-inspect --base-ref "${{ github.event.pull_request.base.sha || 'main' }}" --json > artifacts/doctor_complete/code_inspection_raw.json
          inspector_exit=$?
          set -e
          if [ "$inspector_exit" -gt 1 ]; then
            echo "Doctor code inspector BLOCKED or failed: $inspector_exit"
            exit "$inspector_exit"
          fi
          python -m tools.atlas_doctor_lib.duplicate_evidence \
            --raw artifacts/doctor_complete/code_inspection_raw.json \
            --sha "$(git rev-parse HEAD)" \
            --output artifacts/doctor_complete/duplicate_review.json
      - name: Preserve exact duplicate evidence even on review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-code-duplicate-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/doctor_complete/duplicate_review.json
            artifacts/doctor_complete/code_inspection_raw.json
          if-no-files-found: warn

  domain-contracts:
    name: Functional modules, identities, UI and launcher
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QT_OPENGL: software
      QT_QUICK_BACKEND: software
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual functional contracts (not just menu opening)
        run: |
          python -X faulthandler -m unittest -v `
            tests.test_achievement_compact_subprocess_lifecycle `
            tests.test_application_runtime_characterization `
            tests.test_atlas_lifecycle_soak `
            tests.test_atlas_doctor_app_ui_smoke `
            tests.test_atlas_doctor_encyclopedia_smoke `
            tests.test_atlas_doctor_resource_lifecycle `
            tests.test_character_identity_contract `
            tests.test_character_binding_coordination `
            tests.test_guide_continuous_navigation `
            tests.test_guide_progress_persistence `
            tests.test_guide_preparation_model_qt `
            tests.test_achievement_progress_json_store `
            tests.test_craft_minimal_lazy `
            tests.test_cartography_recovery_security `
            tests.test_distribution_smart_update `
            tests.test_distribution_first_boot `
            tests.test_distribution_health `
            tests.test_distribution_install_location `
            tests.test_distribution_launcher_noop_offline `
            tests.test_equipment_deferred_start `
            tests.test_functional_preload_v2 `
            tests.test_startup_preload_window_visibility `
            tests.test_fault_injection_contracts `
            tests.test_doctor_quick_app_probe `
            tests.test_achievement_compact_process_lock `
            tests.test_doctor_evidence_costs `
            tests.test_doctor_optimization_report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  suite-verdict:
    name: Doctor / required results and honest coverage
    if: always()
    needs: [all-menus, one-core-stress, eight-atlas-processes, all-guides, phase8-memory, phase8-preload, full-qt-ui, native-distribution, graphify, duplicate-review, domain-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate for Doctor evidence joining
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: false

      - name: Download exact-run Doctor app attribution
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # Download only the primary multi-route report. The one-core job also
          # runs 3 cycles, but has a DIFFERENT denominator and must stay separate.
          pattern: atlas-short-complete-app-c${{ github.event_name == 'workflow_dispatch' && 10 || 3 }}-cpufalse-p1-${{ github.run_id }}-*
          path: artifacts/doctor_complete/inputs/app
          merge-multiple: false

      - name: Download original Doctor guide method timing evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: atlas-exhaustive-guides-${{ github.run_id }}-*
          path: artifacts/doctor_complete/inputs/guides
          merge-multiple: false

      - name: Download Doctor UI verification record
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: doctor-ui-verdict-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: artifacts/doctor_complete/inputs/ui

      - name: Download Doctor duplicate code findings
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: doctor-code-duplicate-review-${{ github.run_id }}-*
          path: artifacts/doctor_complete/inputs/duplicates
          merge-multiple: false

      - name: Download exact Graphify architecture evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: atlas-doctor-graph-summary-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: artifacts/doctor_complete/inputs/graphify

      - name: Download actual frozen Windows installer and file-integrity proof
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: atlas-doctor-native-windows-report-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: artifacts/doctor_complete/inputs/distribution

      - name: Write fail-closed suite outcome
        env:
          MENUS: "${{ needs.all-menus.result }}"
          GUIDES: "${{ needs.all-guides.result }}"
          ONE_CORE: "${{ needs.one-core-stress.result }}"
          EIGHT_ATLAS: "${{ needs.eight-atlas-processes.result }}"
          MEMORY: "${{ needs.phase8-memory.result }}"
          PRELOAD: "${{ needs.phase8-preload.result }}"
          CONTRACTS: "${{ needs.domain-contracts.result }}"
          UI: "${{ needs.full-qt-ui.result }}"
          DISTRIBUTION: "${{ needs.native-distribution.result }}"
          GRAPHIFY: "${{ needs.graphify.result }}"
          DUPLICATES: "${{ needs.duplicate-review.result }}"
          SOURCE_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          jobs = {key: os.environ[key] for key in ("MENUS", "GUIDES", "ONE_CORE", "EIGHT_ATLAS", "MEMORY", "PRELOAD", "CONTRACTS", "UI", "DISTRIBUTION", "GRAPHIFY", "DUPLICATES")}
          missing = [key for key, value in jobs.items() if value != "success"]
          payload = {
              "kind": "atlas_doctor_complete_automated_suite",
              "sha": os.environ["SOURCE_SHA"],
              "job_results": jobs,
              "status": "BLOCKED" if missing else "AUTOMATED_PASS_NATIVE_NOT_CERTIFIED",
              "failed_or_unexecuted_jobs": missing,
              "not_covered_on_github_hosted_qt_offscreen": [
                  "8 real DOFUS clients (eight separate Atlas apps are tested, not the game)",
                  "physically constrained low-end Windows hardware (one-core simulation measured separately)",
                  "Human-visible GPU/FPS/DPI UI is NOT covered (Qt offscreen; actual EXE/installer are executed separately)",
                  "Real public network update/download/rollback NOT covered (offline signed candidate + update contracts tested)",
                  "all clicks and mutations inside every business page",
                  "placeholder business features not implemented",
              ],
              "is_final_release_certification": False,
          }
          folder = Path("artifacts/doctor_complete")
          folder.mkdir(parents=True, exist_ok=True)
          (folder / "suite.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          (folder / "jobs.json").write_text(json.dumps(jobs, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("## Doctor Complete Automated Benchmark\n\n")
              out.write(f"SHA: `{payload['sha']}` | **{payload['status']}**\n\n")
              for key, result in jobs.items():
                  out.write(f"- {key}: {result}\n")
              out.write("\n8 real DOFUS clients and visually rendered desktop UI remain NOT RUN.\n")
          if missing:
              raise SystemExit("Doctor BLOCKED: missing or failed required benchmark stages: " + ", ".join(missing))
          PY
      - name: Doctor central evidence / shared audit and percentage breakdown
        if: always()
        env:
          SOURCE_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.atlas_doctor_lib.evidence_hub import build_hub
          from tools.atlas_doctor_lib.workflow_artifacts import latest_attempt_report
          root = Path.cwd()
          directory = root / "artifacts/doctor_complete/inputs"
          inputs = []
          run_id, max_attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          cycles = 10 if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" else 3
          app_report = latest_attempt_report(
              directory / "app", artifact_prefix=f"atlas-short-complete-app-c{cycles}-cpufalse-p1",
              report_name="report.json", run_id=run_id, max_attempt=max_attempt)
          app_reports = [app_report] if app_report is not None else []
          for filename in app_reports:
              inputs.append("app_navigation=" + filename.relative_to(root).as_posix())
          for filename in (directory / "ui").rglob("ui_campaign_verdict.json"):
              inputs.append("qt_ui=" + filename.relative_to(root).as_posix())
          duplicate_report = latest_attempt_report(
              directory / "duplicates", artifact_prefix="doctor-code-duplicate-review",
              report_name="duplicate_review.json", run_id=run_id, max_attempt=max_attempt)
          if duplicate_report is not None:
              inputs.append("code_duplicates=" + duplicate_report.relative_to(root).as_posix())
          for filename in (directory / "graphify").rglob("doctor_shared_evidence.json"):
              inputs.append("graphify=" + filename.relative_to(root).as_posix())
          for filename in (directory / "distribution").rglob("doctor_windows_evidence.json"):
              inputs.append("distribution=" + filename.relative_to(root).as_posix())
          report = build_hub(
              root, sha=os.environ["SOURCE_SHA"], sources=inputs,
              jobs_json=Path("artifacts/doctor_complete/jobs.json"),
              output=Path("artifacts/doctor_complete/doctor_evidence.json"))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n## Doctor — shared tool audit\n\n")
              for key, val in report["coverage"].items():
                  stream.write(f"- {key}: **{val['status']}** ({val['sources']} proofs)\n")
              stream.write("\n### Shares of measured Atlas route cost\n\n")
              stream.write("| Phase | Wall ms | Wall % | Process CPU ms | CPU % |\n")
              stream.write("|---|---:|---:|---:|---:|\n")
              for row in sorted(report["cost_shares"], key=lambda x: -x.get("wall_ms", 0))[:25]:
                  stream.write(f"| {row['phase']} | {row['wall_ms']} | {row['wall_pct_of_entire_probe']} | {row['process_cpu_ms']} | {row['cpu_pct_of_measured_process_cpu']} |\n")
              stream.write("\nMemory peaks are non-additive. Native FPS and 8 DOFUS clients remain not run.\n")
          print(json.dumps({"status": report["status"], "coverage": report["coverage"],
                            "cost_rows": len(report["cost_shares"]),
                            "missing_app_report": len(app_reports) != 1}, indent=2))
          if len(app_reports) != 1 or not report["cost_shares"] or report["status"] != "PASS":
              raise SystemExit("Doctor cannot certify the complete cost/evidence coverage")
          PY

      - name: Doctor CI stage cost / real durations and percentages
        if: always()
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          SOURCE_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from tools.atlas_doctor_lib.actions_step_costs import step_costs
          run_id = int(os.environ["GITHUB_RUN_ID"])
          repo = os.environ["GITHUB_REPOSITORY"]
          records = []
          for page in range(1, 11):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100&page={page}",
                  headers={"Accept": "application/vnd.github+json",
                           "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  batch = json.load(response).get("jobs", [])
              records.extend(batch)
              if len(batch) < 100:
                  break
          report = step_costs(records, sha=os.environ["SOURCE_SHA"], run_id=run_id)
          output = Path("artifacts/doctor_complete/ci_step_costs.json")
          output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n## Doctor — CI wall-time share per job\n\n")
              for job in report["jobs"]:
                  stream.write(f"### {job['job']}\n\n")
                  for step in job["steps"][:8]:
                      stream.write(f"- {step['percent_of_job_measured_steps']}% — {step['step']} ({step['duration_seconds']}s)\n")
                  stream.write("\n")
          print("Measured CI jobs:", len(report["jobs"]))
          if report["status"] != "OBSERVED":
              raise SystemExit("No real GitHub Actions step timing evidence")
          PY

      - name: Publish self-contained Doctor audit dashboard
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.atlas_doctor_lib.evidence_hub import render_html
          from tools.atlas_doctor_lib.optimization_report import generate
          from tools.atlas_doctor_lib.workflow_artifacts import latest_attempt_report
          directory = Path("artifacts/doctor_complete")
          evidence = directory / "doctor_evidence.json"
          stages = directory / "ci_step_costs.json"
          if not evidence.is_file():
              print("Doctor evidence hub missing; no false HTML success")
              raise SystemExit(2)
          report = json.loads(evidence.read_text(encoding="utf-8"))
          costs = json.loads(stages.read_text(encoding="utf-8")) if stages.is_file() else None
          (directory / "audit.html").write_text(
              render_html(report, costs), encoding="utf-8")
          run_id, max_attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          cycles = 10 if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" else 3
          app_report = latest_attempt_report(
              directory / "inputs/app", artifact_prefix=f"atlas-short-complete-app-c{cycles}-cpufalse-p1",
              report_name="report.json", run_id=run_id, max_attempt=max_attempt)
          if app_report is None:
              raise SystemExit("Doctor optimization report requires exactly one primary app benchmark")
          guide_report = latest_attempt_report(
              directory / "inputs/guides", artifact_prefix="atlas-exhaustive-guides",
              report_name="guides.doctor.json", run_id=run_id, max_attempt=max_attempt)
          optimized = generate(Path.cwd(), sha=report["git_head"], app_report=app_report,
                               hub_report=evidence,
                               guides=guide_report,
                               ci_costs=stages if stages.is_file() else None)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("\n## Doctor ranked optimization report\n\n")
              out.write("Diagnostic: **" + optimized["status"] + "** (not a release certification)\n\n")
              for finding in optimized["priority_findings"][:12]:
                  out.write("- " + finding["priority"] + ": " + finding["title"] +
                            " — " + finding["evidence"] + "\n")
              out.write("\nDetailed optimization.json and optimization.md in workflow artifacts.\n")
          if optimized["status"] != "DIAGNOSTIC_READY":
              raise SystemExit("Incomplete optimization evidence: no false measurements")
          PY

      - name: Archive exact-SHA coverage ledger even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-doctor-complete-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/doctor_complete/**
          if-no-files-found: error
          retention-days: 30
