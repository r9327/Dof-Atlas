name: AI Context CI

on:
  pull_request:
    paths:
      - ".ai/**"
      - "AGENTS.md"
      - "AI_CONTEXT.md"
      - "ROAD_IA.md"
      - "app/AGENTS.md"
      - "data/AGENTS.md"
      - "tests/AGENTS.md"
      - "tests/test_ai_context.py"
      - "tests/test_repository_git_hooks.py"
      - "tools/AGENTS.md"
      - "tools/ai_context.py"
      - "tools/git_hook.py"
      - ".githooks/**"
      - ".github/workflows/ai-context-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dof-atlas-ai-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  VALIDATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

jobs:
  validate:
    name: AI Context / Targeted Validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .ai
            .githooks
            .github
            data/routes/guide_ultime_manual
            tests
            tools
          sparse-checkout-cone-mode: true

      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "AI context checkout mismatch: expected $env:CANDIDATE_SHA, got $actual"
          }
          Write-Host "AI context candidate SHA: $actual"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Compile ROAD IA Python files
        shell: pwsh
        run: python -m compileall -q tools/ai_context.py tools/git_hook.py tests/test_ai_context.py

      - name: Verify committed context index
        shell: pwsh
        run: python -m tools.ai_context check

      - name: Run targeted ROAD IA tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_ai_context.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_repository_git_hooks.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  integrity-fast:
    name: AI Context / Atlas Integrity FAST
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "FAST checkout mismatch: expected $env:CANDIDATE_SHA, got $actual"
          }
          Write-Host "FAST candidate SHA: $actual"
          Write-Host "FAST base SHA: $env:VALIDATION_BASE_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Atlas Integrity FAST
        shell: pwsh
        run: |
          python -X faulthandler -m tools.atlas_integrity fast --base-ref "$env:VALIDATION_BASE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
