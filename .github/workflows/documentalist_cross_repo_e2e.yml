name: Documentalist → Atlas cross-repo contract (opt-in)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  real-exchange:
    if: github.event.label.name == 'ci:documentalist-e2e'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r9327/Atlas-Holding
          ref: b7d900e00ec6f6c25846f773f49917247badf1a3
          path: holding-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export actual Documentalist batches then preview with actual Atlas adapter
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          old = [{"id": 1, "kind": "quest", "label": "Old"}]
          incoming = [
              {"id": 1, "kind": "quest", "label": "New"},
              {"id": 2, "kind": "success", "references": [{"kind": "quest", "id": 1}]},
          ]
          Path("old.json").write_text(json.dumps(old), encoding="utf-8")
          Path("incoming.json").write_text(json.dumps(incoming), encoding="utf-8")
          PY
          (cd holding-source && python -m holding.documentalist_cli --file ../old.json --format json --out ../old.exchange.json)
          (cd holding-source && python -m holding.documentalist_cli --file ../incoming.json --format json --out ../incoming.exchange.json)
          python -m tools.atlas_data_exchange_cli old.exchange.json incoming.exchange.json --json > preview.json
          python - <<'PY'
          # Seed a verified offline cache: this exercise MUST NOT access the network.
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("holding-source").resolve()))
          from holding.document_cache import store_batch
          from holding.document_intake import ingest_json_records
          raw = Path("incoming.json").read_bytes()
          batch = ingest_json_records(raw, source="https://example.org/quests.json",
                                     collected_at="2026-10-22T18:00:00Z")
          store_batch(Path("source-cache"), batch, format="json")
          PY
          (cd holding-source && python -m holding.documentalist_cli --url https://example.org/quests.json --allow-host example.org --format json --cache-dir ../source-cache --offline --out ../offline.exchange.json)
          python -m tools.atlas_data_exchange_cli old.exchange.json offline.exchange.json --json > offline.preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("preview.json").read_text(encoding="utf-8"))
          assert report["status"] == "PREVIEW_ONLY", report
          assert report["counts"] == {
              "add": 1, "update": 1, "keep": 0, "absent_in_batch": 0
          }, report
          assert [(r["kind"], r["id"], r["action"]) for r in report["changes"]] == [
              ("quest", "1", "update"), ("success", "2", "add"),
          ], report
          offline = json.loads(Path("offline.preview.json").read_text(encoding="utf-8"))
          assert offline["status"] == "PREVIEW_ONLY" and offline["counts"] == report["counts"], offline
          assert offline["source"] == "https://example.org/quests.json", offline
          print("Cross-repo online-format + OFFLINE cached Documentalist -> Atlas PASS", report["counts"])
          PY
