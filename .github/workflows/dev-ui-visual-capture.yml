name: Dev UI / Windows Visual Capture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/dev-ui-visual-capture.yml'

permissions:
  contents: read

jobs:
  real-qt-capture:
    name: Dev UI actual Qt capture at PR SHA (Windows, offscreen)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          lfs: false
      - name: Verify exact SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) {
            throw "Dev UI checkout differs from PR HEAD"
          }
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Windows Qt runtime
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture actual Dev UI widget, full scroll, and dialog
        shell: pwsh
        run: |
          python -X faulthandler -m tools.dev_ui_snapshot --output artifacts/dev-ui --width 1440 --height 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check capture completeness and horizontal fit
        shell: pwsh
        run: |
          $manifest = Get-Content artifacts/dev-ui/dev-ui-capture.json -Raw | ConvertFrom-Json
          if ($manifest.families -ne 16) { throw "Dev UI families count changed" }
          if ($manifest.horizontal_scroll_max -ne 0) { throw "Dev UI has horizontal overflow" }
          foreach ($name in @('viewport', 'complete', 'dialog')) {
            $imagePath = $manifest.screenshots.$name
            if (-not (Test-Path $imagePath)) { throw "Missing real Qt screenshot: $name" }
          }
      - name: Validate Dev UI shared widgets and interactions
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_dev_ui_page
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-ui-real-qt-${{ env.CANDIDATE_SHA }}
          path: artifacts/dev-ui/*
          if-no-files-found: warn
