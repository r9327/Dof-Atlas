name: Scoped PR Feedback

on:
  pull_request:
    branches:
      - main
      - phase8/peak250-guide-worker-v1

permissions:
  contents: read

concurrency:
  group: dof-atlas-scoped-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  scoped-feedback:
    name: PR / Scoped Test Feedback
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify candidate SHA
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:CANDIDATE_SHA) { throw "Checkout SHA mismatch: $head" }

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install pinned application dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate fail-closed scope planner
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_ci_scope_gate tests.test_ci_dev_tests tests.test_guide_full_suite_fixture_budget tests.test_ci_guide_full_evidence tests.test_ci_runner_guardrails
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run changed-module tests when safe
        id: scope
        shell: pwsh
        run: |
          python -X faulthandler -m tools.ci_scope_gate --base-ref "$env:BASE_SHA" --output "$env:GITHUB_OUTPUT" --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Declare the certification boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Advisory changed-module feedback; never FULL certification."
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Scoped PR feedback"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Exact candidate: $env:CANDIDATE_SHA"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Selection: ${{ steps.scope.outputs.scope_status }}"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- FULL remains required for certification. Public PR / Safe Validation (Doctor FAST) is separate and mandatory."
            if ("${{ steps.scope.outputs.full_required }}" -eq "true") {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- FULL_REQUIRED: diff too broad, risky, unmapped or deleted for scoped confidence; no false targeted PASS is claimed."
            }
          }
