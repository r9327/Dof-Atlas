name: Scoped PR Feedback

on:
  # Cheap stdlib smoke while PRs are Draft. Ready certification remains owned
  # exclusively by Phase Certification (no new Windows FULL/specialist run).
  pull_request:
    branches: [main, phase8/peak250-guide-worker-v1]
    types: [opened, synchronize, reopened, converted_to_draft]
  workflow_dispatch:
    inputs:
      base_ref:
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: dof-atlas-scoped-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_ref }}

jobs:
  plan:
    name: PR / Stdlib Scope Plan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      run_scoped: ${{ steps.route.outputs.run_scoped }}
      scope_status: ${{ steps.scope.outputs.scope_status }}
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          [ "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" ] || { echo "Wrong SHA"; exit 1; }

      - name: Set up Python 3.13 without Qt dependencies
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Validate canonical scope and development selectors
        shell: bash
        run: |
          # Run exact test files without importing tests/__init__.py (which starts Qt).
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ci_scope_gate.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ci_dev_tests.py'
          # No Qt, no downloads and no duplicate FULL: catch policy and
          # observer regressions before an expensive Ready-for-review run.
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ci_pr_audit.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ci_timing_observer.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ci_required_certification.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ci_domain_certification.py'
          # Advisory decision replay: real selectors, no Qt install or FULL.
          python -X faulthandler -m unittest discover -v -s tests -p 'test_doctor_ci_decision_arena.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ci_failure_autofix.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ai_workflow_skills.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_dofus_atlas_tools_skill.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ci_verified_pr_full.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_main_phase_evidence.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_public_pr_ci_guardrails.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_ci_runner_guardrails.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_phase8_memory_policy_advisory.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_phase8_memory_benchmark_contract.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_phase_certification_guardrails.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_phase8_memory_tolerance.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_craft_adapter_release.py'
          python -X faulthandler -m unittest discover -v -s tests -p 'test_craft_lightweight_import_boundary.py'

      - name: Classify scope fail closed without installing PySide6
        id: scope
        shell: bash
        run: |
          python -X faulthandler -m tools.ci_scope_gate --base-ref "$BASE_SHA" --output "$GITHUB_OUTPUT"

      - name: Generate exact-SHA Draft PR mini-audit (advisory)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # The existing Doctor plan already computes the source/UI impact.
          # Reuse that authoritative planner instead of inventing a second
          # risk or dependency engine. No Qt, tests, Windows or LFS installed.
          python -X faulthandler -m tools.atlas_doctor ci \
            --base-ref "$BASE_SHA" \
            --expected-sha "$CANDIDATE_SHA" \
            --event pull_request \
            --output artifacts/doctor_ci/plan.json --json
          # A Draft must expose unowned/suspicious paths before costly Ready
          # Windows execution, never just succeed on the outer Doctor plan.
          python - <<'PYDOMAIN'
          import json
          from pathlib import Path
          plan = json.loads(Path("artifacts/doctor_ci/plan.json").read_text(encoding="utf-8"))
          domain = plan.get("domain_plan") or {}
          if domain.get("status") != "READY_TO_EXECUTE":
              raise SystemExit("PR domain closure BLOCKED: "
                               + str(domain.get("unknown_paths"))
                               + "; " + str(domain.get("reasons")))
          print("Exact-SHA Draft domain closure: READY_TO_EXECUTE")
          PYDOMAIN
          python -m tools.ci_pr_audit \
            --plan artifacts/doctor_ci/plan.json \
            --report artifacts/doctor_ci/pr_mini_audit.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Draft PR impact evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-draft-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/doctor_ci/**
          if-no-files-found: error
          retention-days: 14

      - name: Decide whether Windows execution is required
        id: route
        shell: bash
        env:
          SCOPE_STATUS: ${{ steps.scope.outputs.scope_status }}
          FULL_REQUIRED: ${{ steps.scope.outputs.full_required }}
        run: |
          if [ "$SCOPE_STATUS" = "TARGETED" ] && [ "$FULL_REQUIRED" = "false" ]; then
            echo "run_scoped=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCOPE_STATUS" = "FULL_REQUIRED" ] && [ "$FULL_REQUIRED" = "true" ]; then
            echo "run_scoped=false" >> "$GITHUB_OUTPUT"
            echo "FULL_REQUIRED: no Windows scoped job; no FULL was run or waived."
          else
            echo "::error::Invalid contradictory scope decision"
            exit 1
          fi

      - name: Explain scope-only evidence
        if: always()
        shell: bash
        env:
          SCOPE_STATUS: ${{ steps.scope.outputs.scope_status }}
        run: |
          echo "Advisory changed-module feedback; never FULL certification."
          echo "## Scoped PR planning" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: $SCOPE_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Doctor FAST is separate and mandatory." >> "$GITHUB_STEP_SUMMARY"
          echo "- FULL_REQUIRED means this workflow did **not** run FULL." >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: plan
    # Draft signal is deliberately stdlib-only; the opt-in dispatch retains
    # its existing Windows targeted behavior. Ready keeps all mandatory gates.
    if: needs.plan.outputs.run_scoped == 'true' && github.event_name == 'workflow_dispatch'
    name: PR / Windows Scoped Tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify candidate SHA
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:CANDIDATE_SHA) { throw "Checkout SHA mismatch: $head" }

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install pinned application dependencies only if TARGETED
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify single-build Guide FULL fixture guard
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_guide_full_suite_fixture_budget tests.test_ci_guide_full_evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Replan and run changed modules on Windows
        id: scope
        shell: pwsh
        run: |
          python -X faulthandler -m tools.ci_scope_gate --base-ref "$env:BASE_SHA" --output "$env:GITHUB_OUTPUT" --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reject changed or incomplete Windows scope
        shell: pwsh
        env:
          VERIFIED_SCOPE: ${{ steps.scope.outputs.scope_status }}
          VERIFIED_FULL: ${{ steps.scope.outputs.full_required }}
        run: |
          if ($env:VERIFIED_SCOPE -ne "TARGETED" -or $env:VERIFIED_FULL -ne "false") {
            throw "Windows scope changed from TARGETED; no targeted PASS may be claimed."
          }

  verdict:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == true)
    needs: [plan, windows]
    name: PR / Scoped Test Feedback
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fail if required plan or Windows checks did not pass
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          RUN_SCOPED: ${{ needs.plan.outputs.run_scoped }}
          SCOPE_STATUS: ${{ needs.plan.outputs.scope_status }}
          PR_EVENT: ${{ github.event_name }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Scope planner failed; no advisory PASS."
            exit 1
          fi
          if [ "$PR_EVENT" = "pull_request" ]; then
            # Automated Draft execution is a *plan only*. It cannot claim
            # Windows test evidence or a certification PASS.
            if [ "$WINDOWS_RESULT" != "skipped" ]; then
              echo "::error::Unexpected Windows execution in Draft feedback"
              exit 1
            fi
            case "$RUN_SCOPED" in
              true|false) ;;
              *) echo "::error::Unknown or empty Draft scope decision"; exit 1 ;;
            esac
            echo "DRAFT_ROUTE_ONLY_NOT_CERTIFIED: Windows and FULL remain required according to official policy."
          elif [ "$RUN_SCOPED" = "true" ]; then
            if [ "$WINDOWS_RESULT" != "success" ]; then
              echo "::error::Required Windows scoped tests did not pass."
              exit 1
            fi
            echo "Scoped tests PASS on exact candidate SHA (not FULL)."
          elif [ "$RUN_SCOPED" = "false" ] && [ "$SCOPE_STATUS" = "FULL_REQUIRED" ]; then
            if [ "$WINDOWS_RESULT" != "skipped" ]; then
              echo "::error::Unexpected Windows result for FULL_REQUIRED."
              exit 1
            fi
            echo "FULL_REQUIRED: scoped Windows install avoided; full certificate NOT granted."
          else
            echo "::error::Incomplete or contradictory scope decision."
            exit 1
          fi
          echo "## Scoped PR verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact candidate SHA: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Selection: $SCOPE_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows: $WINDOWS_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public PR / Safe Validation (Doctor FAST) remains independent and mandatory." >> "$GITHUB_STEP_SUMMARY"
          echo "- No FULL is claimed or waived by this workflow." >> "$GITHUB_STEP_SUMMARY"
