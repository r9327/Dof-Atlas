name: Temporary PR131 Fast Fixture Contracts
on:
  push:
    branches:
      - ci/pr131-fast-fixtures-20261010
permissions:
  contents: read
concurrency:
  group: ci-pr131-fixtures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted:
    name: Guide Fixture Contracts (Targeted Only)
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt
      - name: Install pinned application dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
      - name: Run only the three fast new fixture contracts
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_guide_full_suite_fixture_budget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
