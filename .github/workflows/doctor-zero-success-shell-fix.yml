name: Doctor Zero Success Shell Fix

on:
  push:
    branches:
      - run/doctor-zero-perf-20260929

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  TARGET_BRANCH: doctor/zero-actionable-v1

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Doctor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Remove obsolete embedded quest detail from Success shell
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("app/modules/encyclopedia/views/achievements_view.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one patch anchor, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "from app.modules.encyclopedia.widgets.quest_detail_view import QuestDetailView, QuestViewContext\n",
              "",
          )

          replace_once(
              '''        self.quest_detail_page = QWidget()\n        self.quest_detail_page.setSizePolicy(QSizePolicy.Ignored, QSizePolicy.Expanding)\n        quest_page_layout = QVBoxLayout(self.quest_detail_page)\n        quest_page_layout.setContentsMargins(0, 0, 0, 0)\n        quest_page_layout.setSpacing(6)\n        self.back_to_achievement = AtlasButton("← Retour au succès")\n        self.back_to_achievement.setObjectName("GuideBreadcrumbButton")\n        self.back_to_achievement.clicked.connect(self.show_current_achievement)\n        quest_page_layout.addWidget(self.back_to_achievement, 0, Qt.AlignLeft)\n        self.quest_detail_view = QuestDetailView(\n            self.quest_provider,\n            self.quest_graph,\n            self.quest_progress_service,\n            achievement_provider=self.provider,\n            guide_provider=self.guide_provider,\n            character_key=self.character_key,\n            open_quest=self.show_quest,\n            open_prerequisite=self.open_prerequisite_in_quests,\n            navigate_entity=self.open_shared_entity,\n        )\n        self.quest_detail_view.setSizePolicy(QSizePolicy.Ignored, QSizePolicy.Expanding)\n        quest_page_layout.addWidget(self.quest_detail_view, 1)\n        self.detail_stack.addWidget(self.quest_detail_page)\n        self.quest_detail_view.questProgressChanged.connect(\n            self.on_embedded_quest_progress_changed\n        )\n\n''',
              '''        # Linked quests now open the canonical Quêtes tab. Do not build a\n        # second hidden QuestDetailView inside Succès: it is unreachable product UI\n        # and adds measurable construction/RAM cost to every Encyclopedia opening.\n\n''',
          )

          replace_once(
              '''        if quest_graph is not None:\n            self.quest_graph = quest_graph\n            self.quest_detail_view.update_related_context(\n                achievement_provider=self.provider,\n                guide_provider=self.guide_provider,\n                graph=quest_graph,\n            )\n''',
              '''        if quest_graph is not None:\n            self.quest_graph = quest_graph\n''',
          )

          replace_once(
              '''    def set_character_key(self, character_key: str) -> None:\n        self.character_key = character_key or ""\n        if not self._runtime_ready:\n            self.quest_detail_view.set_character_key(self.character_key)\n            return\n        self.quest_progress_service.reload()\n        self.sync_automatic_progress()\n        self.quest_detail_view.set_character_key(self.character_key)\n        self.refresh_completion_styles()\n        if self.detail_stack.currentWidget() is self.quest_detail_page:\n            self.quest_detail_view.refresh()\n        elif self._detail_open and self.current_achievement_id is not None:\n            self.show_achievement(self.current_achievement_id)\n\n\n\n    def on_embedded_quest_progress_changed(self, _quest_id: int) -> None:\n        """Refresh only achievement state derived from the shared quest mutation."""\n\n        self.quest_progress_service.reload()\n        self.sync_automatic_progress()\n        self.refresh_completion_styles()\n\n\n\n''',
              '''    def set_character_key(self, character_key: str) -> None:\n        self.character_key = character_key or ""\n        if not self._runtime_ready:\n            return\n        self.quest_progress_service.reload()\n        self.sync_automatic_progress()\n        self.refresh_completion_styles()\n        if self._detail_open and self.current_achievement_id is not None:\n            self.show_achievement(self.current_achievement_id)\n\n\n''',
          )

          replace_once(
              '''        self.refresh_completion_styles()\n        if self.detail_stack.currentWidget() is self.quest_detail_page:\n            self.quest_detail_view.refresh()\n        elif self._detail_open and self.current_achievement_id is not None:\n            self.show_achievement(self.current_achievement_id)''',
              '''        self.refresh_completion_styles()\n        if self._detail_open and self.current_achievement_id is not None:\n            self.show_achievement(self.current_achievement_id)''',
          )

          path.write_text(text, encoding="utf-8")
          '@ | python -

          $legacy = git grep -n "quest_detail_view\|quest_detail_page\|on_embedded_quest_progress_changed\|QuestViewContext" -- app/modules/encyclopedia/views/achievements_view.py 2>$null
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Host $legacy; throw "obsolete embedded Success quest detail references remain" }
          if ($code -ne 1) { throw "git grep failed with exit code $code" }
          exit 0

      - name: Sync ROAD IA context
        shell: pwsh
        run: python -m tools.ai_context sync

      - name: Materialize Dofus catalog
        shell: pwsh
        run: |
          git lfs pull --include="tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) { Remove-Item -LiteralPath $catalog -Recurse -Force }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and test
        shell: pwsh
        run: |
          python -m py_compile app/modules/encyclopedia/views/achievements_view.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_lazy_quests_page_performance tests.test_achievements_phase2 tests.test_project_guardrails tests.test_atlas_doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit performance fix
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "r9327"
          git config user.email "216230118+r9327@users.noreply.github.com"
          git add app/modules/encyclopedia/views/achievements_view.py .ai/context_index.json
          git commit -m "perf(encyclopedia): remove unreachable Success quest detail"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:$env:TARGET_BRANCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
