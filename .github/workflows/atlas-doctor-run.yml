name: Atlas Doctor Details and Perf Compare

on:
  push:
    branches:
      - run/atlas-doctor-20260929

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  BEFORE_SHA: c06af5f03bd96538bc2d11dbd39e1b946ce33300
  AFTER_SHA: 07e14fa90eacd9143fc71140359386aeb8c6b5e2

jobs:
  doctor-details:
    name: Doctor details on merged SHA
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout merged snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.AFTER_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify exact merged SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Atlas Doctor target SHA: $actual"
          if ($actual -ne $env:AFTER_SHA) { throw "Checkout mismatch" }
          git status --short

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Materialize certification LFS fixtures
        shell: pwsh
        run: |
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**,tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize local Dofus catalog
        shell: pwsh
        run: |
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) { Remove-Item -LiteralPath $catalog -Recurse -Force }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Doctor audit and report
        shell: pwsh
        run: |
          python tools/atlas_doctor.py --json audit --force --gate critical | Tee-Object -FilePath doctor-audit-console.json
          $auditCode = $LASTEXITCODE
          Write-Host "ATLAS_DOCTOR_AUDIT_EXIT=$auditCode"
          python tools/atlas_doctor.py --json report | Tee-Object -FilePath doctor-report-console.json
          Write-Host "ATLAS_DOCTOR_REPORT_EXIT=$LASTEXITCODE"
          if (-not (Test-Path -LiteralPath "doctor-audit-console.json")) { throw "Doctor audit JSON missing" }

      - name: Upload Doctor details
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-doctor-details-after
          path: |
            .ai/runtime/atlas_doctor/*.json
            doctor-audit-console.json
            doctor-report-console.json
          if-no-files-found: error
          retention-days: 7

  perf-before-after:
    name: Canonical performance before vs after
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout BEFORE snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BEFORE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify BEFORE SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "BEFORE target SHA: $actual"
          if ($actual -ne $env:BEFORE_SHA) { throw "BEFORE checkout mismatch" }

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Materialize benchmark data and certification fixtures
        shell: pwsh
        run: |
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**,tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) { Remove-Item -LiteralPath $catalog -Recurse -Force }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path perf-results | Out-Null

      - name: Run BEFORE benchmark three times
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "=== BEFORE benchmark run $_ ==="
            python -m app.modules.encyclopedia.tools.benchmark_guides_performance
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "artifacts/quests_guides_performance.json" "perf-results/before-$_.json" -Force
          }

      - name: Checkout AFTER snapshot on same runner
        shell: pwsh
        run: |
          git checkout --force $env:AFTER_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "AFTER target SHA: $actual"
          if ($actual -ne $env:AFTER_SHA) { throw "AFTER checkout mismatch" }

      - name: Run AFTER benchmark three times
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "=== AFTER benchmark run $_ ==="
            python -m app.modules.encyclopedia.tools.benchmark_guides_performance
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "artifacts/quests_guides_performance.json" "perf-results/after-$_.json" -Force
          }

      - name: Upload benchmark samples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-perf-before-after
          path: perf-results/*.json
          if-no-files-found: error
          retention-days: 7
