name: Atlas Doctor Run

on:
  push:
    branches:
      - run/atlas-doctor-20260929

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  DOCTOR_SHA: 07e14fa90eacd9143fc71140359386aeb8c6b5e2

jobs:
  doctor:
    name: Atlas Doctor merged snapshot
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout merged snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DOCTOR_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify exact merged SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Atlas Doctor target SHA: $actual"
          if ($actual -ne $env:DOCTOR_SHA) { throw "Checkout mismatch" }
          git status --short

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Materialize validation LFS fixtures
        shell: pwsh
        run: |
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize local Dofus catalog
        shell: pwsh
        run: |
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) { Remove-Item -LiteralPath $catalog -Recurse -Force }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Atlas Doctor audit critical
        shell: pwsh
        run: |
          python tools/atlas_doctor.py --json audit --force --gate critical
          $code = $LASTEXITCODE
          Write-Host "ATLAS_DOCTOR_AUDIT_EXIT=$code"
          exit 0

      - name: Atlas Doctor performance files
        shell: pwsh
        run: |
          python tools/atlas_doctor.py --json perf --files-only
          $code = $LASTEXITCODE
          Write-Host "ATLAS_DOCTOR_PERF_EXIT=$code"
          exit 0

      - name: Atlas Doctor AI report
        shell: pwsh
        run: |
          python tools/atlas_doctor.py --json report
          $code = $LASTEXITCODE
          Write-Host "ATLAS_DOCTOR_REPORT_EXIT=$code"
          exit 0
