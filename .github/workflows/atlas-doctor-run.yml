name: Atlas Doctor Zero Actionable Patch

on:
  push:
    branches:
      - run/atlas-doctor-20260929

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  TARGET_BRANCH: doctor/zero-actionable-v1

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Apply exact diagnostic patches
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/input/hotkeys.py",
              '''            except Exception:\n                pass\n        return spec.matches(self.input_state.snapshot())''',
              '''            except Exception as exc:\n                self.logger.debug(\n                    "Lecture physique des touches indisponible; fallback InputState: %s",\n                    exc,\n                )\n        return spec.matches(self.input_state.snapshot())''',
          )

          replace_once(
              "app/modules/encyclopedia/services/guide_auto_validation_contract.py",
              '''import copy\nimport re''',
              '''import copy\nimport logging\nimport re''',
          )
          replace_once(
              "app/modules/encyclopedia/services/guide_auto_validation_contract.py",
              '''AUTO_VALIDATION_SCHEMA_VERSION = 1''',
              '''LOGGER = logging.getLogger(__name__)\n\nAUTO_VALIDATION_SCHEMA_VERSION = 1''',
          )
          replace_once(
              "app/modules/encyclopedia/services/guide_auto_validation_contract.py",
              '''        except Exception:\n            # Custom providers or partial test data retain the historical path.\n            pass\n\n    return _achievement_index_from_loaded_provider(achievement_provider)''',
              '''        except Exception as exc:\n            # Custom providers or partial test data retain the historical path.\n            LOGGER.debug(\n                "Index Succès léger indisponible; fallback provider complet: %s",\n                exc,\n            )\n\n    return _achievement_index_from_loaded_provider(achievement_provider)''',
          )

          replace_once(
              "app/pages/craft_page.py",
              '''import difflib\nfrom datetime import datetime''',
              '''import difflib\nimport logging\nfrom datetime import datetime''',
          )
          replace_once(
              "app/pages/craft_page.py",
              '''_RESULT_BATCH_SIZE = 8''',
              '''LOGGER = logging.getLogger(__name__)\n\n_RESULT_BATCH_SIZE = 8''',
          )
          replace_once(
              "app/pages/craft_page.py",
              '''            except Exception:\n                pass\n\n        # The old fallback returned the first substring match''',
              '''            except Exception as exc:\n                LOGGER.debug(\n                    "Recherche cache local indisponible pour %r; fallback index mémoire: %s",\n                    name,\n                    exc,\n                )\n\n        # The old fallback returned the first substring match''',
          )

          replace_once(
              "app/storage.py",
              '''    except Exception:\n        pass\n\n    def enum_callback(hwnd: int, _extra: Any) -> bool:''',
              '''    except Exception as exc:\n        LOGGER.debug("WindowFromPoint Unity indisponible pour %s: %s", point, exc)\n\n    def enum_callback(hwnd: int, _extra: Any) -> bool:''',
          )
          replace_once(
              "app/storage.py",
              '''    try:\n        win32gui.EnumWindows(enum_callback, None)\n    except Exception:\n        pass\n\n    seen: set[int] = set()''',
              '''    try:\n        win32gui.EnumWindows(enum_callback, None)\n    except Exception as exc:\n        LOGGER.debug("EnumWindows Unity interrompu pour %s: %s", point, exc)\n\n    seen: set[int] = set()''',
          )
          '@ | python -

      - name: Compile patched modules
        shell: pwsh
        run: |
          python -m py_compile app/input/hotkeys.py app/modules/encyclopedia/services/guide_auto_validation_contract.py app/pages/craft_page.py app/storage.py app/network/build_fingerprint.py app/windows/focus.py app/windows/unity_windows.py app/pages/quests_page.py tools/atlas_doctor_lib/audit.py tools/atlas_doctor_lib/core.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify no broad silent pass remains in runtime
        shell: pwsh
        run: |
          @'
          import ast
          from pathlib import Path

          findings = []
          for path in [Path("main.py"), *Path("app").rglob("*.py")]:
              if not path.is_file():
                  continue
              tree = ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.ExceptHandler):
                      continue
                  if not node.body or not all(isinstance(row, ast.Pass) for row in node.body):
                      continue
                  broad = node.type is None
                  if node.type is not None:
                      try:
                          broad = ast.unparse(node.type) in {"Exception", "BaseException"}
                      except Exception:
                          broad = True
                  if broad:
                      findings.append(f"{path}:{getattr(node, 'lineno', '?')}")
          if findings:
              raise SystemExit("Broad silent exception(s) remain:\n" + "\n".join(findings))
          print("No broad silent runtime exception remains")
          '@ | python -

      - name: Commit cleanup
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "r9327"
          git config user.email "216230118+r9327@users.noreply.github.com"
          git add app/input/hotkeys.py app/modules/encyclopedia/services/guide_auto_validation_contract.py app/pages/craft_page.py app/storage.py
          if (git diff --cached --quiet) {
            Write-Host "No patch changes to commit"
            exit 0
          }
          git commit -m "cleanup(runtime): diagnose intentional fallback paths"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:$env:TARGET_BRANCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
