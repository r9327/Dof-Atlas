name: Atlas Tools / Bench — On Demand

# Explicit collaborative development diagnostics only, including Draft PRs.
# Never a Phase Certification, required merge check or automatic push benchmark.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR number, Draft accepted"
        required: true
        type: number
      mode:
        description: "Existing canonical Atlas tool or benchmark"
        required: true
        type: choice
        options:
          - tools
          - audit
          - ponytail
          - oss
          - bench-quick
          - bench-runtime
          - bench-memory
          - bench-preload
          - bench-8
          - bench-full
      expected_sha:
        description: "Exact HEAD SHA; reject stale requests (recommended)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/atlas tools') ||
      startsWith(github.event.comment.body, '/atlas audit') ||
      startsWith(github.event.comment.body, '/atlas ponytail') ||
      startsWith(github.event.comment.body, '/atlas oss') ||
      startsWith(github.event.comment.body, '/atlas bench ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.request.outputs.pr_number }}
      mode: ${{ steps.request.outputs.mode }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      base_sha: ${{ steps.request.outputs.base_sha }}
    steps:
      # This parser must run from main, NEVER from a PR checkout.
      - name: Checkout trusted request resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          lfs: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify collaborator, PR, allowed mode and exact SHA
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I tools/doctor_pr_on_demand.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --report request.json --github-output "$GITHUB_OUTPUT"
      - name: Store authorized request metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-tools-request-${{ github.run_id }}
          path: request.json
          retention-days: 7
          if-no-files-found: ignore

  light:
    needs: resolve
    if: >-
      needs.resolve.result == 'success' &&
      (needs.resolve.outputs.mode == 'tools' ||
      needs.resolve.outputs.mode == 'audit' ||
      needs.resolve.outputs.mode == 'ponytail' ||
      needs.resolve.outputs.mode == 'oss' ||
      needs.resolve.outputs.mode == 'bench-quick')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: atlas-tools-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.mode }}
      cancel-in-progress: true
    env:
      MODE: ${{ needs.resolve.outputs.mode }}
      HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
    steps:
      - name: Checkout exact PR candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Checkout trusted tool dispatcher (separate from PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .atlas_tools_runner
          sparse-checkout: |
            tools/atlas_tools_on_demand.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          lfs: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install only pinned approved OSS scanners when requested
        if: env.MODE == 'oss'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "ruff==0.17.3" "zizmor==1.30.1"
      - name: Execute selected canonical tool only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/atlas_tools_on_demand
          python -I .atlas_tools_runner/tools/atlas_tools_on_demand.py \
            --mode "$MODE" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            > artifacts/atlas_tools_on_demand/summary.json
      - name: Archive exact-SHA developer tool evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-tools-pr-${{ needs.resolve.outputs.pr_number }}-${{ env.MODE }}-${{ env.HEAD_SHA }}
          path: |
            artifacts/atlas_tools_on_demand/
            .ai/runtime/atlas_doctor/latest_perf.json
          if-no-files-found: warn
          retention-days: 7

  windows_bench:
    needs: resolve
    if: >-
      needs.resolve.result == 'success' &&
      (needs.resolve.outputs.mode == 'bench-runtime' ||
       needs.resolve.outputs.mode == 'bench-memory' ||
       needs.resolve.outputs.mode == 'bench-preload' ||
       needs.resolve.outputs.mode == 'bench-8' ||
       needs.resolve.outputs.mode == 'bench-full')
    runs-on: windows-latest
    timeout-minutes: 160 # Individual commands have smaller explicit deadlines
    concurrency:
      group: atlas-tools-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.mode }}
      cancel-in-progress: true
    env:
      MODE: ${{ needs.resolve.outputs.mode }}
      HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QT_OPENGL: software
      QT_QUICK_BACKEND: software
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact PR candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Checkout trusted tool dispatcher (separate from PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .atlas_tools_runner
          sparse-checkout: |
            tools/atlas_tools_on_demand.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          lfs: false
      - name: Verify exact HEAD
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:HEAD_SHA) { throw "Candidate SHA mismatch" }
      - name: Set up Python 3.13 with pinned dependency cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt
      - name: Install canonical pinned Atlas application dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize pinned Quest / Craft benchmarks inputs
        shell: pwsh
        run: |
          # Same canonical materialization as atlas-short-full-app.yml.
          # Pinned SHA-256 validation remains mandatory. Bounded retry only
          # for transient upstream 504/transport errors; never use a fallback
          # unverified dataset or accept a failed last attempt.
          foreach ($module in @("scripts.windows.quest_assets", "scripts.windows.craft_seed")) {
            $ok = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              python -m $module --download
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $ok) { throw "Pinned asset materialization failed after three attempts: $module" }
          }
          @'
          from pathlib import Path
          from shutil import copy2
          from scripts.windows.craft_seed import validate_seed
          from local_dofus_data.config import DEFAULT_CONFIG
          from app.craft_preload import build_compact_craft_preload
          from app.quest_catalog import QuestCatalog

          seed = Path("data/bootstrap/craft_seed.sqlite")
          validate_seed(seed)
          target = DEFAULT_CONFIG.sqlite_path
          target.parent.mkdir(parents=True, exist_ok=True)
          if target.exists():
              raise SystemExit("Existing Craft catalog, refusing overwrite")
          copy2(seed, target)
          validate_seed(target)
          craft = build_compact_craft_preload()
          if craft.get("_prepared") is not True or craft.get("errors"):
              raise SystemExit("Incomplete Craft preload fixture")
          if len(QuestCatalog.load().quests) < 1900:
              raise SystemExit("Incomplete Quest catalog")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing Windows/Qt benchmark motors on candidate SHA
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/atlas_tools_on_demand | Out-Null
          python -I .atlas_tools_runner/tools/atlas_tools_on_demand.py --mode "$env:MODE" --base-sha "$env:BASE_SHA" --head-sha "$env:HEAD_SHA" > artifacts/atlas_tools_on_demand/summary.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive Windows benchmark evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-tools-pr-${{ needs.resolve.outputs.pr_number }}-${{ env.MODE }}-${{ env.HEAD_SHA }}
          path: |
            artifacts/atlas_tools_on_demand/
            artifacts/atlas_exhaustive/
            .ai/runtime/atlas_doctor/latest_perf.json
          if-no-files-found: warn
          retention-days: 7

  freshness:
    # Isolated runner with token checks the CURRENT PR HEAD after untrusted
    # candidate code has exited; the benchmark jobs never have GH_TOKEN.
    needs: [resolve, light, windows_bench]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only this isolated receipt/freshness job can write; candidate jobs have no token.
      pull-requests: write
    steps:
      - name: Reject failed diagnostic or a PR HEAD that moved
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.head_sha }}
          LIGHT_RESULT: ${{ needs.light.result }}
          WINDOWS_RESULT: ${{ needs.windows_bench.result }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$now" = "$EXPECTED_SHA" || { echo "::error::STALE exact-SHA evidence"; exit 1; }
          if [ "$LIGHT_RESULT" != "success" ] && [ "$WINDOWS_RESULT" != "success" ]; then
            echo "::error::Tool execution was not successful: $LIGHT_RESULT/$WINDOWS_RESULT"
            exit 1
          fi
          {
            echo "## Atlas development tools — on-demand"
            echo "- PR: #$PR_NUMBER"
            echo "- Exact current SHA: $EXPECTED_SHA"
            echo "- Phase Certification: NOT_RUN"
            echo "- Real DOFUS Unity accounts (2–8): NOT_RUN"
            echo "- Examine candidate-specific artifact; an unavailable tool is not PASS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish discoverable exact-SHA run receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          MODE: ${{ needs.resolve.outputs.mode }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          LIGHT_RESULT: ${{ needs.light.result }}
          WINDOWS_RESULT: ${{ needs.windows_bench.result }}
          FRESHNESS_RESULT: ${{ steps.verify.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v body '### Atlas on-demand — %s\n- Run: %s (ID %s)\n- PR: #%s\n- Candidate SHA: %s\n- Tool job (Ubuntu/Windows): %s / %s\n- Freshness: %s\n- Phase Certification: NOT_RUN; live DOFUS 2–8 accounts: NOT_RUN\n\nRead the run artifact and re-check the current PR HEAD before claiming any result. This receipt is NOT a PASS or certification.\n' \
            "$MODE" "$RUN_URL" "$RUN_ID" "$PR_NUMBER" "$HEAD_SHA" \
            "$LIGHT_RESULT" "$WINDOWS_RESULT" "$FRESHNESS_RESULT"
          # GitHub accepts either Issues:write or PullRequests:write here.
          # Keep the token isolated, record safe HTTP diagnostics, and retain
          # the artifact fallback if the Actions installation is denied.
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          delivery=COMMENT_UNAVAILABLE
          if gh api --include "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --method POST -f "body=$body" > "$response" 2>/dev/null; then
            delivery=COMMENT_POSTED
          fi
          http_status="$(awk '$1 ~ /^HTTP/ { code=$2 } END { print code }' "$response")"
          if ! [[ "$http_status" =~ ^[0-9]{3}$ ]]; then http_status=UNKNOWN; fi
          request_id="$(awk 'tolower($1) == "x-github-request-id:" { value=$2 } END { print value }' "$response" | tr -cd 'A-Za-z0-9:-' | cut -c1-96)"
          request_id="${request_id:-UNAVAILABLE}"
          if [ "$delivery" = COMMENT_UNAVAILABLE ]; then
            echo "::warning::PR receipt unavailable (HTTP $http_status; GitHub request $request_id); use run-scoped JSON artifact."
          fi
          export RECEIPT_DELIVERY="$delivery" RECEIPT_HTTP_STATUS="$http_status" RECEIPT_REQUEST_ID="$request_id"
          mkdir -p artifacts/atlas_tools_receipt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          keys = ("PR_NUMBER", "MODE", "HEAD_SHA", "LIGHT_RESULT",
                  "WINDOWS_RESULT", "FRESHNESS_RESULT", "RUN_ID", "RUN_URL")
          record = {key.lower(): os.environ[key] for key in keys}
          record.update({
              "schema_version": 1,
              "receipt_delivery": os.environ["RECEIPT_DELIVERY"],
              "receipt_http_status": os.environ["RECEIPT_HTTP_STATUS"],
              "receipt_request_id": os.environ["RECEIPT_REQUEST_ID"],
              "phase_certified": False,
              "live_dofus_accounts_tested": False,
          })
          target = Path("artifacts/atlas_tools_receipt/receipt.json")
          target.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
          echo "- Receipt delivery: $delivery (fallback artifact: atlas-tools-receipt-$RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive run receipt even when GitHub denies comment permissions
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-tools-receipt-${{ github.run_id }}
          path: artifacts/atlas_tools_receipt/receipt.json
          if-no-files-found: warn
          retention-days: 7
