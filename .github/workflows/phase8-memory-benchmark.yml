name: Phase 8 Memory Benchmark

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      lifecycle_cycles:
        description: "Navigation RAM Windows : 2 cycles normaux ou 5 cycles et vues lourdes"
        type: choice
        required: true
        default: "2"
        options:
          - "2"
          - "5"

permissions:
  contents: read

concurrency:
  # Separate independent callers (Phase Certification vs Guides Proof) so neither cancels the other.
  group: dof-atlas-phase8-memory-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  QT_OPENGL: software
  QT_QUICK_BACKEND: software
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: pwsh

jobs:
  benchmark:
    name: Phase 8 / Staged Memory Benchmark
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize complete quest catalogue
        run: |
          git lfs pull --include="tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) {
            Remove-Item -LiteralPath $catalog -Recurse -Force
          }
          python -m scripts.windows.quest_assets --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.windows.craft_seed --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from app.quest_catalog import QuestCatalog
          count = len(QuestCatalog.load().quests)
          print(f"Materialized QuestCatalog: {count} quests")
          if count < 1900:
              raise SystemExit(f"Quest catalog incomplete: {count}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure staged process and process-tree memory
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/phase8_memory" | Out-Null
          $token = [guid]::NewGuid().ToString("N")
          $env:DOFUS_ATLAS_CACHE_WARMUP_TOKEN = $token
          # Unique handshake: the worker may import but cannot allocate its
          # large Guide/Items heap until the Atlas tree sampler is live.
          $goFile = Join-Path $env:RUNNER_TEMP ("atlas_warmup_" + $token + ".ready")
          if (Test-Path -LiteralPath $goFile) { Remove-Item -LiteralPath $goFile -Force }
          $env:DOFUS_ATLAS_WARMUP_GO_FILE = $goFile
          $warmupOut = "artifacts/phase8_memory/warmup.stdout.log"
          $warmupErr = "artifacts/phase8_memory/warmup.stderr.log"
          $python = (Get-Command python).Source
          $warmup = Start-Process -FilePath $python -ArgumentList @(
            "-m",
            "app.startup_cache_warmup",
            "--token",
            $token
          ) -PassThru -NoNewWindow -RedirectStandardOutput $warmupOut -RedirectStandardError $warmupErr
          # Track the warmer AND its temporary child workers alongside Atlas;
          # both run concurrently and must count towards the same peak budget.
          $env:DOFUS_ATLAS_WARMUP_PID = [string]$warmup.Id

          # Manual extended mode only. Reused workflow_call / certification
          # retain the unchanged two-cycle baseline and all hard RSS gates.
          $lifecycleArgs = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.lifecycle_cycles }}" -eq "5") {
            $lifecycleArgs = @("--navigation-cycles", "5", "--include-heavy-views")
          }
          python -X faulthandler tools/benchmark_phase8_memory.py --output artifacts/phase8_memory/memory.json @lifecycleArgs
          $code = $LASTEXITCODE

          if (-not $warmup.HasExited) {
            $finished = $warmup.WaitForExit(120000)
            if (-not $finished) {
              Stop-Process -Id $warmup.Id -Force
              throw "Startup cache warmup did not finish within 120 seconds."
            }
          }
          if ($warmup.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $warmupOut) { Get-Content -LiteralPath $warmupOut }
            if (Test-Path -LiteralPath $warmupErr) { Get-Content -LiteralPath $warmupErr }
            throw "Startup cache warmup failed with code $($warmup.ExitCode)."
          }
          $warmupResult = ".cache/dofus_atlas/startup_cache_warmup_v1.json"
          if (Test-Path -LiteralPath $warmupResult) {
            Write-Host "Startup cache warmup result:"
            Get-Content -LiteralPath $warmupResult
            Copy-Item -LiteralPath $warmupResult -Destination "artifacts/phase8_memory/warmup.cold.json" -Force
          }

          # Hot reuse is not concurrent with the Atlas sampler.
          Remove-Item Env:DOFUS_ATLAS_WARMUP_GO_FILE -ErrorAction SilentlyContinue
          # Run the same warmup once more after the measured app process is gone.
          # Every reconstructible domain must hit the manifest fast path; this
          # proves the optimization removes work instead of deferring it.
          $hotToken = [guid]::NewGuid().ToString("N")
          $hotOut = "artifacts/phase8_memory/warmup.hot.stdout.log"
          $hotErr = "artifacts/phase8_memory/warmup.hot.stderr.log"
          $hot = Start-Process -FilePath $python -ArgumentList @(
            "-m",
            "app.startup_cache_warmup",
            "--token",
            $hotToken
          ) -PassThru -Wait -NoNewWindow -RedirectStandardOutput $hotOut -RedirectStandardError $hotErr
          if ($hot.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $hotOut) { Get-Content -LiteralPath $hotOut }
            if (Test-Path -LiteralPath $hotErr) { Get-Content -LiteralPath $hotErr }
            throw "Hot startup cache warmup failed with code $($hot.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $warmupResult)) {
            throw "Hot startup cache warmup produced no result."
          }
          Copy-Item -LiteralPath $warmupResult -Destination "artifacts/phase8_memory/warmup.hot.json" -Force
          $hotPayload = Get-Content -LiteralPath $warmupResult -Raw | ConvertFrom-Json
          foreach ($domain in @("guide", "quest", "success")) {
            if ($hotPayload.domains.$domain.mode -ne "reused") {
              throw "Hot startup cache warmup rebuilt $domain instead of reusing it."
            }
          }
          if ([double]$hotPayload.elapsed_ms -gt 5000.0) {
            throw "Hot startup cache warmup exceeded 5 s: $($hotPayload.elapsed_ms) ms."
          }
          Write-Host "Hot startup cache warmup result:"
          Get-Content -LiteralPath $warmupResult

          if (-not (Test-Path -LiteralPath "artifacts/phase8_memory/memory.json")) {
            exit $code
          }
          if ($code -ne 0 -and $code -ne -1073741819) {
            exit $code
          }
          $global:LASTEXITCODE = 0

      - name: Validate memory evidence shape
        run: |
          @'
          import json
          from pathlib import Path

          path = Path("artifacts/phase8_memory/memory.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          metrics = payload.get("metrics") or {}
          stages = metrics.get("stages") or []
          by_label = {str(row.get("label")): row for row in stages if isinstance(row, dict)}
          required = (
              "startup_stabilized",
              "after_preload",
              "quests_active",
              "after_quests_home",
              "achievements_active",
              "after_achievements_home",
              "guide_active",
              "after_guide_home",
              "craft_active",
              "after_craft_home",
              "before_equipment_home",
              "equipment_active",
              "after_equipment_home",
              "after_equipment_home_stabilized",
              "after_guide_home_stabilized",
              "repeat_1_quests_home",
              "repeat_1_achievements_home",
              "repeat_1_guide_home",
              "repeat_2_quests_home",
              "repeat_2_achievements_home",
              "repeat_2_guide_home",
          )
          missing = [name for name in required if name not in by_label]
          if missing:
              raise SystemExit("memory benchmark missing stages: " + ", ".join(missing))
          from tools.phase8_memory_tolerance import (
              classify, hard_limit, require_peak_tree_rss, require_memory_observation,
          )
          for label in required:
              row = by_label[label]
              for kind in ("process_rss_mb", "tree_rss_mb"):
                  require_memory_observation(row.get(kind), label=f"{label}.{kind}", positive=True)

          # Phase 8 policy: the former 100 MB Home target is observational,
          # not a merge gate. Keep the actual RSS values and emit annotations
          # for any overshoot; never report a budget hit as "within target".
          # Memory targets stay visible; all hard memory measurements admit
          # at most +5% observation tolerance, with an explicit warning.
          # Proof integrity and missing or invalid observations remain strict.
          advisory_home_budgets_mb = {
              "after_quests_home": 100.0,
              "after_achievements_home": 100.0,
              "after_guide_home": 100.0,
              "after_craft_home": 100.0,
              "after_equipment_home_stabilized": 100.0,
              "after_guide_home_stabilized": 100.0,
              "repeat_1_quests_home": 100.0,
              "repeat_1_achievements_home": 100.0,
              "repeat_1_guide_home": 100.0,
              "repeat_2_quests_home": 100.0,
              "repeat_2_achievements_home": 100.0,
              "repeat_2_guide_home": 100.0,
          }
          preload_mb = require_memory_observation(
              by_label["after_preload"]["tree_rss_mb"], label="after_preload.tree_rss_mb", positive=True)
          preload_target_mb = 95.0
          preload_limit_mb = hard_limit(preload_target_mb)
          preload_status = classify(preload_mb, preload_target_mb)
          if preload_status == "FAIL":
              raise SystemExit(
                  "preload memory tolerance exceeded: "
                  f"{preload_mb:.2f} MB > {preload_limit_mb:.2f} MB "
                  f"(target: {preload_target_mb:.2f} MB; +5% ceiling)"
              )
          if preload_status == "WARNING":
              print(
                  "::warning title=Preload RAM above target (5% tolerance)::"
                  f"{preload_mb:.2f} MB > {preload_target_mb:.2f} MB; "
                  f"hard ceiling: {preload_limit_mb:.2f} MB"
              )

          home_advisories = []
          for label, budget in advisory_home_budgets_mb.items():
              measured = require_memory_observation(by_label[label]["tree_rss_mb"], label=label, positive=True)
              if measured >= budget:
                  warning = (
                      f"{label}: {measured:.2f} MB >= {budget:.2f} MB "
                      "(100 MB Home target advisory, NOT a hard failure)"
                  )
                  home_advisories.append(warning)
                  print(f"::warning title=Memory Home target (advisory)::{warning}")

          print(
              "HOME_TARGET_ADVISORY: " +
              (", ".join(home_advisories) if home_advisories else "all measured stages below 100 MB")
          )
          peak_tree = require_peak_tree_rss(metrics, preload_mb=preload_mb)
          peak_target_mb = 220.0
          peak_hard_limit_mb = hard_limit(peak_target_mb)
          if classify(peak_tree, peak_target_mb) == "FAIL":
              raise SystemExit(
                  "process-tree peak tolerance exceeded: "
                  f"{peak_tree:.2f} MB > {peak_hard_limit_mb:.2f} MB "
                  f"(target: {peak_target_mb:.2f} MB; +5% tolerance)"
              )
          if classify(peak_tree, peak_target_mb) == "WARNING":
              print(
                  "::warning title=Peak RAM above target (5% tolerance)::"
                  f"{peak_tree:.2f} MB exceeds the {peak_target_mb:.2f} MB target; "
                  f"hard ceiling is {peak_hard_limit_mb:.2f} MB"
              )

          retained_budgets_mb = {
              "achievements_retained_tree_delta_mb": 15.0,
              "guide_retained_tree_delta_mb": 20.0,
              "craft_retained_tree_delta_mb": 2.0,
              "equipment_tree_delta_stabilized_mb": 1.0,
          }
          for metric, budget in retained_budgets_mb.items():
              # The original limit is still the target. Do not silently label
              # tolerated overshoot as PASS or widen the tolerance beyond 5%.
              measured = require_memory_observation(metrics.get(metric), label=metric, allow_negative=True)
              limit = hard_limit(budget)
              state = classify(measured, budget, allow_negative=True)
              if state == "FAIL":
                  raise SystemExit(
                      f"retained memory tolerance exceeded for {metric}: "
                      f"{measured:.2f} MB > {limit:.2f} MB "
                      f"(target: {budget:.2f} MB; +5% ceiling)"
                  )
              if state == "WARNING":
                  print(
                      f"::warning title=Retained RAM above target (5% tolerance)::{metric}: "
                      f"{measured:.2f} MB > {budget:.2f} MB; "
                      f"hard ceiling: {limit:.2f} MB"
                  )

          print(json.dumps(metrics, ensure_ascii=False, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish memory summary
        if: always()
        run: |
          $path = "artifacts/phase8_memory/memory.json"
          if (-not (Test-Path -LiteralPath $path)) { exit 0 }
          $payload = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Phase 8 staged memory"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Stage | App RSS MB | Tree RSS MB | Children |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|---|---:|---:|---:|"
          foreach ($row in $payload.metrics.stages) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| $($row.label) | $($row.process_rss_mb) | $($row.tree_rss_mb) | $($row.child_count) |"
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Peak app RSS: $($payload.metrics.peak_process_rss_mb) MB"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Home RSS <100 MB: **advisory only**, values and overshoots are displayed above; not a merge gate."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Peak process-tree RSS: $($payload.metrics.peak_tree_rss_mb) MB (target: 220 MB; hard gate: 231 MB with +5% tolerance)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Success retained tree delta after Home: $($payload.metrics.achievements_retained_tree_delta_mb) MB (budget: 15 MB)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Guide retained tree delta after Home: $($payload.metrics.guide_retained_tree_delta_mb) MB (budget: 20 MB)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Craft retained tree delta after Home: $($payload.metrics.craft_retained_tree_delta_mb) MB (target: 2 MB; hard ceiling: 2.10 MB with +5% tolerance)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Equipment active tree delta: $($payload.metrics.equipment_tree_delta_active_mb) MB"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Equipment retained tree delta after Home: $($payload.metrics.equipment_tree_delta_stabilized_mb) MB"

      - name: Upload memory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase8-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/phase8_memory/**
          if-no-files-found: error
          retention-days: 30
