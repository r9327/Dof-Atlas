name: Atlas Windows Distribution
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/distribution/**"
      - "scripts/windows/package_release.py"
      - "scripts/windows/export_app_repository.py"
      - "scripts/windows/atlas_launcher_entry.py"
      - "tests/test_distribution_*.py"
      - "main.py"
      - "launch.py"
      - "app/constants.py"
      - ".github/workflows/atlas-windows-distribution.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Phase Certification"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-distribution-${{ github.event_name == 'workflow_run' && 'release' || github.event_name == 'workflow_dispatch' && 'manual' || github.event.action == 'ready_for_review' && 'candidate' || 'focused' }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    name: Focused updater contracts
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Compile updater modules
        run: python -m compileall -q app/distribution scripts/windows/package_release.py scripts/windows/export_app_repository.py scripts/windows/atlas_setup_entry.py launch.py
      - name: Focused updater tests
        run: python -m unittest discover -s tests -p 'test_distribution_*.py' -v
  windows-bundle:
    name: Windows bundle (gated certification)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review' &&
       github.head_ref == 'feature/atlas-auto-update-distribution-20261013') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.ATLAS_DISTRIBUTION_ENABLED == 'true')
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha) }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          # Avoid downloading all development/tooling Git-LFS files.
          lfs: false
          persist-credentials: false
      - name: Fetch only startup images for frozen candidate
        if: github.event_name != 'workflow_run'
        run: |
          # Candidate verifies EXE/Qt integration; it is NOT a distributable full release.
          git lfs pull --include="data/images/misc/**,data/images/classes/**" --exclude=""
      - name: Materialize full application data for certified release
        if: github.event_name == 'workflow_run'
        run: |
          git lfs pull --include="data/**" --exclude=""
      - name: Ensure successful certification applies to current main HEAD
        if: github.event_name == 'workflow_run'
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Focused Windows tests
        run: python -m unittest discover -s tests -p 'test_distribution_*.py' -v
      - name: Install hashed runtime and pinned build tool
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          python -m pip install pyinstaller==6.16.0
      - name: Compile application bundle with QtWebEngine and worker modules
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name AtlasApp --paths . \
            --hidden-import PySide6.QtWebEngineWidgets \
            --hidden-import PySide6.QtWebEngineCore \
            --hidden-import app.craft_preload \
            --hidden-import app.quest_catalog_details \
            --hidden-import app.startup_cache_warmup \
            --hidden-import app.startup_cache_domain_worker \
            --collect-submodules app \
            --collect-submodules local_dofus_data \
            --add-data "data;data" launch.py
      - name: Compile lightweight standalone launcher
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name DofusAtlas --paths . scripts/windows/atlas_launcher_entry.py
      - name: Compile self-contained desktop shortcut installer
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name DofusAtlasSetup --paths . \
            --icon data/images/misc/dofus_atlas.ico \
            --add-binary "dist/DofusAtlas.exe;." scripts/windows/atlas_setup_entry.py
      - name: Verify installer creates Windows Desktop shortcut
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath "dist/DofusAtlasSetup.exe" -ArgumentList "--no-launch" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Atlas setup failed: $($setup.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs/DofusAtlas/DofusAtlas.exe"
          if (-not (Test-Path -LiteralPath $installed)) { throw "Installed launcher missing" }
          $shortcut = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Dofus Atlas.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Desktop shortcut missing" }
      - name: Smoke check frozen QtWebEngine and assets
        run: dist/AtlasApp/AtlasApp.exe --atlas-package-smoke
      - name: Real Qt window health smoke (no Python user installation)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          $env:DOFUS_ATLAS_HEALTH_FILE = Join-Path $env:RUNNER_TEMP "atlas-window-health.ready"
          $env:DOFUS_ATLAS_USER_ROOT = Join-Path $env:RUNNER_TEMP "atlas-smoke-user"
          Remove-Item -LiteralPath $env:DOFUS_ATLAS_HEALTH_FILE -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "dist/AtlasApp/AtlasApp.exe" -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 450; $i++) {
              if (Test-Path -LiteralPath $env:DOFUS_ATLAS_HEALTH_FILE) {
                $healthy = $true
                break
              }
              $process.Refresh()
              if ($process.HasExited) {
                throw "Frozen Atlas closed before the main window was ready: $($process.ExitCode)"
              }
              Start-Sleep -Milliseconds 200
            }
            if (-not $healthy) {
              throw "Frozen Atlas did not acknowledge its main window after 90 seconds"
            }
            Write-Host "Frozen Atlas real Qt startup confirmed"
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Read previous certified distribution manifest (if available)
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.ATLAS_DISTRIBUTION_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-previous"
          gh release download --repo r9327/Dof-Atlas-App \
            --pattern atlas-manifest.json --dir "$RUNNER_TEMP/atlas-previous" || true
      - name: Package ZIP, manifest and launcher
        if: github.event_name == 'workflow_run'
        run: |
          version="0.1.0-$(echo "$SOURCE_SHA" | cut -c1-12)"
          python -m scripts.windows.package_release \
            --payload dist/AtlasApp --output dist-release \
            --source-sha "$SOURCE_SHA" --app-version "$version" \
            --data-version "$(date -u +%Y.%m.%d)" --schema-version 1 \
            --launcher dist/DofusAtlas.exe \
            --base-manifest "$RUNNER_TEMP/atlas-previous/atlas-manifest.json"
          cp dist/DofusAtlas.exe dist-release/DofusAtlas.exe
          cp dist/DofusAtlasSetup.exe dist-release/DofusAtlasSetup.exe
      - name: Upload certified Windows release files
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-windows-${{ env.SOURCE_SHA }}
          path: dist-release/*
          retention-days: 14
          if-no-files-found: error
      - name: Upload frozen candidate launchers for diagnosis
        if: github.event_name != 'workflow_run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-frozen-launchers-${{ env.SOURCE_SHA }}
          path: |
            dist/DofusAtlas.exe
            dist/DofusAtlasSetup.exe
            dist/AtlasApp/AtlasApp.exe
          retention-days: 7
          if-no-files-found: error
      - name: Checkout isolated application repository
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: r9327/Dof-Atlas-App
          token: ${{ secrets.ATLAS_DISTRIBUTION_TOKEN }}
          path: app-publish
          fetch-depth: 1
          persist-credentials: false
      - name: Synchronize application-only source and data
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.ATLAS_DISTRIBUTION_TOKEN }}
        run: |
          gh auth setup-git
          python -m scripts.windows.export_app_repository \
            --root . --destination app-publish --source-sha "$SOURCE_SHA"
          git -C app-publish config user.name "github-actions[bot]"
          git -C app-publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C app-publish add -A
          if ! git -C app-publish diff --cached --quiet; then
            git -C app-publish commit -m "sync: exact source $SOURCE_SHA"
            git -C app-publish push origin HEAD:main
          fi
      - name: Publish certified stable release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.ATLAS_DISTRIBUTION_TOKEN }}
        run: |
          tag="sha-$(echo "$SOURCE_SHA" | cut -c1-12)"
          assets=(dist-release/atlas-windows.zip dist-release/atlas-manifest.json
                  dist-release/DofusAtlas.exe dist-release/DofusAtlasSetup.exe)
          if test -f dist-release/atlas-delta.zip; then
            assets+=(dist-release/atlas-delta.zip)
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo r9327/Dof-Atlas-App \
            --title "Dofus Atlas $tag" \
            --notes "Certified source r9327/Dof-Atlas@$SOURCE_SHA" \
            --latest
