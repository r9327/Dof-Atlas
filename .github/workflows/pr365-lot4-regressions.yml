name: PR365 Lot 4 comparative regression audit
on:
  push:
    branches: [audit/pr365-lot4-regressions]
permissions:
  contents: read
jobs:
  compare:
    name: Compare historical regression cohort / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: candidate
            sha: 93d44459c4ca4104fc06f8c61b9cb4c51a3fa110
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      PYTHONUTF8: '1'
      EXPECTED_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Verify source and install pinned runtime
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'SHA mismatch' }
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --no-deps "hypothesis==6.170.15" "sortedcontainers==2.4.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize reviewed pinned fixture inputs
        shell: pwsh
        run: |
          git lfs pull --include="tools/doduda/doduda.exe,data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.windows.quest_assets --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.windows.craft_seed --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run historical regression cohort in one process
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit-lot4 | Out-Null
          @'
          import json, os, pathlib, unittest
          root = pathlib.Path("audit-lot4")
          requested = ["tests.test_achievement_provider_lazy_rewards","tests.test_achievements_phase2","tests.test_encyclopedia_corrective","tests.test_encyclopedia_final_mission","tests.test_encyclopedia_phase1","tests.test_encyclopedia_widgets_lazy_exports","tests.test_guide_ganymede_continuous_plan","tests.test_guide_library_home","tests.test_guides_phase3","tests.test_lanyel_shared_manual_ui","tests.test_lazy_encyclopedia_public_view","tests.test_network_catchup_lifecycle","tests.test_normalize_text_canonical_boundary","tests.test_organizer_zaap_popup","tests.test_quest_detail_requirement_cache","tests.test_quest_hierarchy_lazy_render","tests.test_quest_interaction_runtime_patch","tests.test_quest_progress_read_snapshot_tolerance","tests.test_runtime_regression_contracts","tests.test_shared_profile_and_manual_contracts","tests.test_startup_preload_window_visibility","tests.test_ui_async_budget","tests.test_unity_skin"]
          missing = [name for name in requested if not pathlib.Path(*name.split(".")).with_suffix(".py").is_file()]
          present = [name for name in requested if name not in missing]
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromNames(present)
          def flatten(s):
              for item in s:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item.id()
          inventory = list(flatten(suite))
          root.joinpath("inventory.json").write_text(json.dumps({"sha":os.environ["EXPECTED_SHA"],"missing_modules":missing,"test_ids":inventory},indent=2),encoding="utf-8")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          report = {"sha":os.environ["EXPECTED_SHA"],"tests_run":result.testsRun,"missing_modules":missing,"failures":[[test.id(),trace] for test,trace in result.failures],"errors":[[test.id(),trace] for test,trace in result.errors],"skipped":[[test.id(),reason] for test,reason in result.skipped],"successful":result.wasSuccessful()}
          root.joinpath("result.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps({k:v for k,v in report.items() if k not in ("failures","errors","skipped")}))
          if not result.wasSuccessful() or (missing and os.environ["EXPECTED_SHA"] == "93d44459c4ca4104fc06f8c61b9cb4c51a3fa110"):
              raise SystemExit(1)
          '@ | python -X faulthandler -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lot4-${{ matrix.name }}-${{ matrix.sha }}
          path: audit-lot4/
          if-no-files-found: warn
