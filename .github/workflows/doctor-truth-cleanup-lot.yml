name: Doctor Truth Cleanup Diagnose

on:
  push:
    branches:
      - run/doctor-final-20260929

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Doctor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: doctor/zero-actionable-v1
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Capture exact references and patch preconditions
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json, subprocess

          def grep(term: str):
              p = subprocess.run(["git", "grep", "-n", term, "--", "*.py"], text=True, capture_output=True)
              return {"returncode": p.returncode, "stdout": p.stdout.splitlines(), "stderr": p.stderr}

          main = Path("main.py").read_text(encoding="utf-8")
          home = Path("app/pages/home_page.py").read_text(encoding="utf-8")
          services = Path("app/modules/encyclopedia/services/__init__.py").read_text(encoding="utf-8")
          report = {
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "LinkService": grep("LinkService"),
              "local_dofus_data.models": grep("local_dofus_data.models"),
              "from local_dofus_data import models": grep("from local_dofus_data import models"),
              "preconditions": {
                  "home_status_import": home.count("from app.network.application_coordinator import NetworkApplicationStatus\n"),
                  "main_runtime_state_import": main.count("from app.network.character_runtime_state import character_runtime_state\n"),
                  "main_schedule_capture": main.count('if os.environ.get("QT_QPA_PLATFORM", "").strip().casefold() != "offscreen":\n            self._schedule_owned_callback(0, self.prepare_network_capture)\n'),
                  "main_prepare_doc": main.count('''    def prepare_network_capture(self) -> None:\n        """Request UAC as soon as the visible shell enters its event loop."""\n\n        bridge = getattr(self.home_page, "network_bridge", None)\n'''),
                  "main_connected_store": main.count('''    def _connected_characters(self, known_characters: list[Any]) -> list[Any]:\n        runtime_store = character_runtime_state()\n'''),
                  "service_link_block": services.count('''    "LinkService": (\n        "app.modules.encyclopedia.services.link_service",\n        "LinkService",\n    ),\n'''),
                  "service_link_all": services.count('    "LinkService",\n'),
              },
          }
          out = Path("$env:RUNNER_TEMP") / "cleanup-diagnose.json"
          # PowerShell does not expand env vars inside Python strings.
          import os
          out = Path(os.environ["RUNNER_TEMP"]) / "cleanup-diagnose.json"
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          '@ | python -

      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-cleanup-diagnose
          path: ${{ runner.temp }}/cleanup-diagnose.json
          if-no-files-found: error
          retention-days: 7
