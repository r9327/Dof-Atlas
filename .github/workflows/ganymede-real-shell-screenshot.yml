name: Ganymede / real Qt shell screenshot

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/ganymede-real-shell-screenshot.yml
      - app/modules/encyclopedia/views/ganymede_guide_shell.py
      - tests/test_ganymede_guide_shell.py
  push:
    branches:
      - feat/atlas-guide-importer-pr337-20261102
    paths:
      - .github/workflows/ganymede-real-shell-screenshot.yml
      - app/modules/encyclopedia/views/ganymede_guide_shell.py
      - app/modules/encyclopedia/services/guide_cawotte_pilot_preview.py
      - app/modules/encyclopedia/views/guide_catalog_view.py
      - app/ui/components.py
      - app/ui/theme.py
      - app/ui/unity_skin.py
      - tests/test_ganymede_guide_shell.py
      - tests/test_atlas_guide_cawotte_pilot_preview.py

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: "1"
    steps:
      - name: Checkout actual PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Qt runtime
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
      - name: Verify 95 metadata containers and Cawotte candidate route
        run: python -X faulthandler -m unittest -v tests.test_atlas_guide_cawotte_pilot_preview tests.test_ganymede_guide_shell
      - name: Capture real indexed container at 1280 x 720
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication, QVBoxLayout, QProgressBar, QLabel, QToolButton, QFrame
          from PySide6.QtCore import Qt
          from PySide6.QtTest import QTest
          from PySide6.QtGui import QFontDatabase
          from app.ui.theme import atlas_stylesheet
          from app.ui.unity_skin import UnityBackdrop
          from app.modules.encyclopedia.views.ganymede_guide_shell import GanymedeGuideShell
          from app.modules.encyclopedia.views.guide_catalog_view import GuideCatalogView
          from app.modules.encyclopedia.views.guide_library_sources import load_ganymede_listings
          from app.modules.encyclopedia.models.guide import Guide

          entries = load_ganymede_listings()
          assert len(entries) == 95
          cawotte = next(entry for entry in entries if entry.source_id == 2205)
          app = QApplication([])
          print("Windows Qt available fonts:", QFontDatabase.families()[:30])
          app.setStyleSheet(atlas_stylesheet())
          backdrop = UnityBackdrop()
          backdrop.setWindowTitle("Atlas - Guide Ganymede - vrai conteneur Qt")
          backdrop.resize(1280, 720)
          layout = QVBoxLayout(backdrop)
          # Go through the user's actual Guide catalogue, not an isolated
          # synthetic screenshot of a widget that cannot be opened in-app.
          catalog = GuideCatalogView(
              lambda _message: None, provider=object(),
              quest_progress_path=Path("unused_cawotte_screenshot.json"),
              defer_runtime=True,
          )
          catalog.guides = [Guide(id="dofus_cawotte", title="Dofus Cawotte", category="dofus")]
          catalog.ganymede_listings = entries
          catalog._ganymede_by_id = {entry.source_id: entry for entry in entries}
          catalog._populate_library_tree()
          pilot = catalog._cawotte_pilot_item
          assert pilot is not None and pilot.data(0, Qt.UserRole + 2) == 2205
          layout.addWidget(catalog)
          backdrop.show()
          app.processEvents()
          tree = catalog.library_categories
          tree.scrollToItem(pilot)
          app.processEvents()
          rect = tree.visualItemRect(pilot)
          assert rect.isValid()
          before = Path("artifacts/screenshots/ganymede-cawotte-pilot-catalog-qt.png")
          before.parent.mkdir(parents=True, exist_ok=True)
          assert backdrop.grab().save(str(before), "PNG")
          QTest.mouseClick(tree.viewport(), Qt.LeftButton, pos=rect.center())
          app.processEvents()
          shell = catalog._ganymede_shell
          assert isinstance(shell, GanymedeGuideShell)
          assert catalog.pages.currentWidget() is shell
          assert shell._listing.source_id == 2205
          assert shell.guide_title_label.text() == "Dofus Cawotte"
          assert len(shell.findChildren(QProgressBar)) == 3
          assert all(not bar.isEnabled() for bar in shell.findChildren(QProgressBar))
          assert shell.sheet_title_label.text() == "Étape 1"
          assert len(shell.service.cards) == 64
          assert shell.rendered_card_count == 3
          assert shell._review_end_index == 3
          first_card = shell.cards_layout.itemAt(0).widget()
          assert first_card.isVisible() and first_card.height() > 0
          assert shell.page_jump.maximum() == 64
          assert shell.page_jump.text() == "1 / 64"
          assert shell.summary_button.isEnabled()
          assert shell.summary_list.count() == 64
          assert shell.summary_list.item(0).text().startswith("1. Contrôler le parcours")
          assert "Étape 1" not in shell.summary_list.item(0).text()
          pos = shell.findChildren(QLabel, "GuideManualPositionCopy")
          assert len(pos) == 3
          assert "travel-copy:25,-4" in pos[0].text()
          assert not shell.findChildren(QToolButton, "GuideManualZaapShortcut")
          assert not shell.findChildren(QFrame, "GuideManualActionGroup")
          assert len(shell.findChildren(QLabel, "GuideManualLine")) >= 3
          assert all(not row.text().lstrip().startswith(("•", "—"))
                     for row in shell.findChildren(QLabel, "GuideManualLine"))
          assert shell.validation_host.isHidden()
          assert shell.validation_layout.count() == 0
          target = Path("artifacts/screenshots/ganymede-cawotte-shell-qt.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          shot = backdrop.grab()
          assert not shot.isNull() and shot.width() >= 1000 and shot.height() >= 600
          print(f"Native DPI screenshot: {shot.width()} x {shot.height()}, DPR={shot.devicePixelRatio()}")
          assert shot.save(str(target), "PNG")
          print(f"Real Qt screenshot written: {target} ({target.stat().st_size} bytes)")
          # Capture both genuine Unity tabs on the same real catalogue path.
          # The pilot is deliberately read-only: the tabs cannot save progress.
          assert shell.preparation_button.isEnabled()
          shell.preparation_button.click()
          app.processEvents()
          assert shell._preparation_tab == "Prérequis"
          assert len(shell._preparation_preview) == 10
          assert shell.preparation_panel.isVisibleTo(shell)
          prereqs = Path("artifacts/screenshots/ganymede-cawotte-prerequisites-qt.png")
          assert backdrop.grab().save(str(prereqs), "PNG")
          material_tab = next(
              button for button in shell.preparation_tab_group.buttons()
              if button.text() == "À préparer"
          )
          material_tab.click()
          app.processEvents()
          assert shell._preparation_tab == "À préparer"
          materials = Path("artifacts/screenshots/ganymede-cawotte-materials-qt.png")
          assert backdrop.grab().save(str(materials), "PNG")
          shell.preparation_button.click()
          app.processEvents()
          assert shell.preparation_panel.isHidden()
          # A taller viewport keeps the same three-step reading window.
          backdrop.resize(1280, 1050)
          app.processEvents()
          shell._refit_review_cards()
          app.processEvents()
          assert shell.rendered_card_count == 3
          tall = Path("artifacts/screenshots/ganymede-cawotte-three-steps-large-qt.png")
          assert backdrop.grab().save(str(tall), "PNG")
          backdrop.resize(1280, 720)
          app.processEvents()
          shell._refit_review_cards()
          app.processEvents()
          first_end = shell._review_end_index
          shell.next_button.click()
          app.processEvents()
          assert first_end == 3
          assert shell.view_index == 1
          shell.summary_button.click()
          app.processEvents()
          assert shell.summary_panel.isVisibleTo(shell)
          shell._summary_item_clicked(shell.summary_list.item(39))
          app.processEvents()
          assert shell.view_index == 39 and shell.rendered_card_count == 3
          assert shell.summary_panel.isVisibleTo(shell)
          summary = Path("artifacts/screenshots/ganymede-cawotte-summary-step-40-qt.png")
          assert backdrop.grab().save(str(summary), "PNG")
          shell.page_jump.setValue(64)
          app.processEvents()
          assert shell.sheet_title_label.text() == "Étape 64"
          assert shell.validation_layout.count() == 0
          final = Path("artifacts/screenshots/ganymede-cawotte-step-64-qt.png")
          assert backdrop.grab().save(str(final), "PNG")
          shell.guide_button.click()
          assert catalog.pages.currentWidget() is catalog.home_scroll
          backdrop.close()
          PY
      - name: Upload screenshot, including failed test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ganymede-real-qt-shell-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/screenshots/*.png
          if-no-files-found: warn
