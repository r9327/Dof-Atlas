name: TEMP Final cleanup certification

on:
  push:
    branches:
      - validation/final-foundation-benchmark

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  CANDIDATE_SHA: 4f60e2f9a802f0845f23d300214e81e50e6b51ea
  VALIDATION_BASE_SHA: f06ec71eb77c749fecca533bc15b516a526aa183

jobs:
  certify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact cleanup candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false

      - name: Verify exact candidate
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Final validation checkout mismatch: expected $env:CANDIDATE_SHA, got $actual"
          }
          Write-Host "Validation candidate SHA: $actual"
          Write-Host "Validation base SHA: $env:VALIDATION_BASE_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize validation fixtures and Dofus catalog
        shell: pwsh
        run: |
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**,tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) {
            Remove-Item -LiteralPath $catalog -Recurse -Force
          }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          from app.quest_catalog import QuestCatalog
          count = len(QuestCatalog.load().quests)
          print(f"Materialized QuestCatalog: {count} quests")
          if count < 1900:
              raise SystemExit(f"Quest catalog incomplete after Doduda materialization: {count}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify ROAD IA context
        shell: pwsh
        run: |
          python -m tools.ai_context check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.ai_context drift
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Integrity FAST
        shell: pwsh
        run: |
          python -X faulthandler -m tools.atlas_integrity fast --base-ref "$env:VALIDATION_BASE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full application suite
        shell: pwsh
        run: |
          python -X faulthandler -m unittest discover -v -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
