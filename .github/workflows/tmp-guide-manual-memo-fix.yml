name: TEMP Sync cleanup ROAD IA

on:
  push:
    branches:
      - validation/final-foundation-benchmark

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cleanup/final-foundation
          fetch-depth: 1

      - name: Sync and verify ROAD IA
        shell: bash
        run: |
          python -m tools.ai_context sync --stage
          python -m tools.ai_context check
          python -m tools.ai_context drift
          git diff --cached --check
          test "$(git diff --cached --name-only)" = ".ai/context_index.json"

      - name: Commit canonical index
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "ROAD IA already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ai): sync cleanup Guide memo fingerprint"
          git push origin HEAD:cleanup/final-foundation
