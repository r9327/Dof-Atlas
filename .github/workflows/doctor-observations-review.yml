name: Temporary final main Doctor observation validation
on:
  push:
    branches: [diagnostic/doctor-observations-review]
permissions:
  contents: read
jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --disable-software-rasterizer"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 82c3ca694bddf399dc6e394f391477813fc7b05f
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt
      - name: Confirm exact certified candidate and clean canonical index
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "82c3ca694bddf399dc6e394f391477813fc7b05f") { throw "Wrong source SHA" }
          git rev-parse HEAD
          git status --short
          git branch --show-current
          git fetch origin
          python -m tools.ai_context check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked application dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize canonical validation fixtures
        shell: pwsh
        run: |
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**,tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\tools\doduda\doduda.exe" --headless --output "data/cache/dofus_maps/raw/doduda_cli" -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from app.quest_catalog import QuestCatalog; count=len(QuestCatalog.load().quests); print('Materialized quests:',count); assert count>=1900"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Final Doctor Graph Integrity and tool audit
        shell: pwsh
        run: |
          python -m tools.agent doctor --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.guide_tools_cli doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.atlas_doctor quick --json > "$env:RUNNER_TEMP/quick-main.json"
          $env:DOCTOR_QUICK_EXIT = "$LASTEXITCODE"
          python -c "import json,os,pathlib; p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'quick-main.json').read_text(encoding='utf-8-sig')); assert (int(os.environ['DOCTOR_QUICK_EXIT']),p['summary']['verdict']) in ((0,'PASS'),(1,'WARN')),p; print('MAIN_DOCTOR_QUICK='+json.dumps({'summary':p['summary'],'issues':p.get('issues',[])}))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install graphifyy==0.9.72
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.atlas_doctor graph --rebuild --json > "$env:RUNNER_TEMP/graph-main.json"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/graph-main.json"; exit $LASTEXITCODE }
          python -c "import json,os,pathlib; p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'graph-main.json').read_text(encoding='utf-8-sig')); assert p['status']=='PASS' and p['git']['head']=='82c3ca694bddf399dc6e394f391477813fc7b05f'; assert pathlib.Path(p['html']).is_file(); print('MAIN_GRAPH='+json.dumps({'status':p['status'],'git':p['git'],'summary':p['summary'],'html':p['html']}))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.atlas_integrity fast --base-ref HEAD --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.tool_audit --json > "$env:RUNNER_TEMP/audit-main.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,os,pathlib,subprocess; p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-main.json').read_text(encoding='utf-8-sig')); print('MAIN_AUDIT_COUNTS='+json.dumps({k:v for k,v in p.items() if k.endswith('_count')})); tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines(); assert not any(x.startswith(('graphify-out/','.ai/runtime/')) or x.endswith('.json.lock') or x=='manifest.json' for x in tracked); assert not subprocess.check_output(['git','status','--short'],text=True).strip(); assert 'tools.atlas_doctor' in pathlib.Path('Atlas_Doctor.bat').read_text(); assert pathlib.Path('tools/graphify.py').is_file(); hooks=pathlib.Path('.git/hooks'); assert not any('graphify' in f.read_text(encoding='utf-8',errors='ignore').lower() for f in hooks.glob('*') if f.is_file())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.ai_context check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-main-doctor-graph-82c3ca694bddf399dc6e394f391477813fc7b05f
          path: |
            graphify-out/
            ${{ runner.temp }}/quick-main.json
            ${{ runner.temp }}/graph-main.json
            ${{ runner.temp }}/audit-main.json
