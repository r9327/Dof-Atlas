name: Temporary canonical context for Doctor consolidation
on:
  push:
    branches: [diagnostic/doctor-observations-review]
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f82854756ba73eb33e4fbafcfbab1fc575e177b9
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Canonical reproducible context index
        run: |
          test "$(git rev-parse HEAD)" = "f82854756ba73eb33e4fbafcfbab1fc575e177b9"
          python -m tools.ai_context sync --stage
          git diff --cached --check
          python -m tools.ai_context check
          python - <<'PY'
          import base64,pathlib,subprocess
          assert subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()==[".ai/context_index.json"]
          print("CANONICAL_INDEX_BASE64="+base64.b64encode(pathlib.Path(".ai/context_index.json").read_bytes()).decode())
          PY
