name: Temporary exact Doctor Agent impact review proof
on:
  push:
    branches: [diagnostic/doctor-observations-review]
permissions:
  contents: read
jobs:
  impact:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd5b2cbe28e77cfff73754eafdc427d60f091e8e
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Current graph and explicit bounded impact
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "cd5b2cbe28e77cfff73754eafdc427d60f091e8e") { throw "Wrong source" }
          python -m tools.ai_context check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install graphifyy==0.9.72
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.atlas_doctor graph --rebuild --json > "$env:RUNNER_TEMP/graph-final.json"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/graph-final.json"; exit $LASTEXITCODE }
          python -m tools.agent plan tools/validate_guide_ultime_manual_bundle.py --structural --json > "$env:RUNNER_TEMP/structural-plan.json"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/structural-plan.json"; exit $LASTEXITCODE }
          python -m tools.agent reverse-impact tools/atlas_doctor_lib/core.py --json > "$env:RUNNER_TEMP/reverse-impact.json"
          $env:IMPACT_EXIT = "$LASTEXITCODE"
          @'
          import json,os,pathlib,subprocess
          tmp=pathlib.Path(os.environ["RUNNER_TEMP"])
          graph=json.loads((tmp/"graph-final.json").read_text(encoding="utf-8-sig"))
          assert graph["status"]=="PASS" and graph["git"]["head"]=="cd5b2cbe28e77cfff73754eafdc427d60f091e8e"
          plan=json.loads((tmp/"structural-plan.json").read_text(encoding="utf-8-sig"))
          impact=json.loads((tmp/"reverse-impact.json").read_text(encoding="utf-8-sig"))
          assert (int(os.environ["IMPACT_EXIT"]),impact["status"]) in ((0,"PASS"),(1,"REVIEW")),impact
          assert not impact["source_errors"] and not impact["truncated"],impact
          assert 0<impact["source_files_parsed"]<=100,impact
          if impact["status"]=="REVIEW": assert impact["unconfirmed_relationships"],impact
          print("ACTUAL_STRUCTURAL_PLAN="+json.dumps({"level":plan.get("level"),"risk":plan.get("risk"),"scope":plan.get("scopes"),"architecture":plan.get("architecture"),"tests":plan.get("execution_tests")}))
          print("ACTUAL_IMPACT_REVIEW="+json.dumps({"status":impact["status"],"source_files_parsed":impact["source_files_parsed"],"unconfirmed_relationships":impact["unconfirmed_relationships"],"consumers":impact.get("consumers"),"source_errors":impact["source_errors"],"truncated":impact["truncated"]}))
          assert not subprocess.check_output(["git","status","--short"],text=True).strip()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-agent-impact-cd5b2cbe28e77cfff73754eafdc427d60f091e8e
          path: |
            graphify-out/
            ${{ runner.temp }}/graph-final.json
            ${{ runner.temp }}/structural-plan.json
            ${{ runner.temp }}/reverse-impact.json
