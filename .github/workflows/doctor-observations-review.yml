name: Temporary exact candidate graph before consolidation
on:
  push:
    branches: [diagnostic/doctor-observations-review]
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c3ab1b85bbcf071cfb6423cd1a842e97e2d80df5
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: |
          test "$(git rev-parse HEAD)" = "c3ab1b85bbcf071cfb6423cd1a842e97e2d80df5"
          python -m pip install graphifyy==0.9.72
          python -m tools.atlas_doctor graph --rebuild --json > "$RUNNER_TEMP/graph-summary.json"
          python - <<'PY'
          import json,os,pathlib
          p=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"graph-summary.json").read_text())
          assert p["status"]=="PASS" and p["git"]["head"]=="c3ab1b85bbcf071cfb6423cd1a842e97e2d80df5"
          print("CURRENT_GRAPH_SUMMARY="+json.dumps(p["summary"]))
          print(pathlib.Path("graphify-out/GRAPH_REPORT.md").read_text()[:16000])
          graph=json.loads(pathlib.Path("graphify-out/graph.json").read_text());nodes={str(n["id"]):n for n in graph["nodes"]}
          for target in ["tools/validate_guide_ultime_manual_route.py","tools/validate_guide_ultime_manual_bundle.py","tools/atlas_doctor_lib/core.py","tools/atlas_doctor_lib/live.py"]:
              keys={k for k,n in nodes.items() if n.get("source_file")==target};adjacent=set()
              for link in graph["links"]:
                  a,b=str(link["source"]),str(link["target"])
                  if a in keys or b in keys:
                      path=nodes.get(b if a in keys else a,{}).get("source_file")
                      if path and path!=target: adjacent.add(path)
              print("CURRENT_GRAPH_TARGET="+json.dumps({"path":target,"nodes":len(keys),"adjacent_files":sorted(adjacent)}))
          PY
          git diff --check
          test -z "$(git status --short)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graphify-pre-consolidation-c3ab1b85bbcf071cfb6423cd1a842e97e2d80df5
          path: graphify-out/
