name: Temporary canonical context for Doctor consolidation
on:
  push:
    branches: [diagnostic/doctor-observations-review]
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c0a71d56e9a418237b538f4065c57e7a967e7d66
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Canonical reproducible context index
        run: |
          test "$(git rev-parse HEAD)" = "c0a71d56e9a418237b538f4065c57e7a967e7d66"
          python -m tools.ai_context sync --stage
          git diff --cached --check
          python -m tools.ai_context check
          python - <<'PY'
          import base64,pathlib,subprocess
          assert subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()==[".ai/context_index.json"]
          print("CANONICAL_INDEX_BASE64="+base64.b64encode(pathlib.Path(".ai/context_index.json").read_bytes()).decode())
          PY
      - name: Existing canonical pause checkpoint contract evidence
        run: |
          python - <<'PY'
          import collections,json,pathlib
          from app.modules.encyclopedia.services.guide_ultime_manual_route import load_manual_chapter
          base=pathlib.Path("data/routes/guide_ultime_manual")
          manifest=json.loads((base/"manifest_v1.json").read_text())
          counts=collections.Counter();unsafe=[]
          for row in manifest["canonical"]["chapters"]:
              for stage in load_manual_chapter(base/row["file"]).get("stages",[]):
                  checkpoint=stage.get("pause_checkpoint")
                  if isinstance(checkpoint,dict):
                      counts["checkpoint_dict"]+=1
                      counts["safe_"+repr(checkpoint.get("safe"))]+=1
                      if checkpoint.get("safe",True) is not True:
                          unsafe.append({"file":row["file"],"stage":stage.get("id"),"checkpoint":checkpoint})
                  elif stage.get("pause"):
                      counts["compact_pause"]+=1
                  else: counts["no_pause"]+=1
          print("PAUSE_CONTRACT_EVIDENCE="+json.dumps({"counts":counts,"unsafe":unsafe}))
          PY
