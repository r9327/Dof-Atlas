name: UI Lab Capture

on:
  workflow_dispatch:
  push:
    branches:
      - tool/ui-lab-skeleton
    paths:
      - ".github/workflows/ui-lab-capture.yml"
      - "tools/ui_lab/**"
      - "tests/test_ui_lab_registry.py"
      - "tests/test_ui_lab_capture.py"

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: windows
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: 1
  PYTHONUTF8: 1

defaults:
  run:
    shell: pwsh

jobs:
  capture:
    name: Windows / UI Lab Capture
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Compile UI Lab
        run: python -m compileall -q tools/ui_lab tests/test_ui_lab_registry.py tests/test_ui_lab_capture.py

      - name: Run UI Lab tests
        run: python -m unittest -v tests.test_ui_lab_registry tests.test_ui_lab_capture

      - name: Materialize local quest catalog
        run: |
          git lfs pull --include="tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) { Remove-Item -LiteralPath $catalog -Recurse -Force }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate requested UI captures
        run: |
          python -m tools.ui_lab.capture --request tools/ui_lab/capture_request.json --output-dir artifacts/ui_lab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content artifacts/ui_lab/manifest.json
          $pngs = @(Get-ChildItem artifacts/ui_lab -Filter *.png)
          if ($pngs.Count -lt 1) { throw "UI Lab capture produced no PNG" }

      - name: Upload UI captures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-lab-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ui_lab/**
          if-no-files-found: error
          retention-days: 30
