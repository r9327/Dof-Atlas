name: Encyclopedia Widget Lazy Exports

on:
  push:
    branches:
      - perf/encyclopedia-widgets-lazy-exports-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-widget-exports-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"

jobs:
  widget-exports:
    name: Widgets / Lazy API and deferred UI smoke
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false

      - name: Verify SHA
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "${{ github.sha }}") { throw "Unexpected SHA: $actual" }

      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install exact Qt runtime
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run actual import contracts and deferred Guide smoke
        run: |
          python -X faulthandler -m unittest -v tests.test_encyclopedia_widgets_lazy_exports tests.test_atlas_doctor_encyclopedia_smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Certification scope
        if: always()
        run: |
          Write-Host "These are targeted import and deferred-UI tests only."
          Write-Host "A before/after Phase 8 RAM/preload benchmark is required before any performance claim."
