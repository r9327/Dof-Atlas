name: Organizer / Focused Windows Qt

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/organizer-focused-qt.yml'
      - 'app/core/runtime_state.py'
      - 'app/core/macro_lock.py'
      - 'app/input/hotkeys.py'
      - 'app/pages/organizer/**'
      - 'app/pages/organizer_page.py'
      - 'app/macros/**'
      - 'tests/test_organizer*.py'
      - 'tests/test_hotkeys.py'
      - 'tests/test_runtime_state.py'
      - 'tests/_pyside_shell_base.py'
      - 'tests/test_pyside_shell.py'
      - 'tests/test_character_pyside_diagnostics.py'

permissions:
  contents: read

concurrency:
  group: atlas-organizer-qt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Permanent Capture UI PR: isolated, exact-SHA preview of the developer catalog.
  # Keep this as a visual checkpoint, not as a release certification.
  dev-ui-library:
    name: Dev UI / exact-SHA Qt screenshots (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UI_SHA: 10e5b80e72fdd1769eadf32243c57930c4171bdf
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact Dev UI PR #365 HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.UI_SHA }}
          persist-credentials: false
          lfs: false
      - name: Verify candidate SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:UI_SHA) {
            throw "Dev UI candidate checkout differs from pinned PR #365 HEAD"
          }
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Windows Qt runtime
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test shared Dev UI components
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_dev_ui_page
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture real Dev UI full gallery, viewport and dialog
        shell: pwsh
        run: |
          python -X faulthandler -m tools.dev_ui_snapshot --output artifacts/dev-ui --width 1440 --height 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload actual Qt screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-ui-365-${{ env.UI_SHA }}
          path: artifacts/dev-ui/*
          if-no-files-found: warn

  organizer-qt:
    name: Organizer / Exact-SHA Qt and runtime regressions (Windows, synthetic)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          lfs: false
      - name: Validate exact HEAD before native setup
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) {
            throw "Organizer checkout differs from PR HEAD"
          }
          Write-Host 'ATLAS_ROOT_TREE_BEGIN'
          git ls-tree HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'ATLAS_ROOT_TREE_END'
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Windows runtime
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Organizer macro controls, radial and mirror safety
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_organizer_layout tests.test_organizer_next_character tests.test_organizer_speed_presets tests.test_organizer_radial_overlay tests.test_organizer_macro_generation tests.test_runtime_state tests.test_hotkeys
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test input and clipboard regression contracts
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_organizer_sendinput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Recheck legacy active-Mirror and Stop contracts after explicit opt-in
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_organizer_mirror_ui tests.test_organizer_mirror_focus_admission tests.test_organizer_macro_reliability tests.test_organizer_speed_lease tests.test_organizer_stop_hotkey_priority tests.test_organizer_hook_stop_race
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Recheck inherited PySide shell and subprocess Organizer compatibility
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_pyside_shell.PySideShellTests.test_organizer_exports_switch_double_click_hotkey tests.test_pyside_shell.PySideShellTests.test_organizer_quick_actions_reload_and_debug tests.test_character_pyside_diagnostics.CharacterPySideDiagnosticsTests.test_legacy_character_pyside_contracts_emit_full_tracebacks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture actual Organizer Qt UI on Windows
        shell: pwsh
        env:
          ATLAS_ORGANIZER_SCREENSHOT_DIR: artifacts/organizer-ui
        run: |
          python -X faulthandler -m tests.capture_organizer_ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Organizer screenshot (real Qt widget; no DOFUS session)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organizer-qt-screenshot-${{ env.CANDIDATE_SHA }}
          path: artifacts/organizer-ui/*.png
          if-no-files-found: warn
      - name: Capture Atlas UI modules for #365 comparison
        if: always()
        shell: pwsh
        env:
          ATLAS_UI_CAPTURE_DIR: artifacts/atlas-ui-screens
        run: |
          python -X faulthandler -m tests.capture_atlas_ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload actual Atlas UI screenshots and manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-ui-screens-${{ env.CANDIDATE_SHA }}
          path: artifacts/atlas-ui-screens/*
          if-no-files-found: warn
      # Capture the *unmodified* exact UI PR #365 candidate in a separate checkout.
      # This is an independent visual reference; do not confuse it with main.
      - name: Checkout exact UI PR 365 HEAD
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9c877faec0a7466240f0cea5cbaee841fbf6214b
          path: pr365-src
          persist-credentials: false
          lfs: false
      - name: Capture unmodified UI PR 365 Qt screens
        if: always()
        shell: pwsh
        working-directory: pr365-src
        env:
          CANDIDATE_SHA: 9c877faec0a7466240f0cea5cbaee841fbf6214b
          ATLAS_UI_CAPTURE_DIR: artifacts/atlas-ui-pr365-screens
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) {
            throw "UI PR 365 exact candidate mismatch"
          }
          Copy-Item ..\\tests\\capture_organizer_ui.py tests\\capture_organizer_ui.py
          Copy-Item ..\\tests\\capture_atlas_ui.py tests\\capture_atlas_ui.py
          python -X faulthandler -m tests.capture_atlas_ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload exact PR 365 reference screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-ui-pr365-9c877faec0a7466240f0cea5cbaee841fbf6214b
          path: pr365-src/artifacts/atlas-ui-pr365-screens/*
          if-no-files-found: warn
      # Native Windows offscreen fixtures do not prove delivery in DOFUS Unity,
      # focus race outcomes on real machines, or 1/2/4/6/8-account latency.
