name: Phase Certification

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref used to classify and validate the candidate diff
        required: true
        default: origin/main
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: dof-atlas-phase-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  CERT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_ref }}

defaults:
  run:
    shell: pwsh

jobs:
  certify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       startsWith(github.event.pull_request.title, 'Phase ') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Phase Certification / Full Validation
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact certification candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact certification checkout
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Expected candidate SHA: $env:CANDIDATE_SHA"
          Write-Host "Checked out SHA: $actual"
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Certification checkout mismatch: expected $env:CANDIDATE_SHA, got $actual"
          }

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Resolve adaptive Doctor route on exact SHA
        id: route
        run: |
          $forced = @()
          if ("${{ github.event_name }}" -ne "pull_request") {
            # Main pushes and explicit manual phase certification stay FULL.
            $forced += "--force-full"
          }
          & python -X faulthandler -m tools.phase_adaptive_gate decide `
            --base-ref "$env:CERT_BASE_REF" `
            --expected-sha "$env:CANDIDATE_SHA" `
            --output "artifacts/phase_certification/adaptive_route.json" `
            --github-output "$env:GITHUB_OUTPUT" @forced
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install application dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare certification logs
        run: New-Item -ItemType Directory -Force -Path "artifacts/phase_certification" | Out-Null

      - name: Materialize certification LFS fixtures
        id: lfs
        if: steps.route.outputs.run_full == 'true'
        continue-on-error: true
        run: |
          $log = "artifacts/phase_certification/01_lfs.log"
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**,tools/doduda/doduda.exe" --exclude="" 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          from pathlib import Path

          required = [
              Path("data/images/misc/dofus_atlas_logo.png"),
              Path("tools/doduda/doduda.exe"),
          ]
          pointer = b"version https://git-lfs.github.com/spec/v1"
          errors = []
          for path in required:
              if not path.is_file():
                  errors.append(f"missing certification fixture: {path}")
              elif path.read_bytes()[: len(pointer)] == pointer:
                  errors.append(f"unmaterialized LFS pointer: {path}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("Certification LFS fixtures materialized")
          '@ | python - 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize local Dofus catalog
        id: catalog
        if: steps.route.outputs.run_full == 'true'
        continue-on-error: true
        run: |
          $log = "artifacts/phase_certification/02_catalog.log"
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) {
            Remove-Item -LiteralPath $catalog -Recurse -Force
          }
          & ".\tools\doduda\doduda.exe" --headless --output $catalog -i "images-.*" 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

          @'
          from app.quest_catalog import QuestCatalog
          count = len(QuestCatalog.load().quests)
          print(f"Materialized QuestCatalog: {count} quests")
          if count < 1900:
              raise SystemExit(f"Quest catalog incomplete after Doduda materialization: {count}")
          '@ | python - 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure canonical Encyclopedia user paths
        id: timing
        if: >-
          steps.route.outputs.run_full == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Phase 7B')))
        continue-on-error: true
        run: |
          $log = "artifacts/phase_certification/06_timing_performance.log"
          $report = "artifacts/phase_certification/06_timing_performance.json"
          & python -X faulthandler -m app.modules.encyclopedia.tools.benchmark_guides_performance 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($null -eq $code) { $code = 0 }
          if ($code -ne 0) { exit $code }
          Copy-Item -LiteralPath "artifacts/quests_guides_performance.json" -Destination $report -Force

          @'
          import json
          import os
          from pathlib import Path

          report = Path("artifacts/phase_certification/06_timing_performance.json")
          payload = json.loads(report.read_text(encoding="utf-8"))
          expected_head = os.environ.get("CANDIDATE_SHA", "")
          actual_head = str(payload.get("environment", {}).get("git_head") or "")
          if actual_head != expected_head:
              raise SystemExit(f"timing benchmark SHA mismatch: expected {expected_head}, got {actual_head}")
          if payload.get("schema_version") != 4:
              raise SystemExit(f"unexpected performance schema: {payload.get('schema_version')!r}")

          after = payload.get("after") or {}
          required = (
              "startup_stabilized_ms",
              "startup_stabilized_rss_mb",
              "quests_open_ms",
              "quests_open_max_ui_block_ms",
              "achievements_open_ms",
              "achievements_open_max_ui_block_ms",
              "guide_open_ms",
              "guide_open_max_ui_block_ms",
              "first_achievement_detail_ms",
              "first_achievement_detail_max_ui_block_ms",
              "first_guide_detail_ms",
              "first_guide_detail_max_ui_block_ms",
              "quests_hot_return_ms",
              "achievements_hot_return_ms",
              "guide_hot_return_ms",
              "rss_after_all_views_mb",
              "rss_after_round_trips_mb",
              "idle_cpu_percent_one_core",
          )
          missing = [name for name in required if after.get(name) is None]
          if missing:
              raise SystemExit("missing canonical Encyclopedia timing metrics: " + ", ".join(missing))
          print("Canonical Encyclopedia timing evidence captured for exact candidate SHA")
          '@ | python - 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full Atlas phase certification gate
        id: certification
        if: steps.route.outputs.run_full == 'true'
        continue-on-error: true
        run: |
          $report = "artifacts/phase_certification/03_atlas_integrity_full.json"
          Write-Host "Certification candidate SHA: $env:CANDIDATE_SHA"
          Write-Host "Certification base ref: $env:CERT_BASE_REF"
          & python -X faulthandler -m tools.atlas_integrity full --base-ref "$env:CERT_BASE_REF" --json 1> $report
          $code = $LASTEXITCODE
          if ($null -eq $code) { $code = 0 }
          if (-not (Test-Path -LiteralPath $report)) {
            throw "Atlas integrity report was not created."
          }
          Get-Content -LiteralPath $report | Write-Host
          if ($code -ne 0) { exit $code }

      - name: Execute and verify exact-SHA targeted modules
        id: scoped
        if: steps.route.outputs.run_scoped == 'true'
        run: |
          & python -X faulthandler -m tools.doctor_certification `
            --base-ref "$env:CERT_BASE_REF" `
            --expected-sha "$env:CANDIDATE_SHA" --run `
            --output "artifacts/phase_certification/doctor_scoped_report.json" `
            --passport-output "artifacts/phase_certification/doctor_scoped_passport.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -X faulthandler -m tools.phase_adaptive_gate verify-scoped `
            --route "artifacts/phase_certification/adaptive_route.json" `
            --report "artifacts/phase_certification/doctor_scoped_report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare Doctor plan with actual exact-SHA FULL evidence
        id: doctor_shadow
        if: steps.route.outputs.run_full == 'true' && always()
        continue-on-error: true
        run: |
          $full = "artifacts/phase_certification/03_atlas_integrity_full.json"
          if (-not (Test-Path -LiteralPath $full)) {
            Write-Host "Doctor shadow: FULL JSON unavailable, no comparison possible"
            exit 0
          }
          $plan = "artifacts/phase_certification/doctor_same_sha_plan.json"
          $campaign = "artifacts/phase_certification/doctor_same_sha_shadow.json"
          python -X faulthandler -m tools.doctor_certification --base-ref "$env:CERT_BASE_REF" --expected-sha "$env:CANDIDATE_SHA" --output $plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X faulthandler -m tools.doctor_shadow_campaign --pair $plan $full --output $campaign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Doctor exact-SHA shadow pair recorded; no FULL waiver granted"

      - name: Upload certification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/phase_certification/**
            artifacts/ci_guide_ultime_logs/**
            artifacts/ci_app_logs/05_full_unittest_timings.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce phase certification verdict
        if: always()
        run: |
          if ("${{ steps.route.outcome }}" -ne "success") {
            throw "PHASE CERTIFICATION: BLOCKED - adaptive routing failed"
          }
          if ("${{ steps.route.outputs.run_scoped }}" -eq "true") {
            if ("${{ steps.scoped.outcome }}" -ne "success") {
              throw "ADAPTIVE CERTIFICATION: BLOCKED - canonical scoped tests failed"
            }
            Write-Host "ADAPTIVE CERTIFICATION: SCOPED_TESTS_PASS_NOT_PHASE_CERTIFIED"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content $env:GITHUB_STEP_SUMMARY "## ADAPTIVE CERTIFICATION: SCOPED TESTS PASS"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: ``$env:CANDIDATE_SHA``"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Doctor chose low-risk targeted execution and every selected test passed."
              Add-Content $env:GITHUB_STEP_SUMMARY "- This is **not** a FULL or release/phase certification."
              Add-Content $env:GITHUB_STEP_SUMMARY "- No historical/cross-SHA evidence reused; no required FULL waived."
            }
            exit 0
          }
          if ("${{ steps.route.outputs.run_full }}" -ne "true") {
            throw "PHASE CERTIFICATION: BLOCKED - invalid routing outputs"
          }
          $failures = @()
          if ("${{ steps.lfs.outcome }}" -ne "success") { $failures += "LFS fixtures" }
          if ("${{ steps.catalog.outcome }}" -ne "success") { $failures += "Dofus catalog" }
          if ("${{ steps.doctor_shadow.outcome }}" -eq "failure") { $failures += "Doctor same-SHA shadow verification" }
          $timingOutcome = "${{ steps.timing.outcome }}"
          if ($timingOutcome -and $timingOutcome -ne "success" -and $timingOutcome -ne "skipped") {
            $failures += "Encyclopedia timing performance"
          }

          if ($failures.Count -gt 0) {
            $message = "PHASE CERTIFICATION: NOT CERTIFIED - " + ($failures -join ", ")
            Write-Host $message
            throw $message
          }

          $report = "artifacts/phase_certification/03_atlas_integrity_full.json"
          $phaseReport = "artifacts/phase_certification/04_phase_verdict.json"
          & python -m tools.phase_certification_verdict `
            --integrity-report $report `
            --base-ref "$env:CERT_BASE_REF" `
            --candidate-sha "$env:CANDIDATE_SHA" `
            --output $phaseReport
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $phase = Get-Content -LiteralPath $phaseReport -Raw | ConvertFrom-Json
            $message = "PHASE CERTIFICATION: NOT CERTIFIED - phase verdict rejected the FULL evidence"
            Write-Host $message
            Write-Host "Guide verdict: $($phase.guide_status)"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## PHASE CERTIFICATION: NOT CERTIFIED"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Candidate SHA: ``$env:CANDIDATE_SHA``"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Base ref: ``$env:CERT_BASE_REF``"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Full evidence or frozen baseline non-regression contract failed."
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Guide verdict: ``$($phase.guide_status)``"
            }
            throw $message
          }

          $phase = Get-Content -LiteralPath $phaseReport -Raw | ConvertFrom-Json
          Write-Host "PHASE CERTIFICATION: PASS"
          Write-Host "Certified SHA: $env:CANDIDATE_SHA"
          Write-Host "Phase verdict: $($phase.status)"
          Write-Host "Guide verdict: $($phase.guide_status)"
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## PHASE CERTIFICATION: PASS"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Certified SHA: ``$env:CANDIDATE_SHA``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Base ref: ``$env:CERT_BASE_REF``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Integrity mode: ``FULL``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Phase verdict: ``$($phase.status)``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Guide verdict: ``$($phase.guide_status)``"
            if ($phase.status -eq "PASS_BASELINE_NON_REGRESSION") {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Guide status: existing ``BUILDING`` debt carried byte-for-byte unchanged from the Phase 1 base; this is not GUIDE CERTIFIED."
            }
          }
