    if: needs.doctor-plan.outputs.atlas_windows_distribution == 'true'
    uses: ./.github/workflows/atlas-windows-distribution.yml
  doctor_certification:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.doctor_certification == 'true'
    uses: ./.github/workflows/doctor-certification.yml
  doctor_runtime_perf:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.doctor_runtime_perf == 'true'
