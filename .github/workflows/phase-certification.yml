name: Phase Certification

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref used to classify and validate the candidate diff
        required: true
        default: origin/main
        type: string
  push:
    branches:
      - main
  # Every PR is developed as Draft. Certify once its complete candidate is
  # explicitly marked Ready for review, never on every intermediate commit.
  # Fixes after a failed final certification require manual workflow_dispatch
  # on the updated branch/SHA. Keep main push certification unchanged.
  pull_request:
    branches:
      - main
      - phase8/peak250-guide-worker-v1
    types:
      - ready_for_review

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: doctor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  CERT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_ref }}

defaults:
  run:
    shell: pwsh

jobs:
  doctor-plan:
    name: Doctor / CI Plan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
      phase: ${{ steps.plan.outputs.phase }}
      full: ${{ steps.plan.outputs.full }}
      tooling_only: ${{ steps.plan.outputs.tooling_only }}
      ai_context_ci: ${{ steps.plan.outputs.ai_context_ci }}
      app_ci: ${{ steps.plan.outputs.app_ci }}
      atlas_windows_distribution: ${{ steps.plan.outputs.atlas_windows_distribution }}
      doctor_certification: ${{ steps.plan.outputs.doctor_certification }}
      doctor_runtime_perf: ${{ steps.plan.outputs.doctor_runtime_perf }}
      doctor_ui: ${{ steps.plan.outputs.doctor_ui }}
      encyclopedia_provider_import: ${{ steps.plan.outputs.encyclopedia_provider_import }}
      graphify_map: ${{ steps.plan.outputs.graphify_map }}
      graphify_targeted_ci: ${{ steps.plan.outputs.graphify_targeted_ci }}
      json_focused_data_contract: ${{ steps.plan.outputs.json_focused_data_contract }}
      phase8_memory_benchmark: ${{ steps.plan.outputs.phase8_memory_benchmark }}
      phase8_preload_benchmark: ${{ steps.plan.outputs.phase8_preload_benchmark }}
      signature_report: ${{ steps.plan.outputs.signature_report }}
    steps:
      - name: Checkout exact Doctor candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Set up stdlib-only Doctor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test routing failure boundaries
        shell: bash
        run: |
          # Discover -s tests avoids importing tests/__init__.py (which starts Qt).
          python -m unittest discover -s tests -p test_doctor_ci_orchestrator.py -v
          python -m unittest discover -s tests -p test_ci_pr_audit.py -v
          python -m unittest discover -s tests -p test_ci_domain_certification.py -v
          python -m unittest discover -s tests -p test_ci_timing_observer.py -v
          python -m unittest discover -s tests -p test_craft_adapter_release.py -v
      - name: Determine required CI from exact Git diff
        id: plan
        shell: bash
        env:
          DOCTOR_EVENT: ${{ github.event_name }}
        run: |
          python -m tools.atlas_doctor ci --base-ref "$BASE_SHA" --expected-sha "$CANDIDATE_SHA" --event "$DOCTOR_EVENT" --output artifacts/doctor_ci/plan.json --github-output "$GITHUB_OUTPUT" --json
      - name: Explain Doctor selection
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f artifacts/doctor_ci/plan.json ]; then
            python - <<'PYPLAN'
          import json, os
          from pathlib import Path
          p = json.loads(Path('artifacts/doctor_ci/plan.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Doctor — CI selection\n')
              f.write(f"Candidate: `{p['candidate_sha']}`; base: `{p['base_sha']}`; risk: **{p['risk']}**\n\n")
              f.write(f"FULL: {p['full']}; broad specialist fallback: {p['specialist_fallback']}\n\n")
              for name, route in p['workflows'].items():
                  f.write(f"- {name}: {'RUN' if route['selected'] else 'NOT_APPLICABLE'} — {'; '.join(route['reasons'])}\n")
              f.write('\nSelection is not execution or certification.\n')
          PYPLAN
            python -m tools.ci_pr_audit \
              --plan artifacts/doctor_ci/plan.json \
              --report artifacts/doctor_ci/pr_mini_audit.json \
              --summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: Store exact-SHA Doctor plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/doctor_ci/plan.json
            artifacts/doctor_ci/pr_mini_audit.json
          if-no-files-found: error

  focused-validation:
    name: Doctor / Focused CI Evidence
    needs: doctor-plan
    if: needs.doctor-plan.outputs.phase == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact focused candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Set up stdlib-only focused checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify scope and execute focused contracts
        shell: bash
        env:
          DOCTOR_EVENT: ${{ github.event_name }}
        run: |
          python -m tools.atlas_doctor ci --base-ref "$BASE_SHA" --expected-sha "$CANDIDATE_SHA" --event "$DOCTOR_EVENT" --output artifacts/doctor_ci/focused.json --json
          python - <<'PYDOC'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/doctor_ci/focused.json').read_text())
          if p['phase'] is not False or p['full'] is not False or not (p['docs_only'] or p['tooling_only']):
              raise SystemExit('Not a verified focused diff')
          if p['tooling_only']:
              from tools.atlas_doctor_lib.ci_tooling_scope import run_checks
              run_checks(Path.cwd())
              from tools.atlas_doctor_lib.capability_evidence import (
                  run_capability_witnesses, validate_capability_evidence, write_evidence,
              )
              witness = run_capability_witnesses(Path.cwd(), timeout=240)
              write_evidence(Path.cwd(), Path('artifacts/doctor_ci/capability_evidence.json'), witness)
              checked = validate_capability_evidence(Path.cwd(), witness)
              if witness['status'] != 'PASS' or checked['status'] != 'PASS':
                  print('Doctor witness status:', witness['status'])
                  print('Doctor log length/limit:', witness['raw_stderr_chars'], witness['log_limit_chars'])
                  print('Doctor observed tests:', sum(row['result'] == 'PASS' for row in witness['witnesses'] + witness['control_witnesses']), '/ 36')
                  print('Doctor stderr tail:', witness['stderr_tail'][-2500:])
                  raise SystemExit('Doctor 18x2 witnesses unverified: ' + str(checked['errors']))
              # Exercise the public, plain-JSON agent protocol against real source.
              # No remote Codex/ChatGPT access or fabricated CI attestation is required.
              from tools.atlas_doctor_lib.agent_protocol import run_agent_action
              from tools.atlas_doctor_lib.core import git_state
              agent_path = 'tools/atlas_doctor_lib/capability_evidence.py'
              agent = run_agent_action(Path.cwd(), action='plan', paths=[agent_path], base_ref='HEAD')
              output_path = Path('artifacts/doctor_ci/agent_plan.json')
              output_path.write_text(json.dumps(agent, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              # Parse from disk as an independent JSON consumer would.
              parsed = json.loads(output_path.read_text(encoding='utf-8'))
              anchors = parsed.get('source_evidence', {}).get('source_anchors', [])
              if (parsed.get('protocol') != 'atlas-doctor-agent/v1'
                      or parsed.get('exact_sha') != git_state(Path.cwd())['head']
                      or parsed.get('source_evidence', {}).get('source_sha') != parsed.get('exact_sha')
                      or parsed.get('source_evidence', {}).get('source_inventory_status') != 'PASS'
                      or not any(a.get('path') == agent_path and a.get('symbol') == 'run_capability_witnesses'
                                 and type(a.get('line')) is int and a['line'] > 0
                                 and a.get('evidence_level') == 'SOURCE_DEFINITION_ONLY' for a in anchors)
                      or parsed.get('source_evidence', {}).get('independent_ci_attested') is not False
                      or parsed.get('certification', {}).get('full_certified') is not False):
                  raise SystemExit('Doctor agent JSON round-trip lacks verified source provenance')
              # Record outstanding UI regressions honestly on every tool-only
              # PR: a green validator-smoke cannot stand in for 4 E2E journeys.
              import os
              from tools.atlas_doctor_lib.doctor_ui_ci import watch_ui_regressions
              from tools.atlas_doctor_lib.doctor_ui import write_json
              watch = watch_ui_regressions(
                  baseline_sha=os.environ['BASE_SHA'],
                  candidate_sha=git_state(Path.cwd())['head'],
                  baseline_sessions=[], candidate_sessions=[],
              )
              watch_path = Path('artifacts/doctor_ci/ui_regression_watch.json')
              write_json(watch_path, watch)
              if (watch['status'] != 'NOT_COVERED'
                      or len(watch['controls']) != 4
                      or any(item['status'] != 'NOT_COVERED' for item in watch['controls'].values())):
                  raise SystemExit('Unexpected P3-12 status with no real UI E2E sessions')
              print('P3-12 NOT_COVERED: awaiting real baseline/candidate UI traces for #201/#216')
          print('FOCUSED_VALIDATED_NOT_FULL: no application or release certification')
          PYDOC
      - name: Store focused evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/doctor_ci/focused.json
            artifacts/doctor_ci/capability_evidence.json
            artifacts/doctor_ci/agent_plan.json
            artifacts/doctor_ci/ui_regression_watch.json
          if-no-files-found: error

  pre-full-gate:
    # PR only. Every independent job chosen by the exact-SHA Doctor plan
    # must finish successfully BEFORE allocating a costly FULL runner.
    # No cycle: certify and the two final verdict jobs are not prerequisites.
    name: Doctor / Pre-FULL Contract Gate
    needs: [doctor-plan, pr-fast-validation, ai_context_ci, app_ci, atlas_windows_distribution, doctor_certification, doctor_runtime_perf, doctor_ui, encyclopedia_provider_import, graphify_map, graphify_targeted_ci, json_focused_data_contract, phase8_memory_benchmark, phase8_preload_benchmark, signature_report]
    if: always() && github.event_name == 'pull_request' && needs.doctor-plan.result == 'success' && needs.doctor-plan.outputs.phase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject failed, cancelled, skipped or unverified selected contracts before FULL
        shell: python
        env:
          DOCTOR_RESULTS: ${{ toJSON(needs) }}
          DOCTOR_REQUIRED: ${{ needs.doctor-plan.outputs.required_jobs }}
        run: |
          import json
          import os

          jobs = json.loads(os.environ['DOCTOR_RESULTS'])
          if jobs.get('doctor-plan', {}).get('result') != 'success':
              raise SystemExit('Pre-FULL blocked: no successful Doctor CI plan')
          required = json.loads(os.environ['DOCTOR_REQUIRED'])
          if not isinstance(required, list) or not required or 'certify' not in required:
              raise SystemExit('Pre-FULL blocked: malformed required job inventory')
          for name in required:
              if name == 'certify':
                  continue  # This future job cannot attest to itself.
              actual = jobs.get(name, {}).get('result')
              if actual != 'success':
                  raise SystemExit(f'Pre-FULL blocked: {name} is {actual!r}, expected success')
          # An explicitly failed independent specialist cannot be hidden as
          # optional or by an incomplete plan.
          for name, row in jobs.items():
              if row.get('result') in ('failure', 'cancelled'):
                  raise SystemExit(f'Pre-FULL blocked: independent {name} failed/cancelled')
          print('Independent exact-SHA PR contracts: PASS; FULL may start if required.')

  certify:
    # The PR pre-FULL gate waits for EVERY independently selected specialist;
    # push and explicit dispatch retain their existing FULL policy.
    # FULL. A failed selected benchmark must prevent a wasted 120-minute job,
    # not merely turn Public PR / Safe Validation red after the FULL finishes.
    needs: [doctor-plan, pre-full-gate]
    if: >-
      always() &&
      needs.doctor-plan.result == 'success' &&
      needs.doctor-plan.outputs.phase == 'true' &&
      (github.event_name != 'pull_request' ||
       needs.pre-full-gate.result == 'success')
    name: Phase Certification / Domain or Release Validation
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact certification candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact certification checkout
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Expected candidate SHA: $env:CANDIDATE_SHA"
          Write-Host "Checked out SHA: $actual"
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Certification checkout mismatch: expected $env:CANDIDATE_SHA, got $actual"
          }

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Check merged PR FULL provenance
        id: reuse
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tools.ci_verified_pr_full --repo "$env:GITHUB_REPOSITORY" --candidate-sha "$env:CANDIDATE_SHA" --output "artifacts/phase_certification/verified_pr_full.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve adaptive Doctor route on exact SHA
        id: route
        if: steps.reuse.outputs.reuse_full != 'true'
        run: |
          $forced = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -or "${{ needs.doctor-plan.outputs.full }}" -eq "true") {
            # Explicit manual phase certification remains exhaustive; main pushes use Doctor.
            $forced += "--force-full"
          }
          & python -X faulthandler -m tools.phase_adaptive_gate decide `
            --base-ref "$env:CERT_BASE_REF" `
            --expected-sha "$env:CANDIDATE_SHA" `
            --output "artifacts/phase_certification/adaptive_route.json" `
            --github-output "$env:GITHUB_OUTPUT" @forced
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install application dependencies
        if: steps.reuse.outputs.reuse_full != 'true'
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare certification logs
        run: New-Item -ItemType Directory -Force -Path "artifacts/phase_certification" | Out-Null

      - name: Run independently required domain certification
        id: domains
        if: github.event_name == 'pull_request'
        run: |
          # No application-wide FULL_SUITE on PRs. Each changed owner has to
          # execute its exact-domain tests; an unknown owner is BLOCKED.
          & python -X faulthandler -m tools.ci_domain_certification `
            --base-sha "$env:BASE_SHA" `
            --candidate-sha "$env:CANDIDATE_SHA" `
            --output "artifacts/phase_certification/domain_plan.json" --execute
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize certification LFS fixtures
        id: lfs
        if: github.event_name != 'pull_request' && steps.route.outputs.run_full == 'true'
        continue-on-error: true
        run: |
          $log = "artifacts/phase_certification/01_lfs.log"
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**,tools/doduda/doduda.exe" --exclude="" 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          from pathlib import Path

          required = [
              Path("data/images/misc/dofus_atlas_logo.png"),
              Path("tools/doduda/doduda.exe"),
          ]
          pointer = b"version https://git-lfs.github.com/spec/v1"
          errors = []
          for path in required:
              if not path.is_file():
                  errors.append(f"missing certification fixture: {path}")
              elif path.read_bytes()[: len(pointer)] == pointer:
                  errors.append(f"unmaterialized LFS pointer: {path}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("Certification LFS fixtures materialized")
          '@ | python - 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize local Dofus catalog
        id: catalog
        if: github.event_name != 'pull_request' && steps.route.outputs.run_full == 'true'
        continue-on-error: true
        run: |
          $log = "artifacts/phase_certification/02_catalog.log"
          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) {
            Remove-Item -LiteralPath $catalog -Recurse -Force
          }
          # Certify the same reviewed bytes that Quest/Craft provenance checks.
          # A live Doduda download may advance beyond the committed release pins.
          python -m scripts.windows.quest_assets --download 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.windows.craft_seed --download 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          from app.quest_catalog import QuestCatalog
          count = len(QuestCatalog.load().quests)
          print(f"Materialized QuestCatalog: {count} quests")
          if count < 1900:
              raise SystemExit(f"Quest catalog incomplete after Doduda materialization: {count}")
          '@ | python - 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Ganymede French label evidence (PR 229)
        if: ${{ github.event.pull_request.number == 229 && steps.route.outputs.run_full == 'true' }}
        shell: pwsh
        run: |
          $report = "artifacts/phase_certification/ganymede_french_label_evidence.json"
          $dictionary = "artifacts/phase_certification/ganymede_pinned_name_dictionary_v1.json"
          python -m tools.resolve_ganymede_action_labels --output $report --dictionary-output $dictionary
          if ($LASTEXITCODE -ne 0) { throw "Ganymede name evidence cannot be resolved from pinned sources" }
          $evidence = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $compact = Get-Content -LiteralPath $dictionary -Raw | ConvertFrom-Json
          if ($evidence.status -ne "REVIEW_NAMES_RESOLVED" -or
              $evidence.generic_label_actions -ne 1218 -or
              $evidence.resolved_action_labels -ne 1218 -or
              $evidence.unresolved_reference_count -ne 0 -or
              $compact.status -ne "REVIEW_NAMES_RESOLVED" -or
              $compact.source_candidate_guides -ne 20 -or
              $compact.resolved_action_labels -ne 1218 -or
              $compact.ready_to_replace -ne $false -or
              $compact.canonical_objectives_verified -ne 0) {
            throw "Ganymede pinned French label coverage differs from certified source expectations"
          }
          Write-Host "Ganymede action labels resolved from pinned French data: 1218/1218"

      - name: Export all 95 Ganymede source-stage references (PR 229)
        if: ${{ github.event.pull_request.number == 229 && steps.route.outputs.run_full == 'true' }}
        shell: pwsh
        run: |
          $report = "artifacts/phase_certification/ganymede_all_guide_stage_refs.json"
          python -m tools.build_ganymede_all_guide_stages --output $report
          if ($LASTEXITCODE -ne 0) { throw "Ganymede 95-guide source references could not be exported" }
          $source = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($source.status -ne "REVIEW_PUBLIC_REFERENCES_ONLY" -or
              $source.source_guides -ne 95 -or
              $source.source_steps -ne 7705 -or
              $source.playable_guides -ne 0 -or
              $source.canonical_objectives_verified -ne 0 -or
              $source.ready_to_replace -ne $false -or
              $source.localized_reference_occurrences -le 0) {
            throw "Ganymede source-stage export differs from audited public tree"
          }
          Write-Host "Ganymede source stages: 95 guides / 7705 stages"
          Write-Host "Named source references: $($source.localized_reference_occurrences) / $($source.reference_occurrences)"

      - name: Capture exact public dataset inputs before validation
        id: inputs_before
        if: github.event_name != 'pull_request' && steps.route.outputs.run_full == 'true'
        continue-on-error: true
        run: |
          python -m tools.atlas_json_inventory --raw-inputs `
            --candidate-sha "$env:CANDIDATE_SHA" `
            --output "artifacts/phase_certification/inputs_before.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fail fast on changed test regressions before FULL
        id: diff_preflight
        if: >-
          github.event_name != 'pull_request' && steps.route.outputs.run_full == 'true' &&
          github.event_name == 'pull_request' &&
          steps.catalog.outcome == 'success' &&
          steps.inputs_before.outcome == 'success'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          # Use Atlas Integrity's canonical DIFF_TARGETS command; this is
          # extra early failure detection, not a replacement for FULL_SUITE.
          @'
          import json
          import os
          import sys
          from pathlib import Path
          from tools.atlas_integrity import (
              CommandExecutor, _command_for_group, changed_files,
              load_policy, repository_head,
          )

          root = Path.cwd()
          expected_sha = os.environ['CANDIDATE_SHA']
          actual_sha = repository_head(root)
          if actual_sha != expected_sha:
              raise SystemExit('DIFF_TARGETS preflight SHA mismatch')
          base_ref = os.environ['CERT_BASE_REF']
          changed = changed_files(root, base_ref)
          policy = load_policy(root)
          command = _command_for_group(
              'DIFF_TARGETS', policy['groups']['DIFF_TARGETS'],
              root=root, base_ref=base_ref, changed=changed,
          )
          out = root / 'artifacts/phase_certification'
          out.mkdir(parents=True, exist_ok=True)
          report = {
              'schema_version': 1, 'candidate_sha': actual_sha,
              'base_ref': base_ref, 'changed_files': changed,
              'group': 'DIFF_TARGETS', 'preflight_only': True,
              'full_suite_executed': False, 'phase_certified': False,
          }
          if command is None:
              report.update(status='PASS_NO_CHANGED_TESTS', exit_code=0, test_count=0)
          else:
              result = CommandExecutor().run(command, root)
              code = result.get('exit_code')
              if type(code) is not int:
                  raise SystemExit('Invalid canonical DIFF_TARGETS result')
              output = str(result.get('stdout', '')) + '\n' + str(result.get('stderr', ''))
              (out / '02b_diff_preflight.log').write_text(output, encoding='utf-8')
              report.update(
                  status='PASS' if code == 0 else 'FAIL',
                  exit_code=code,
                  duration_seconds=result.get('duration_seconds'),
                  command=command,
              )
          (out / '02b_diff_preflight.json').write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print('DIFF_TARGETS early preflight:', report['status'],
                'candidate:', actual_sha, 'FULL remains independently required')
          if report['exit_code'] != 0:
              print('Changed tests failed. Skipping expensive FULL; no certification granted.', file=sys.stderr)
              sys.exit(1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'DIFF_TARGETS preflight failed; FULL blocked early' }

      - name: Preserve modular certification failure or timeout evidence
        if: always() && github.event_name == 'pull_request' && steps.domains.outcome != 'success'
        shell: pwsh
        run: |
          $target = "artifacts/phase_certification/02c_domain_failure.json"
          if (-not (Test-Path -LiteralPath $target)) {
            New-Item -ItemType Directory -Force -Path "artifacts/phase_certification" | Out-Null
            [ordered]@{
              schema_version = 1
              candidate_sha = $env:CANDIDATE_SHA
              base_ref = $env:CERT_BASE_REF
              group = "PR_DOMAIN_CERTIFICATION"
              preflight_only = $false
              full_suite_executed = $false
              phase_certified = $false
              status = "INCOMPLETE_OR_FAILED"
              github_step_outcome = "${{ steps.domains.outcome }}"
              reason = "Required exact-SHA domain certification failed, skipped or timed out."
            } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $target -Encoding utf8
          }

      - name: Measure canonical Encyclopedia user paths
        id: timing
        if: >-
          github.event_name != 'pull_request' && steps.route.outputs.run_full == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            steps.diff_preflight.outcome == 'success' &&
            startsWith(github.event.pull_request.title, 'Phase 7B')))
        continue-on-error: true
        run: |
          $log = "artifacts/phase_certification/06_timing_performance.log"
          $report = "artifacts/phase_certification/06_timing_performance.json"
          & python -X faulthandler -m app.modules.encyclopedia.tools.benchmark_guides_performance 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($null -eq $code) { $code = 0 }
          if ($code -ne 0) { exit $code }
          Copy-Item -LiteralPath "artifacts/quests_guides_performance.json" -Destination $report -Force

          @'
          import json
          import os
          from pathlib import Path

          report = Path("artifacts/phase_certification/06_timing_performance.json")
          payload = json.loads(report.read_text(encoding="utf-8"))
          expected_head = os.environ.get("CANDIDATE_SHA", "")
          actual_head = str(payload.get("environment", {}).get("git_head") or "")
          if actual_head != expected_head:
              raise SystemExit(f"timing benchmark SHA mismatch: expected {expected_head}, got {actual_head}")
          if payload.get("schema_version") != 4:
              raise SystemExit(f"unexpected performance schema: {payload.get('schema_version')!r}")

          after = payload.get("after") or {}
          required = (
              "startup_stabilized_ms",
              "startup_stabilized_rss_mb",
              "quests_open_ms",
              "quests_open_max_ui_block_ms",
              "achievements_open_ms",
              "achievements_open_max_ui_block_ms",
              "guide_open_ms",
              "guide_open_max_ui_block_ms",
              "first_achievement_detail_ms",
              "first_achievement_detail_max_ui_block_ms",
              "first_guide_detail_ms",
              "first_guide_detail_max_ui_block_ms",
              "quests_hot_return_ms",
              "achievements_hot_return_ms",
              "guide_hot_return_ms",
              "rss_after_all_views_mb",
              "rss_after_round_trips_mb",
              "idle_cpu_percent_one_core",
          )
          missing = [name for name in required if after.get(name) is None]
          if missing:
              raise SystemExit("missing canonical Encyclopedia timing metrics: " + ", ".join(missing))
          print("Canonical Encyclopedia timing evidence captured for exact candidate SHA")
          '@ | python - 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full Atlas phase certification gate
        id: certification
        if: >-
          github.event_name != 'pull_request' && steps.route.outputs.run_full == 'true' &&
          steps.inputs_before.outcome == 'success' &&
          steps.catalog.outcome == 'success' &&
          (github.event_name != 'pull_request' || steps.diff_preflight.outcome == 'success')
        continue-on-error: true
        run: |
          $report = "artifacts/phase_certification/03_atlas_integrity_full.json"
          Write-Host "Certification candidate SHA: $env:CANDIDATE_SHA"
          Write-Host "Certification base ref: $env:CERT_BASE_REF"
          & python -X faulthandler -m tools.atlas_integrity full --base-ref "$env:CERT_BASE_REF" --json 1> $report
          $code = $LASTEXITCODE
          if ($null -eq $code) { $code = 0 }
          if (-not (Test-Path -LiteralPath $report)) {
            throw "Atlas integrity report was not created."
          }
          Get-Content -LiteralPath $report | Write-Host
          if ($code -ne 0) { exit $code }

      - name: Verify public dataset inputs did not change during validation
        id: inputs_after
        if: github.event_name != 'pull_request' && steps.route.outputs.run_full == 'true' && always()
        continue-on-error: true
        run: |
          python -m tools.atlas_json_inventory --raw-inputs `
            --candidate-sha "$env:CANDIDATE_SHA" `
            --verify-against "artifacts/phase_certification/inputs_before.json" `
            --output "artifacts/phase_certification/inputs_after.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute and verify exact-SHA targeted modules
        id: scoped
        if: steps.route.outputs.run_scoped == 'true'
        run: |
          & python -X faulthandler -m tools.doctor_certification `
            --base-ref "$env:CERT_BASE_REF" `
            --expected-sha "$env:CANDIDATE_SHA" --run `
            --output "artifacts/phase_certification/doctor_scoped_report.json" `
            --passport-output "artifacts/phase_certification/doctor_scoped_passport.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -X faulthandler -m tools.phase_adaptive_gate verify-scoped `
            --route "artifacts/phase_certification/adaptive_route.json" `
            --report "artifacts/phase_certification/doctor_scoped_report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare Doctor plan with actual exact-SHA FULL evidence
        id: doctor_shadow
        if: github.event_name != 'pull_request' && steps.route.outputs.run_full == 'true' && always()
        continue-on-error: true
        run: |
          $full = "artifacts/phase_certification/03_atlas_integrity_full.json"
          if (-not (Test-Path -LiteralPath $full)) {
            Write-Host "Doctor shadow: FULL JSON unavailable, no comparison possible"
            exit 0
          }
          $plan = "artifacts/phase_certification/doctor_same_sha_plan.json"
          $campaign = "artifacts/phase_certification/doctor_same_sha_shadow.json"
          python -X faulthandler -m tools.doctor_certification --base-ref "$env:CERT_BASE_REF" --expected-sha "$env:CANDIDATE_SHA" --output $plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X faulthandler -m tools.doctor_shadow_campaign --pair $plan $full --output $campaign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Doctor exact-SHA shadow pair recorded; no FULL waiver granted"

      - name: Enforce phase certification verdict
        id: phase_verdict
        if: always()
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            # Modular PR evidence is a domain certificate, never a historical
            # FULL or a release/Guide Phase certification.
            if ("${{ steps.domains.outcome }}" -ne "success") {
              throw "DOMAIN CERTIFICATION: blocked or missing exact-domain tests"
            }
            $p = Get-Content "artifacts/phase_certification/domain_plan.json" -Raw | ConvertFrom-Json
            $proof = Get-Content "artifacts/phase_certification/domain_test_evidence.json" -Raw | ConvertFrom-Json
            if ($p.status -ne "READY_TO_EXECUTE" -or
                $p.candidate_sha -ne $env:CANDIDATE_SHA -or
                $p.base_sha -ne $env:BASE_SHA -or
                $p.unknown_paths.Count -ne 0 -or $p.deleted_paths.Count -ne 0 -or
                $p.domains.Count -lt 1 -or
                $proof.status -ne "PASS_DOMAIN_TESTS_NOT_PHASE_CERTIFIED" -or
                $proof.candidate_sha -ne $env:CANDIDATE_SHA -or
                $proof.base_sha -ne $env:BASE_SHA -or
                $proof.full_suite_executed -ne $false -or
                $proof.phase_certified -ne $false -or
                $proof.merge_authorized -ne $false -or
                $proof.tests_run -lt 1) {
              throw "DOMAIN CERTIFICATION: missing/invalid exact-SHA domain proof"
            }
            Write-Host "DOMAIN CERTIFICATION: PASS (NOT FULL/PHASE RELEASE)"
            Write-Host "Domains: $($p.domains -join ', ')"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content $env:GITHUB_STEP_SUMMARY "## DOMAIN CERTIFICATION: PASS"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: $env:CANDIDATE_SHA"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Selected domains: $($p.domains -join ', ')"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Tests executed: $($proof.tests_run)"
              Add-Content $env:GITHUB_STEP_SUMMARY "- FULL_SUITE not executed. Phase/release not certified."
              Add-Content $env:GITHUB_STEP_SUMMARY "- All independently selected specialist jobs and Public PR Safe Validation must also pass."
            }
            exit 0
          }
          if ("${{ steps.reuse.outputs.reuse_full }}" -eq "true") {
            if ("${{ steps.reuse.outcome }}" -ne "success" -or
                "${{ steps.route.outcome }}" -ne "skipped" -or
                "${{ steps.certification.outcome }}" -ne "skipped") {
              throw "PHASE CERTIFICATION: invalid reused FULL route"
            }
            $proof = Get-Content "artifacts/phase_certification/verified_pr_full.json" -Raw | ConvertFrom-Json
            if ($proof.status -ne "VERIFIED_PR_FULL_SAME_TREE" -or
                $proof.main_sha -ne $env:CANDIDATE_SHA -or
                $proof.host_verified_real_full -ne $true) {
              throw "PHASE CERTIFICATION: invalid merged PR FULL provenance"
            }
            Write-Host "PHASE CERTIFICATION: PASS - host-verified PR FULL with identical merged Git tree"
            Write-Host "Certified source: $($proof.source_run_url)"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content $env:GITHUB_STEP_SUMMARY "## PASS - verified tree-identical PR FULL"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Main SHA: $env:CANDIDATE_SHA"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Real successful PR FULL: $($proof.source_run_url)"
              Add-Content $env:GITHUB_STEP_SUMMARY "- No duplicate FULL rerun; exact tree equivalence verified."
            }
            exit 0
          }
          if ("${{ steps.route.outcome }}" -ne "success") {
            throw "PHASE CERTIFICATION: BLOCKED - adaptive routing failed"
          }
          if ("${{ steps.route.outputs.run_scoped }}" -eq "true") {
            if ("${{ steps.scoped.outcome }}" -ne "success") {
              throw "ADAPTIVE CERTIFICATION: BLOCKED - canonical scoped tests failed"
            }
            Write-Host "ADAPTIVE CERTIFICATION: SCOPED_TESTS_PASS_NOT_PHASE_CERTIFIED"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content $env:GITHUB_STEP_SUMMARY "## ADAPTIVE CERTIFICATION: SCOPED TESTS PASS"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: ``$env:CANDIDATE_SHA``"
              Add-Content $env:GITHUB_STEP_SUMMARY "- Doctor chose low-risk targeted execution and every selected test passed."
              Add-Content $env:GITHUB_STEP_SUMMARY "- This is **not** a FULL or release/phase certification."
              Add-Content $env:GITHUB_STEP_SUMMARY "- No historical/cross-SHA evidence reused; no required FULL waived."
            }
            exit 0
          }
          if ("${{ steps.route.outputs.run_full }}" -ne "true") {
            throw "PHASE CERTIFICATION: BLOCKED - invalid routing outputs"
          }
          $failures = @()
          if ("${{ steps.lfs.outcome }}" -ne "success") { $failures += "LFS fixtures" }
          if ("${{ steps.catalog.outcome }}" -ne "success") { $failures += "Dofus catalog" }
          if ("${{ steps.inputs_before.outcome }}" -ne "success") { $failures += "Public dataset provenance before validation" }
          if ("${{ steps.inputs_after.outcome }}" -ne "success") { $failures += "Public dataset drift during validation" }
          if ("${{ steps.doctor_shadow.outcome }}" -eq "failure") { $failures += "Doctor same-SHA shadow verification" }
          $timingOutcome = "${{ steps.timing.outcome }}"
          if ($timingOutcome -and $timingOutcome -ne "success" -and $timingOutcome -ne "skipped") {
            $failures += "Encyclopedia timing performance"
          }

          if ($failures.Count -gt 0) {
            $message = "PHASE CERTIFICATION: NOT CERTIFIED - " + ($failures -join ", ")
            Write-Host $message
            throw $message
          }

          $report = "artifacts/phase_certification/03_atlas_integrity_full.json"
          $phaseReport = "artifacts/phase_certification/04_phase_verdict.json"
          & python -m tools.phase_certification_verdict `
            --integrity-report $report `
            --base-ref "$env:CERT_BASE_REF" `
            --candidate-sha "$env:CANDIDATE_SHA" `
            --output $phaseReport
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $phase = Get-Content -LiteralPath $phaseReport -Raw | ConvertFrom-Json
            $message = "PHASE CERTIFICATION: NOT CERTIFIED - phase verdict rejected the FULL evidence"
            Write-Host $message
            Write-Host "Guide verdict: $($phase.guide_status)"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## PHASE CERTIFICATION: NOT CERTIFIED"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Candidate SHA: ``$env:CANDIDATE_SHA``"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Base ref: ``$env:CERT_BASE_REF``"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Full evidence or frozen baseline non-regression contract failed."
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Guide verdict: ``$($phase.guide_status)``"
            }
            throw $message
          }

          $phase = Get-Content -LiteralPath $phaseReport -Raw | ConvertFrom-Json
          Write-Host "PHASE CERTIFICATION: PASS"
          Write-Host "Certified SHA: $env:CANDIDATE_SHA"
          Write-Host "Phase verdict: $($phase.status)"
          Write-Host "Guide verdict: $($phase.guide_status)"
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## PHASE CERTIFICATION: PASS"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Certified SHA: ``$env:CANDIDATE_SHA``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Base ref: ``$env:CERT_BASE_REF``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Integrity mode: ``FULL``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Phase verdict: ``$($phase.status)``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Guide verdict: ``$($phase.guide_status)``"
            if ($phase.status -eq "PASS_BASELINE_NON_REGRESSION") {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Guide status: existing ``BUILDING`` debt carried byte-for-byte unchanged from the Phase 1 base; this is not GUIDE CERTIFIED."
            }
          }

      - name: Record final Phase outcome diagnostics
        if: always()
        continue-on-error: true
        shell: python
        env:
          PHASE_ROUTE_OUTCOME: ${{ steps.route.outcome }}
          PHASE_FULL_OUTCOME: ${{ steps.certification.outcome }}
          PHASE_SCOPED_OUTCOME: ${{ steps.scoped.outcome }}
          PHASE_PREFLIGHT_OUTCOME: ${{ steps.diff_preflight.outcome }}
          PHASE_VERDICT_OUTCOME: ${{ steps.phase_verdict.outcome }}
        run: |
          import json, os
          from pathlib import Path
          target = Path("artifacts/phase_certification/05_phase_outcome.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          outcomes = {
              key: os.environ.get(key, "unknown") for key in (
                  "PHASE_ROUTE_OUTCOME", "PHASE_FULL_OUTCOME",
                  "PHASE_SCOPED_OUTCOME", "PHASE_PREFLIGHT_OUTCOME",
                  "PHASE_VERDICT_OUTCOME"
              )
          }
          good = outcomes["PHASE_VERDICT_OUTCOME"] == "success"
          canonical = Path("artifacts/phase_certification/04_phase_verdict.json").is_file()
          target.write_text(json.dumps({
              "schema_version": 1, "kind": "atlas_phase_step_diagnostics",
              "candidate_sha": os.environ.get("CANDIDATE_SHA"),
              "base_ref": os.environ.get("CERT_BASE_REF"),
              "status": "STEP_SUCCEEDED_NOT_CERTIFICATE" if good else "NOT_CERTIFIED",
              "canonical_phase_verdict_present": canonical,
              "steps": outcomes,
              "certified": False,
              "note": "Diagnostic only. Certification requires the canonical verdict or independent host-verified reuse, never this file.",
          }, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

      - name: Upload certification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/phase_certification/**
            artifacts/ci_guide_ultime_logs/**
          if-no-files-found: warn
          retention-days: 30

  pr-fast-validation:
    needs: doctor-plan
    if: always() && github.event_name == 'pull_request'
    name: Doctor / PR FAST
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require successful Doctor plan
        shell: bash
        env:
          DOCTOR_PLAN_RESULT: ${{ needs.doctor-plan.result }}
        run: test "$DOCTOR_PLAN_RESULT" = success
      - name: Checkout exact pull request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "PR checkout mismatch: expected $env:CANDIDATE_SHA, got $actual"
          }
          Write-Host "PR candidate SHA: $actual"
          Write-Host "PR base SHA: $env:BASE_SHA"

      - name: Reject vulnerable dependency changes
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: development, runtime, unknown

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Verify real Qt signal observation (Graphify branch only)
        if: ${{ startsWith(github.event.pull_request.head.ref, 'phase8/graphify-') }}
        shell: pwsh
        run: |
          python -m unittest -v tests.test_atlas_doctor_qt_integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate pull request diff hygiene
        shell: pwsh
        run: |
          git diff --check "$env:BASE_SHA...HEAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Classify Doctor risk
        id: doctor_risk
        shell: pwsh
        run: |
          $risk = python -c "import os; from pathlib import Path; from tools.atlas_integrity import changed_files, classify_risk; root=Path.cwd(); print(classify_risk(changed_files(root, os.environ['BASE_SHA']))['risk'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $risk = $risk.Trim()
          if ($risk -notin @("LOW", "MEDIUM", "HIGH", "CRITICAL")) {
            throw "Unexpected Atlas Integrity risk classification: $risk"
          }
          Write-Host "Doctor risk: $risk"
          "risk=$risk" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Materialize Doctor quest catalog
        # A phase-routed PR receives an independent exact-SHA FULL gate;
        # only ordinary FAST PRs need this local catalog fixture.
        if: ${{ steps.doctor_risk.outputs.risk != 'LOW' && !(needs.doctor-plan.outputs.phase == 'true' && github.event.pull_request.head.repo.full_name == github.repository) && !(github.event.pull_request.number == 123 && github.event.pull_request.head.ref == 'phase8/graphify-staged-cleanup-v1' && github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        run: |
          git lfs pull --include="tools/doduda/doduda.exe" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $catalog = "data/cache/dofus_maps/raw/doduda_cli"
          if (Test-Path -LiteralPath $catalog) {
            Remove-Item -LiteralPath $catalog -Recurse -Force
          }
          python -m scripts.windows.quest_assets --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.windows.craft_seed --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          from app.quest_catalog import QuestCatalog
          catalog = QuestCatalog.load()
          count = len(catalog.quests)
          print(f"Materialized QuestCatalog: {count} quests")
          if count < 1900:
              raise SystemExit(f"Quest catalog incomplete after Doduda materialization: {count}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize CRITICAL Doctor fixtures
        # Required for risk-expanded ordinary FAST; the mandatory exact-SHA
        # FULL gate handles these fixtures for phase-routed PRs.
        if: ${{ steps.doctor_risk.outputs.risk == 'CRITICAL' && !(needs.doctor-plan.outputs.phase == 'true' && github.event.pull_request.head.repo.full_name == github.repository) && !(github.event.pull_request.number == 123 && github.event.pull_request.head.ref == 'phase8/graphify-staged-cleanup-v1' && github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        run: |
          git lfs pull --include="data/images/misc/dofus_atlas_logo.png,data/encyclopedia/images/quests/26/**,data/encyclopedia/images/quests/29/**,data/encyclopedia/images/quests/55/**,data/encyclopedia/images/quests/72/**,data/encyclopedia/images/quests/260/**,data/encyclopedia/images/quests/691/**,data/encyclopedia/images/quests/1653/**,data/encyclopedia/images/quests/1760/**,data/encyclopedia/images/quests/1851/**,data/encyclopedia/images/quests/2464/**" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run canonical Doctor FAST merge gate
        # PR #123 changes Doctor itself: use independent focused contracts and
        # standalone merge-safety tests instead. All other PRs keep Doctor FAST.
        if: ${{ !(github.event.pull_request.number == 123 && github.event.pull_request.head.ref == 'phase8/graphify-staged-cleanup-v1' && github.event.pull_request.head.repo.full_name == github.repository) }}
        id: doctor
        shell: pwsh
        # Doctor CI's exact-diff phase route also owns an independent mandatory
        # FULL certification. Do not infer preflight scope from the PR title.
        env:
          ATLAS_PHASE_PR_PREFLIGHT: ${{ needs.doctor-plan.outputs.phase == 'true' && github.event.pull_request.head.repo.full_name == github.repository && '1' || '0' }}
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/pr_doctor" | Out-Null
          $report = "artifacts/pr_doctor/doctor-fast.json"

          python -X faulthandler -m tools.atlas_doctor verify --gate fast --base-ref "$env:BASE_SHA" --json 1> $report
          $doctorExit = $LASTEXITCODE

          if (-not (Test-Path -LiteralPath $report)) {
            throw "Atlas Doctor did not produce its machine-readable report."
          }

          $payload = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $integrityStatus = [string]$payload.integrity.status
          $criticalCount = [int]$payload.audit.severity.CRITICAL

          Write-Host "Doctor status: $($payload.status)"
          Write-Host "Doctor engine Git/inventory: $($payload.timings_ms.git_and_inventory) ms"
          Write-Host "Doctor engine AST scan: $($payload.timings_ms.ast_scan) ms"
          Write-Host "Doctor engine cross-file analysis: $($payload.timings_ms.cross_file_analysis) ms"
          Write-Host "Doctor integration gate: $($payload.timings_ms.integrity_gate) ms"
          Write-Host "Doctor validation profile: $($payload.integrity.report.validation_profile)"
          Write-Host "Atlas Integrity FAST status: $integrityStatus"
          Write-Host "Doctor CRITICAL findings: $criticalCount"

          # Doctor exit code 1 means REVIEW (for example pre-existing HIGH findings
          # or no previous local audit baseline). The merge gate blocks only hard
          # Doctor failure, failed FAST integrity evidence, or a CRITICAL finding.
          if ($doctorExit -ge 2 -or $integrityStatus -ne "PASS" -or $criticalCount -gt 0) {
            throw "Doctor FAST merge gate failed. Inspect artifacts/pr_doctor/doctor-fast.json."
          }
          if ($doctorExit -eq 1) {
            Write-Warning "Doctor returned REVIEW; non-blocking advisory findings are recorded in the report."
          }
          # PowerShell preserves the last native process exit code. At this point
          # REVIEW has been explicitly accepted and every hard condition passed.
          exit 0

      - name: Run independent architecture contracts for Graphify PR 123
        if: ${{ github.event.pull_request.number == 123 && github.event.pull_request.head.ref == 'phase8/graphify-staged-cleanup-v1' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: |
          # Doctor FAST normally owns this test; never silently drop it.
          python -X faulthandler -m unittest -v tests.test_project_guardrails
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run merge-safety contracts outside Doctor FAST policy
        shell: pwsh
        run: |
          # Doctor FAST ARCHITECTURE owns tests.test_project_guardrails.
          python -X faulthandler -m unittest -v `
            tests.test_atlas_integrity `
            tests.test_ci_runner_guardrails `
            tests.test_encyclopedia_phase1 `
            tests.test_main_phase_evidence `
            tests.test_ci_verified_pr_full `
            tests.test_phase_certification_guardrails `
            tests.test_repository_git_hooks `
            tests.test_public_pr_ci_guardrails `
            tests.test_security_hardening_guardrails
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Ganymede name and need provenance (PR 229)
        if: ${{ github.event.pull_request.number == 229 }}
        shell: pwsh
        run: |
          python -m unittest -v tests.test_ganymede_action_name_resolution tests.test_ganymede_stage_needs tests.test_ganymede_all_guide_stages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Doctor merge evidence
        if: always() && github.event_name == 'pull_request' && needs.doctor-plan.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-doctor-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr_doctor/**
          if-no-files-found: warn
          retention-days: 4

      - name: Report PR validation boundary
        if: ${{ always() }}
        shell: pwsh
        env:
          DOCTOR_DEFERRED: ${{ github.event.pull_request.number == 123 && github.event.pull_request.head.ref == 'phase8/graphify-staged-cleanup-v1' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          Write-Host "PR SAFE VALIDATION ONLY - NOT PHASE CERTIFICATION"
          Write-Host "A phase is CERTIFIED only by Phase Certification / Full Validation on the exact candidate SHA."
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## PR SAFE VALIDATION ONLY"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Candidate SHA: ``$env:CANDIDATE_SHA``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Doctor risk: ``${{ steps.doctor_risk.outputs.risk }}``"
            $doctorDeferred = $env:DOCTOR_DEFERRED -eq "true"
            if ($doctorDeferred) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- PR #123 exception: Doctor FAST and its heavy fixtures intentionally skipped; independent Graphify, Qt and merge-safety contracts remain required."
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- This is NOT proof of Doctor FAST or full Phase 8/RAM/preload certification."
            } else {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Required merge gate: ``Atlas Doctor FAST`` through ``Public PR / Safe Validation``."
            }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Internal Phase PR: changed-test DIFF_TARGETS are deferred to the independent exact-SHA FULL certification, never skipped from certification."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Ordinary MEDIUM/HIGH risk PRs materialize QuestCatalog for Golden Flows; CRITICAL also materializes heavy images."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Internal Phase PR FAST skips those unused fixtures; Phase Certification independently materializes and validates them on the exact SHA."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- This workflow is **NOT PHASE CERTIFICATION**."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- A phase can be declared **CERTIFIED** only after ``Phase Certification / Full Validation`` succeeds on the exact candidate SHA."
          }

      - name: Enforce dependency review verdict
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ("${{ steps.dependency_review.outcome }}" -ne "success") {
            throw "Dependency Review must succeed; enable Dependency Graph and resolve any reported vulnerable dependency before merge."
          }
          Write-Host "Dependency Review verdict: success"

  certification-policy:
    # Stage 1: expose and smoke-test the *real check context* on PRs without
    # updating remote branch protection. Stage 2 (admin operation) activates
    # --enforce true and adds this context to the ruleset after a real PR smoke.
    name: Certification Policy / Merge Gate
    needs: [doctor-plan, safe-validation, certify]
    if: always() && github.event_name == 'pull_request' && needs.doctor-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout exact certification policy candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false

      - name: Run focused certification policy contracts
        shell: bash
        run: python -m unittest discover -s tests -p test_ci_required_certification.py -v

      - name: Verify candidate identity and authenticated FULL/SCOPED evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SAFE_VALIDATION: ${{ needs.safe-validation.result }}
          ATLAS_CERT_POLICY_ENFORCE: "false"
        run: |
          python -m tools.ci_required_certification \
            --candidate-sha "$CANDIDATE_SHA" \
            --base-sha "$BASE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-ref "$PR_HEAD_REF" \
            --base-ref "$PR_BASE_REF" \
            --safe-result "$SAFE_VALIDATION" \
            --enforce "$ATLAS_CERT_POLICY_ENFORCE" \
            --output artifacts/cert_policy/merge_gate.json

      - name: Upload certification policy decision
        if: always() && github.event_name == 'pull_request' && needs.doctor-plan.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certification-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cert_policy/merge_gate.json
          if-no-files-found: warn
          retention-days: 7

  ai_context_ci:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.ai_context_ci == 'true'
    uses: ./.github/workflows/ai-context-ci.yml
  app_ci:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.app_ci == 'true'
    uses: ./.github/workflows/app-ci.yml
  atlas_windows_distribution:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.atlas_windows_distribution == 'true'
    uses: ./.github/workflows/atlas-windows-distribution.yml
  doctor_certification:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.doctor_certification == 'true'
    uses: ./.github/workflows/doctor-certification.yml
  doctor_runtime_perf:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.doctor_runtime_perf == 'true'
    uses: ./.github/workflows/doctor-runtime-perf.yml
  doctor_ui:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.doctor_ui == 'true'
    uses: ./.github/workflows/doctor-ui.yml
    with:
      base_ref: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
  encyclopedia_provider_import:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.encyclopedia_provider_import == 'true'
    uses: ./.github/workflows/encyclopedia-provider-import.yml
  graphify_map:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.graphify_map == 'true'
    uses: ./.github/workflows/graphify-map.yml
  graphify_targeted_ci:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.graphify_targeted_ci == 'true'
    uses: ./.github/workflows/graphify-targeted-ci.yml
  json_focused_data_contract:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.json_focused_data_contract == 'true'
    uses: ./.github/workflows/json-focused-data-contract.yml
  phase8_memory_benchmark:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.phase8_memory_benchmark == 'true'
    uses: ./.github/workflows/phase8-memory-benchmark.yml
  phase8_preload_benchmark:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.phase8_preload_benchmark == 'true'
    uses: ./.github/workflows/phase8-preload-benchmark.yml
    with:
      base_ref: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
  signature_report:
    needs: doctor-plan
    if: needs.doctor-plan.outputs.signature_report == 'true'
    uses: ./.github/workflows/signature-report.yml

  safe-validation:
    name: Public PR / Safe Validation
    if: always() && github.event_name == 'pull_request'
    needs: [doctor-plan, focused-validation, certify, pr-fast-validation, ai_context_ci, app_ci, atlas_windows_distribution, doctor_certification, doctor_runtime_perf, doctor_ui, encyclopedia_provider_import, graphify_map, graphify_targeted_ci, json_focused_data_contract, phase8_memory_benchmark, phase8_preload_benchmark, signature_report]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject failed or skipped selected CI
        shell: python
        env:
          DOCTOR_RESULTS: ${{ toJSON(needs) }}
          DOCTOR_REQUIRED: ${{ needs.doctor-plan.outputs.required_jobs }}
        run: |
          import json, os
          jobs = json.loads(os.environ['DOCTOR_RESULTS'])
          if jobs['doctor-plan']['result'] != 'success':
              raise SystemExit('Doctor planning failed: no CI verdict')
          if any(job.get('result') in {'failure', 'cancelled'} for job in jobs.values()):
              raise SystemExit('A Doctor validation failed or was cancelled')
          required = json.loads(os.environ['DOCTOR_REQUIRED'])
          for name in required:
              if jobs.get(name, {}).get('result') != 'success':
                  raise SystemExit('Required CI did not succeed: ' + name)
          print('Doctor selected CI: PASS. FULL/phase certification requires its own exact-SHA evidence.')

  doctor-verdict:
    name: Doctor / CI Verdict
    if: always()
    needs: [doctor-plan, focused-validation, certify, pr-fast-validation, safe-validation, certification-policy, ai_context_ci, app_ci, atlas_windows_distribution, doctor_certification, doctor_runtime_perf, doctor_ui, encyclopedia_provider_import, graphify_map, graphify_targeted_ci, json_focused_data_contract, phase8_memory_benchmark, phase8_preload_benchmark, signature_report]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Pure observability on the existing final runner: no tests skipped and
      # no extra runner allocated. Running job is excluded from the totals.
      - name: Publish measured CI job timings (advisory)
        shell: bash
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTIMINGS'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          request = Request(url, headers={
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "atlas-ci-timing-observer",
          })
          try:
              with urlopen(request, timeout=12) as response:
                  result = json.load(response)
              jobs = result["jobs"]
              if not isinstance(jobs, list) or result.get("total_count", 0) > len(jobs):
                  raise ValueError("Incomplete job inventory: timing totals withheld")
              measured = []
              excluded = []
              skipped = 0
              for job in jobs:
                  label = str(job.get("name", "unknown")).replace("|", "/").replace("\n", " ").replace("\r", " ")
                  if job.get("conclusion") == "skipped":
                      # GitHub can return completed_at one second BEFORE
                      # started_at for a job that never ran (observed in run
                      # #40140997450). Skipped jobs consume no test runner time.
                      skipped += 1
                      continue
                  if job.get("status") != "completed" or not job.get("started_at") or not job.get("completed_at"):
                      excluded.append((label, "pending or missing timestamps"))
                      continue
                  try:
                      start = datetime.fromisoformat(job["started_at"].replace("Z", "+00:00"))
                      end = datetime.fromisoformat(job["completed_at"].replace("Z", "+00:00"))
                      seconds = (end - start).total_seconds()
                      if seconds < 0:
                          raise ValueError("negative GitHub timestamp interval")
                  except (ValueError, TypeError, AttributeError) as exc:
                      excluded.append((label, type(exc).__name__))
                      continue  # Never silently coerce an invalid interval to zero.
                  measured.append((label, seconds, str(job.get("conclusion") or "unknown"), start, end))
              measured.sort(key=lambda row: (-row[1], row[0]))
              # This is elapsed sum, not billing; separate invoiced minutes
              # require GitHub billing records and runner-specific rounding.
              # Sum of parallel job intervals is NOT actual billed minutes.
              total = sum(row[1] for row in measured)
              span = ((max(row[4] for row in measured) -
                       min(row[3] for row in measured)).total_seconds()
                      if measured else None)
              failed = [row for row in measured if row[2] in ("failure", "cancelled", "timed_out")]
              earliest = min(failed, key=lambda row: row[4]) if failed else None
              report = {
                  "schema_version": 1, "kind": "atlas_ci_job_timing_observations",
                  "status": "ADVISORY_PARTIAL" if excluded else "ADVISORY",
                  "run_id": run_id, "observed_jobs": len(jobs),
                  "measured_jobs": len(measured), "skipped_jobs": skipped,
                  "excluded": [{"job": name, "reason": why} for name, why in excluded],
                  "sum_completed_job_seconds": round(total, 3),
                  "observed_wall_span_seconds": round(span, 3) if span is not None else None,
                  "first_failed_job": earliest[0] if earliest else None,
                  "first_failed_at": earliest[4].isoformat() if earliest else None,
                  "jobs": [{"name": name, "seconds": round(seconds, 3),
                            "conclusion": status}
                           for name, seconds, status, _, _ in measured],
                  "certified": False, "tests_executed": False,
                  "note": "Advisory snapshot. Parallel job sums are NOT billing. The current running verdict is excluded.",
              }
              output = Path("artifacts/doctor_ci/job_timings.json")
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
                  stream.write("\n## Doctor — CI timing observations (advisory)\n")
                  stream.write(f"Completed jobs: {len(measured)}/{len(jobs)}; skipped: {skipped}; invalid/pending: {len(excluded)}.\n")
                  stream.write(f"Summed completed job durations: **{total / 60:.1f} min** (parallel overlap, NOT billed minutes).\n")
                  if span is not None:
                      stream.write(f"Observed run span: **{span / 60:.1f} min** (not a dependency-graph critical path).\n")
                  if earliest:
                      stream.write(f"First completed failure: **{earliest[0]}** at {earliest[4].isoformat()}.\n")
                  stream.write("| Completed job | Duration | Result |\n|---|---:|---|\n")
                  for name, seconds, status, _, _ in measured[:20]:
                      stream.write(f"| {name} | {seconds / 60:.2f} min | {status} |\n")
                  for name, reason in excluded[:12]:
                      stream.write(f"- Excluded observation: {name} ({reason}); not counted as zero.\n")
                  stream.write("Pending/current job excluded; estimates of saved FULL minutes are NOT claimed. This is not certification proof.\n")
          except (OSError, KeyError, TypeError, ValueError) as exc:
              print(f"CI timing observation unavailable (advisory): {type(exc).__name__}: {exc}")
          PYTIMINGS
      - name: Archive measured CI timings (advisory)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-ci-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/doctor_ci/job_timings.json
          if-no-files-found: warn
          retention-days: 30
      - name: Reject failed or skipped selected CI
        shell: python
        env:
          DOCTOR_RESULTS: ${{ toJSON(needs) }}
          DOCTOR_REQUIRED: ${{ needs.doctor-plan.outputs.required_jobs }}
        run: |
          import json, os
          jobs = json.loads(os.environ['DOCTOR_RESULTS'])
          if jobs['doctor-plan']['result'] != 'success':
              raise SystemExit('Doctor planning failed: no CI verdict')
          if any(job.get('result') in {'failure', 'cancelled'} for job in jobs.values()):
              raise SystemExit('A Doctor validation failed or was cancelled')
          required = json.loads(os.environ['DOCTOR_REQUIRED'])
          for name in required:
              if jobs.get(name, {}).get('result') != 'success':
                  raise SystemExit('Required CI did not succeed: ' + name)
          print('Doctor selected CI: PASS. FULL/phase certification requires its own exact-SHA evidence.')
