  safe-validation:
    name: Public PR / Safe Validation
    if: always() && github.event_name == 'pull_request'
    needs: [doctor-plan, focused-validation, certify, pr-fast-validation, ai_context_ci, app_ci, atlas_windows_distribution, doctor_certification, doctor_runtime_perf, doctor_ui, encyclopedia_provider_import, graphify_map, graphify_targeted_ci, json_focused_data_contract, phase8_memory_benchmark, phase8_preload_benchmark, signature_report]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject failed or skipped selected CI
        shell: python
        env:
          DOCTOR_RESULTS: ${{ toJSON(needs) }}
          DOCTOR_REQUIRED: ${{ needs.doctor-plan.outputs.required_jobs }}
        run: |
          import json, os
          jobs = json.loads(os.environ['DOCTOR_RESULTS'])
          if jobs['doctor-plan']['result'] != 'success':
              raise SystemExit('Doctor planning failed: no CI verdict')
          if any(job.get('result') in {'failure', 'cancelled'} for job in jobs.values()):
              raise SystemExit('A Doctor validation failed or was cancelled')
          required = json.loads(os.environ['DOCTOR_REQUIRED'])
          for name in required:
              if jobs.get(name, {}).get('result') != 'success':
                  raise SystemExit('Required CI did not succeed: ' + name)
          print('Doctor selected CI: PASS. FULL/phase certification requires its own exact-SHA evidence.')

  doctor-verdict:
    name: Doctor / CI Verdict
    if: always()
    needs: [doctor-plan, focused-validation, certify, pr-fast-validation, safe-validation, certification-policy, ai_context_ci, app_ci, atlas_windows_distribution, doctor_certification, doctor_runtime_perf, doctor_ui, encyclopedia_provider_import, graphify_map, graphify_targeted_ci, json_focused_data_contract, phase8_memory_benchmark, phase8_preload_benchmark, signature_report]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject failed or skipped selected CI
        shell: python
        env:
          DOCTOR_RESULTS: ${{ toJSON(needs) }}
          DOCTOR_REQUIRED: ${{ needs.doctor-plan.outputs.required_jobs }}
        run: |
          import json, os
          jobs = json.loads(os.environ['DOCTOR_RESULTS'])
          if jobs['doctor-plan']['result'] != 'success':
              raise SystemExit('Doctor planning failed: no CI verdict')
          if any(job.get('result') in {'failure', 'cancelled'} for job in jobs.values()):
              raise SystemExit('A Doctor validation failed or was cancelled')
          required = json.loads(os.environ['DOCTOR_REQUIRED'])
          for name in required:
              if jobs.get(name, {}).get('result') != 'success':
                  raise SystemExit('Required CI did not succeed: ' + name)
          print('Doctor selected CI: PASS. FULL/phase certification requires its own exact-SHA evidence.')
