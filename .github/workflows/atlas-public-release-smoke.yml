name: Atlas Public Release Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Atlas Windows Distribution"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-public-release-smoke-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  public-windows-install:
    name: Public GitHub CDN + Frozen Setup on fresh Windows
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact certified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Configure Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Probe actual public release over HTTPS and install published setup
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          python -m scripts.windows.probe_public_release --expected-source-sha "$env:EXPECTED_SHA" --verify-setup --output artifacts/public_release_probe.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep public install evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-public-install-evidence-${{ github.run_id }}
          path: artifacts/public_release_probe.json
          if-no-files-found: warn
          retention-days: 30
