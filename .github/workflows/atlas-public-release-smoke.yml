name: Atlas Public Release Smoke

on:
  # Do not test stale public artifacts on code push before publishing.
  # The real public E2E runs only after a successful distribution workflow.
  workflow_dispatch:
    inputs:
      certify_installed_sha:
        description: Exact already-certified public source SHA for supplemental installed-binary E2E
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["Atlas Windows Distribution"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-public-release-smoke-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  detect-publication:
    name: Verify upstream release publication
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.proof.outputs.published }}
      status: ${{ steps.proof.outputs.status }}
      source_sha: ${{ steps.proof.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The publication helper ships with this workflow; older sources may predate it.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Require host proof of a successful publication step
        id: proof
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m tools.ci_distribution_publication
          --event-path "$GITHUB_EVENT_PATH"
          --repo "$GITHUB_REPOSITORY"
          --output artifacts/publication-proof.json
          --github-output "$GITHUB_OUTPUT"
      - name: Keep publication routing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atlas-publication-proof-${{ github.run_id }}
          path: artifacts/publication-proof.json
          if-no-files-found: warn
          retention-days: 30

  supplemental-public-upgrade:
    name: Real public launcher update from previous verified public payload
    if: github.event_name == 'workflow_dispatch' && inputs.certify_installed_sha != ''
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.certify_installed_sha }}
          path: certified-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Require actual public auto-update, exact SHA and personal data preservation
        shell: pwsh
        env:
          ATLAS_CI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.certify_installed_sha }}
        run: |
          python -m scripts.windows.certify_public_install --upgrade --source-sha "$env:EXPECTED_SHA" --source-root certified-source --output artifacts/public-upgrade-e2e.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain public auto-update evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atlas-public-upgrade-e2e-${{ github.run_id }}
          path: artifacts/public-upgrade-e2e.json
          if-no-files-found: error
          retention-days: 30

  supplemental-installed-e2e:
    name: Installed public EXEs — interruption, custom path, workers, normal quit, relaunch
    if: github.event_name == 'workflow_dispatch' && inputs.certify_installed_sha != ''
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact certified source for locked data inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.certify_installed_sha }}
          path: certified-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Require real installed-binary checks before declaring PASS
        shell: pwsh
        env:
          ATLAS_CI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.certify_installed_sha }}
        run: |
          python -m scripts.windows.certify_public_install --source-sha "$env:EXPECTED_SHA" --source-root certified-source --output artifacts/installed-public-e2e.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain detailed installed-binary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atlas-installed-public-e2e-${{ github.run_id }}
          path: artifacts/installed-public-e2e.json
          if-no-files-found: error
          retention-days: 30

  public-windows-install:
    name: Public GitHub CDN + Frozen Setup on fresh Windows
    needs: [detect-publication]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        needs.detect-publication.result == 'success' &&
        needs.detect-publication.outputs.published == 'true'))
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact certified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Configure Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Probe actual public release over HTTPS and install published setup
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          ATLAS_CI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.windows.probe_public_release --expected-source-sha "$env:EXPECTED_SHA" --verify-setup --output artifacts/public_release_probe.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep public install evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atlas-public-install-evidence-${{ github.run_id }}
          path: artifacts/public_release_probe.json
          if-no-files-found: warn
          retention-days: 30

  complete-first-install:
    name: E2E first boot — public 2.66 GB download + Qt-ready activation
    needs: [detect-publication, public-windows-install]
    # Exercise the entire real Windows first-install path only AFTER a
    # successful distribution run, not before a Release exists. An ordinary
    # code push cannot certify a not-yet-published EXE or 2.66 GB archive.
    if: >-
      always() &&
      needs.detect-publication.result == 'success' &&
      needs.detect-publication.outputs.published == 'true' &&
      needs.public-windows-install.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact source of published release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Configure Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Download complete public Release and activate Qt application
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          ATLAS_CI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.windows.probe_public_release --expected-source-sha "$env:EXPECTED_SHA" --full-install --output artifacts/public_full_first_install.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep full first-install evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atlas-full-first-install-${{ github.run_id }}
          path: artifacts/public_full_first_install.json
          if-no-files-found: warn
          retention-days: 30
