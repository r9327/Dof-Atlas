name: Phase 7B Performance Diagnostic

on:
  pull_request:
    branches:
      - phase7b-content-virtualization
    paths:
      - "app/modules/encyclopedia/tools/diagnose_phase7b_performance.py"
      - ".github/workflows/phase7b-performance-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Materialize local catalogues
        shell: pwsh
        run: |
          python -m app.modules.encyclopedia.tools.ensure_local_catalogs
      - name: Run Phase 7B diagnostic only
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          python -m app.modules.encyclopedia.tools.diagnose_phase7b_performance 2>&1 | Tee-Object -FilePath artifacts/phase7b_performance_diagnostic.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7b-performance-diagnostic
          path: |
            artifacts/phase7b_performance_diagnostic.json
            artifacts/phase7b_performance_diagnostic.log
          if-no-files-found: error
