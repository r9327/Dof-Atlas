name: Apply Guide manual resolver fix

on:
  push:
    branches:
      - cleanup/final-foundation

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/final-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
      - name: Apply verified patch
        run: python tools/_apply_cleanup_guide_memo.py
      - name: Compile changed Python
        run: |
          python -m py_compile \
            app/modules/encyclopedia/services/guide_ultime_manual_route.py \
            app/modules/encyclopedia/services/guide_ultime_manual_runtime_service.py \
            tests/test_guide_ultime_v5_runtime.py
      - name: Run targeted runtime tests
        run: python -m unittest tests.test_guide_ultime_v5_runtime -v
      - name: Check diff
        run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/modules/encyclopedia/services/guide_ultime_manual_route.py \
            app/modules/encyclopedia/services/guide_ultime_manual_runtime_service.py \
            tests/test_guide_ultime_v5_runtime.py
          git commit -m "perf(guide): memoize manual chapter resolution"
          git push origin HEAD:cleanup/final-foundation
