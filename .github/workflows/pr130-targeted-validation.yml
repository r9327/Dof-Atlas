name: Temporary PR130 Targeted Guide Lookup
on:
  push:
    branches:
      - ci/pr130-guide-prereq-targeted-20261010
permissions:
  contents: read
jobs:
  targeted:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt
      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
      - name: Run only targeted Guide and CI tooling tests
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v tests.test_guide_prerequisite_lookup tests.test_ci_history tests.test_ci_dev_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
