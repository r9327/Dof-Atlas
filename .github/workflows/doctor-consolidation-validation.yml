name: Temporary Doctor observations targeted consolidation
on:
  push:
    branches: [diagnostic/doctor-consolidation-validation]
permissions:
  contents: read
jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --disable-software-rasterizer"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8ae1a794bd79b495356fda762a53370fe5ff3b11
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt
      - name: Verify source and generate canonical context index
        shell: pwsh
        run: |
          git rev-parse HEAD
          if ((git rev-parse HEAD).Trim() -ne "8ae1a794bd79b495356fda762a53370fe5ff3b11") { throw "Wrong source SHA" }
          git status --short
          git branch --show-current
          git fetch origin
          python -m tools.ai_context sync --stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "Atlas diagnostic validation"
          git config user.email "atlas-diagnostic@example.invalid"
          git commit -m "diagnostic: canonical target index"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import base64,pathlib;print('CANONICAL_INDEX_BASE64='+base64.b64encode(pathlib.Path('.ai/context_index.json').read_bytes()).decode())"
          git rev-parse "HEAD^{tree}"
          python -m tools.ai_context check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked application dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pyside.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Targeted Doctor Agent Graph and Tool Catalog contracts
        shell: pwsh
        run: |
          python -m unittest tests.test_canonical_manual_bundle_validation tests.test_atlas_doctor tests.test_atlas_doctor_graphify tests.test_agent_verification tests.test_doctor_verification_contract tests.test_guide_integrity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual static Doctor and clean worktree
        shell: pwsh
        run: |
          python -m tools.atlas_doctor quick --json > "$env:RUNNER_TEMP/doctor-after.json"
          $env:DOCTOR_EXIT = "$LASTEXITCODE"
          python -c "import json,os,pathlib; p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'doctor-after.json').read_text(encoding='utf-8-sig')); assert (int(os.environ['DOCTOR_EXIT']),p['summary']['verdict']) in ((0,'PASS'),(1,'WARN')); assert p['analysis_sources']['graph'] is False; print('DOCTOR_AFTER='+json.dumps({'summary':p['summary'],'issues':p.get('issues',[]),'analysis_sources':p['analysis_sources']}))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.ai_context check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git status --short).Length -gt 0) { throw "Validation mutated tracked worktree" }
