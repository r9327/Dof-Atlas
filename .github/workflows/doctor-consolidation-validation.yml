name: Temporary Doctor quick before after cost
on:
  push:
    branches: [diagnostic/doctor-consolidation-validation]
permissions:
  contents: read
jobs:
  quick-cost:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd5b2cbe28e77cfff73754eafdc427d60f091e8e
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Compare real quick cost on one Windows runner
        shell: pwsh
        run: |
          @'
          import json,os,pathlib,statistics,subprocess,sys,time
          root=pathlib.Path.cwd();results={}
          for label,sha,count in [("before","c580ea3077f7e68f926c6e0e9bf6478908fee54f",262),("after","cd5b2cbe28e77cfff73754eafdc427d60f091e8e",256)]:
              path=pathlib.Path(os.environ["RUNNER_TEMP"])/("doctor-cost-"+label)
              subprocess.run(["git","worktree","add","--detach",str(path),sha],cwd=root,check=True)
              assert subprocess.check_output(["git","rev-parse","HEAD"],cwd=path,text=True).strip()==sha
              subprocess.run([sys.executable,"-m","tools.ai_context","check"],cwd=path,check=True)
              durations=[]
              for sample in range(3):
                  started=time.perf_counter()
                  completed=subprocess.run([sys.executable,"-m","tools.atlas_doctor","quick","--json"],cwd=path,capture_output=True,text=True,encoding="utf-8",timeout=120)
                  wall_ms=round((time.perf_counter()-started)*1000,3)
                  p=json.loads(completed.stdout)
                  assert completed.returncode in (0,1) and p["summary"]["verdict"] in ("PASS","WARN"),(completed.returncode,completed.stderr,p)
                  assert p["git"]["head"]==sha and p["summary"]["issues_total"]==count
                  assert p["summary"]["severity"]["CRITICAL"]==0
                  assert not (path/"graphify-out").exists()
                  if label=="after": assert p["analysis_sources"]["graph"] is False
                  durations.append(wall_ms)
              assert not subprocess.check_output(["git","status","--short"],cwd=path,text=True).strip()
              results[label]={"sha":sha,"issues":count,"wall_ms":durations,"median_ms":statistics.median(durations)}
          results["delta_percent"]=round((results["after"]["median_ms"]/results["before"]["median_ms"]-1)*100,2)
          results["interpretation"]="Same runner and Python, three real CLI launches each; timing remains measurement, not a validation-authority override."
          print("QUICK_COST_COMPARISON="+json.dumps(results))
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"quick-cost.json").write_text(json.dumps(results,indent=2),encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-quick-cost-cd5b2cbe28e77cfff73754eafdc427d60f091e8e
          path: ${{ runner.temp }}/quick-cost.json
