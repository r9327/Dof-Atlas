name: PR365 isolated large-file audit
on:
  push:
    branches: [audit/pr365-50ddcbe1]
    paths: [.github/workflows/pr365-isolated-large-file-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 50ddcbe1e7b5160f3670117f0b3d8d1cee3d34a0
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Inspect six complete file changes and compare quest data
        run: |
          python - <<'PY'
          import ast, collections, hashlib, json, pathlib, subprocess
          B='76c0008bdfcbb8dca3315121496e5e52388e0b9f'
          H='50ddcbe1e7b5160f3670117f0b3d8d1cee3d34a0'
          def git(*args): return subprocess.check_output(['git',*args])
          assert git('rev-parse','HEAD').decode().strip()==H
          paths=['app/modules/encyclopedia/views/shared_manual_guide_view.py','app/pages/dev_ui_page.py','app/ui/theme.py','data/encyclopedia/quests/quests_enriched.json','docs/plans/atlas-ui-global-fixes-2026-11-03.md','tests/test_dev_ui_page.py']
          out=pathlib.Path('artifacts/pr365-large-files')
          out.mkdir(parents=True,exist_ok=True)
          results=[]
          for p in paths:
              b=subprocess.run(['git','show',B+':'+p],capture_output=True)
              a=b.stdout if b.returncode==0 else None
              z=git('show',H+':'+p)
              patch=git('diff','--no-ext-diff','--no-renames',B,H,'--',p)
              (out/(p.replace('/','__')+'.diff')).write_bytes(patch)
              row={'path':p,'base_bytes':len(a) if a is not None else None,'head_bytes':len(z),'patch_bytes':len(patch),'sha256':hashlib.sha256(z).hexdigest()}
              if p.endswith('.py'):
                  tree=ast.parse(z)
                  row['syntax']='PASS'
                  row['definitions']=sum(isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)) for n in ast.walk(tree))
                  row['duplicate_methods']=[{'class':n.name,'names':[k for k,v in collections.Counter(f.name for f in n.body if isinstance(f,(ast.FunctionDef,ast.AsyncFunctionDef))).items() if v>1]} for n in ast.walk(tree) if isinstance(n,ast.ClassDef) and any(v>1 for v in collections.Counter(f.name for f in n.body if isinstance(f,(ast.FunctionDef,ast.AsyncFunctionDef))).values())]
              if p.endswith('.json'):
                  def decode(raw):
                      duplicates=[]
                      def pairs(items):
                          d={}
                          for k,v in items:
                              if k in d: duplicates.append(k)
                              d[k]=v
                          return d
                      result=json.loads(raw,object_pairs_hook=pairs)
                      return result,duplicates
                  old,od=decode(a)
                  new,nd=decode(z)
                  row.update(json_syntax='PASS',base_duplicate_keys=len(od),head_duplicate_keys=len(nd),base_type=type(old).__name__,head_type=type(new).__name__,base_count=len(old),head_count=len(new))
                  def records(x):
                      if isinstance(x,list): return x
                      if isinstance(x,dict):
                          for k in ('quests','data','items','results'):
                              if isinstance(x.get(k),list): return x[k]
                          if all(isinstance(v,dict) for v in x.values()): return [dict(v, __audit_key=k) for k,v in x.items()]
                      return []
                  def index(x):
                      rec=records(x)
                      ids=[next((r[k] for k in ('id','quest_id','questId','__audit_key') if k in r),None) for r in rec if isinstance(r,dict)]
                      return {str(i):r for i,r in zip(ids,rec) if i is not None},len(rec),len(ids)-len(set(str(i) for i in ids)),ids.count(None)
                  oi,oc,odu,om=index(old)
                  ni,nc,ndu,nm=index(new)
                  common=set(oi)&set(ni)
                  changed=[k for k in common if oi[k]!=ni[k]]
                  fields=collections.Counter(f for k in changed for f in set(oi[k])|set(ni[k]) if oi[k].get(f)!=ni[k].get(f) or (f in oi[k])!=(f in ni[k]))
                  row.update(base_records=oc,head_records=nc,base_duplicate_ids=odu,head_duplicate_ids=ndu,base_missing_ids=om,head_missing_ids=nm,added_ids=sorted(set(ni)-set(oi)),removed_ids=sorted(set(oi)-set(ni)),changed_records=len(changed),changed_fields=dict(fields))
                  changes=[{'id':k,'fields':{f:{'before':oi[k].get(f),'after':ni[k].get(f)} for f in set(oi[k])|set(ni[k]) if oi[k].get(f)!=ni[k].get(f) or (f in oi[k])!=(f in ni[k])}} for k in sorted(changed)]
                  (out/'quest-record-changes.json').write_text(json.dumps(changes,ensure_ascii=False,indent=2))
              results.append(row)
              print(json.dumps(row,ensure_ascii=False))
          (out/'summary.json').write_text(json.dumps({'head':H,'base':B,'files':results},ensure_ascii=False,indent=2))
          assert len(results)==6
          print('COMPLETE SIX FILE INVENTORY; semantic review separate')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr365-six-complete-file-diffs
          path: artifacts/pr365-large-files/
          if-no-files-found: error
          retention-days: 30
