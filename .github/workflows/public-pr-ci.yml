name: Public Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dof-atlas-public-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  safe-validation:
    name: Public PR / Safe Validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "PR checkout mismatch: expected $env:CANDIDATE_SHA, got $actual"
          }
          Write-Host "PR candidate SHA: $actual"
          Write-Host "PR base SHA: $env:BASE_SHA"

      - name: Reject vulnerable dependency changes
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: development, runtime, unknown

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Validate pull request diff hygiene
        shell: pwsh
        run: |
          git diff --check "$env:BASE_SHA...HEAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run canonical Doctor FAST merge gate
        id: doctor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/pr_doctor" | Out-Null
          $report = "artifacts/pr_doctor/doctor-fast.json"

          python -X faulthandler -m tools.atlas_doctor verify --gate fast --base-ref "$env:BASE_SHA" --json 1> $report
          $doctorExit = $LASTEXITCODE

          if (-not (Test-Path -LiteralPath $report)) {
            throw "Atlas Doctor did not produce its machine-readable report."
          }

          $payload = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $integrityStatus = [string]$payload.integrity.status
          $criticalCount = [int]$payload.audit.severity.CRITICAL

          Write-Host "Doctor status: $($payload.status)"
          Write-Host "Atlas Integrity FAST status: $integrityStatus"
          Write-Host "Doctor CRITICAL findings: $criticalCount"

          # Doctor exit code 1 means REVIEW (for example pre-existing HIGH findings
          # or no previous local audit baseline). The merge gate blocks only hard
          # Doctor failure, failed FAST integrity evidence, or a CRITICAL finding.
          if ($doctorExit -ge 2 -or $integrityStatus -ne "PASS" -or $criticalCount -gt 0) {
            throw "Doctor FAST merge gate failed. Inspect artifacts/pr_doctor/doctor-fast.json."
          }
          if ($doctorExit -eq 1) {
            Write-Warning "Doctor returned REVIEW; non-blocking advisory findings are recorded in the report."
          }

      - name: Run merge-safety contracts outside Doctor FAST policy
        shell: pwsh
        run: |
          # Doctor FAST ARCHITECTURE owns tests.test_project_guardrails.
          python -X faulthandler -m unittest -v `
            tests.test_atlas_integrity `
            tests.test_ci_runner_guardrails `
            tests.test_phase_certification_guardrails `
            tests.test_repository_git_hooks `
            tests.test_public_pr_ci_guardrails `
            tests.test_security_hardening_guardrails
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Doctor merge evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-doctor-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr_doctor/**
          if-no-files-found: warn
          retention-days: 14

      - name: Report PR validation boundary
        if: ${{ always() }}
        shell: pwsh
        run: |
          Write-Host "PR SAFE VALIDATION ONLY - NOT PHASE CERTIFICATION"
          Write-Host "A phase is CERTIFIED only by Phase Certification / Full Validation on the exact candidate SHA."
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## PR SAFE VALIDATION ONLY"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Candidate SHA: ``$env:CANDIDATE_SHA``"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Required merge gate: ``Atlas Doctor FAST`` through ``Public PR / Safe Validation``."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- This workflow is **NOT PHASE CERTIFICATION**."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- A phase can be declared **CERTIFIED** only after ``Phase Certification / Full Validation`` succeeds on the exact candidate SHA."
          }

      - name: Enforce dependency review verdict
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ("${{ steps.dependency_review.outcome }}" -ne "success") {
            throw "Dependency Review must succeed; enable Dependency Graph and resolve any reported vulnerable dependency before merge."
          }
          Write-Host "Dependency Review verdict: success"
