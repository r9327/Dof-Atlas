name: Public Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dof-atlas-public-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safe-validation:
    name: Public PR / Safe Validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install -r requirements-pyside.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app local_dofus_data main.py

      - name: Run public-safe regression checks
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_character_identity_invariants `
            tests.test_character_data_service `
            tests.test_project_guardrails `
            tests.test_performance_guardrails
