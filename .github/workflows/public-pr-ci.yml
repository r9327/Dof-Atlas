name: Public Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dof-atlas-public-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safe-validation:
    name: Public PR / Safe Validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: development, runtime, unknown

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pyside.txt

      - name: Install application dependencies
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-pyside.txt

      - name: Compile Python sources and guardrails
        shell: pwsh
        run: python -m compileall -q app local_dofus_data tools tests main.py

      - name: Validate pull request diff hygiene
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$env:BASE_SHA...HEAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reject generated files and probable secrets
        shell: pwsh
        run: |
          python -m tools.check_generated_files --root . --tracked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify repository meta integrity
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m tools.atlas_meta_integrity --root . --base-ref "$env:BASE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run public-safe critical regression checks
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.test_architecture_debt_baseline `
            tests.test_clean_foundation_guardrails `
            tests.test_character_identity_contract `
            tests.test_character_identity_guardrails `
            tests.test_character_identity_invariants `
            tests.test_character_write_boundaries `
            tests.test_character_data_service `
            tests.test_progress_concurrent_instances `
            tests.test_quest_progress_batch_contract `
            tests.test_project_guardrails `
            tests.test_generated_files_guard `
            tests.test_generated_file_guardrails `
            tests.test_repository_git_hooks `
            tests.test_meta_integrity `
            tests.test_atlas_integrity `
            tests.test_ci_runner_guardrails `
            tests.test_performance_guardrails `
            tests.test_public_pr_ci_guardrails `
            tests.test_phase_certification_guardrails `
            tests.test_security_hardening_guardrails

      - name: Run Phase 1 closure regression targets
        shell: pwsh
        run: |
          python -X faulthandler -m unittest -v `
            tests.test_alignment_order_identity_boundary `
            tests.test_direction_macro `
            tests.test_profile_settings_service `
            tests.test_profile_storage_bridge `
            tests.test_quest_source_boundaries
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report PR validation boundary
        if: ${{ always() }}
        shell: pwsh
        run: |
          Write-Host "PR SAFE VALIDATION ONLY - NOT PHASE CERTIFICATION"
          Write-Host "A phase is CERTIFIED only by Phase Certification / Full Validation on the exact candidate SHA."
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## PR SAFE VALIDATION ONLY"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "This workflow is **NOT PHASE CERTIFICATION**."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "A phase can be declared **CERTIFIED** only after `Phase Certification / Full Validation` succeeds on the exact candidate SHA."
          }

      - name: Enforce dependency review verdict
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ("${{ steps.dependency_review.outcome }}" -ne "success") {
            throw "Dependency Review must succeed; enable Dependency Graph and resolve any reported vulnerable dependency before merge."
          }
          Write-Host "Dependency Review verdict: success"
