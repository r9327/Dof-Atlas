name: Guides Phase 0 - exact SHA Graphify evidence

# On-demand, narrow proof bridge for PR #363, not an additional release
# certification gate. Only changing this bridge triggers the reusable existing
# Graphify / Doctor workflow; ordinary guide edits never trigger full graphing.
on:
  push:
    branches: [feat/atlas-guide-importer-pr337-20261102]
    paths:
      - .github/workflows/guide-phase0-graphify.yml

permissions:
  contents: read

jobs:
  existing-graphify-doctor:
    name: Existing Graphify and Doctor architecture evidence
    if: github.ref == 'refs/heads/feat/atlas-guide-importer-pr337-20261102'
    uses: ./.github/workflows/graphify-map.yml
